<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>家庭全周大采购管理端 (后台)</title>
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
    <style>
        .no-scrollbar::-webkit-scrollbar { display: none; }
        .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
    </style>
</head>
<body class="bg-amber-50/40 text-gray-800 pb-32">

    <!-- 顶部导航 -->
    <header class="bg-white shadow-xs sticky top-0 z-40 px-3 py-3 flex justify-between items-center w-full">
        <div class="flex items-center space-x-2">
            <span class="text-xl">🛒</span>
            <div>
                <h1 class="font-bold text-sm text-amber-900 leading-tight">家庭采购管理后台</h1>
                <p class="text-[10px] text-gray-400">实时统计与超市勾选</p>
            </div>
        </div>
        <div class="flex items-center space-x-1.5">
            <button onclick="openSupermarketMode()" class="bg-emerald-600 hover:bg-emerald-700 text-white text-xs font-bold px-3 py-1.5 rounded-lg transition flex items-center space-x-1 shadow-xs">
                <i class="fa-solid fa-basket-shopping"></i>
                <span>去超市买菜</span>
            </button>
            <button onclick="openAddDishModal()" class="bg-amber-600 hover:bg-amber-700 text-white text-xs font-bold px-3 py-1.5 rounded-lg transition flex items-center space-x-1 shadow-xs">
                <i class="fa-solid fa-plus"></i>
                <span>加菜</span>
            </button>
        </div>
    </header>

    <!-- 主体内容区 -->
    <main class="w-full max-w-lg mx-auto p-3 space-y-4">
        
        <!-- 顶部统计看板 -->
        <div class="grid grid-cols-2 gap-3">
            <div class="bg-white p-3.5 rounded-2xl border border-amber-200/60 shadow-xs space-y-1">
                <p class="text-[11px] text-gray-400">本周预估总花费</p>
                <p class="text-lg font-extrabold text-amber-800">¥<span id="totalBudget">0</span></p>
            </div>
            <div class="bg-white p-3.5 rounded-2xl border border-amber-200/60 shadow-xs space-y-1">
                <p class="text-[11px] text-gray-400">菜品总数 / 预定单数</p>
                <p class="text-lg font-extrabold text-amber-900"><span id="totalDishesCount">0</span> 样 / <span id="totalOrdersCount">0</span> 单</p>
            </div>
        </div>

        <!-- 选项卡切换 -->
        <div class="flex bg-amber-100/60 p-1 rounded-xl text-xs font-bold">
            <button onclick="switchTab('summary')" id="tab-summary" class="flex-1 py-2 rounded-lg bg-white text-amber-900 shadow-xs transition">采购总清单</button>
            <button onclick="switchTab('orders')" id="tab-orders" class="flex-1 py-2 rounded-lg text-gray-600 transition">全家点菜明细</button>
            <button onclick="switchTab('dishes')" id="tab-dishes" class="flex-1 py-2 rounded-lg text-gray-600 transition">菜品库管理</button>
        </div>

        <!-- 面板 1：采购总清单（按菜品合并） -->
        <div id="panel-summary" class="space-y-3">
            <div class="bg-white rounded-2xl p-3 border border-amber-200/60 shadow-xs space-y-2">
                <h3 class="font-bold text-xs text-amber-900 flex items-center justify-between">
                    <span><i class="fa-solid fa-list-check mr-1 text-amber-600"></i>全周采购合并汇总清单</span>
                    <span class="text-[10px] text-gray-400">自动汇总全家需求</span>
                </h3>
                <div id="summaryListContainer" class="space-y-2 pt-1">
                    <div class="text-center py-10 text-gray-400 text-xs">正在计算采购清单...</div>
                </div>
            </div>
        </div>

        <!-- 面板 2：全家点菜明细 -->
        <div id="panel-orders" class="space-y-3 hidden">
            <div class="bg-white rounded-2xl p-3 border border-amber-200/60 shadow-xs space-y-2">
                <h3 class="font-bold text-xs text-amber-900 flex items-center justify-between">
                    <span><i class="fa-solid fa-receipt mr-1 text-amber-600"></i>家庭成员预定记录</span>
                    <span class="text-[10px] text-gray-400">可在这里删除误点的订单</span>
                </h3>
                <div id="ordersListContainer" class="space-y-2.5 pt-1">
                    <div class="text-center py-10 text-gray-400 text-xs">暂无点菜订单...</div>
                </div>
            </div>
        </div>

        <!-- 面板 3：菜品库管理 -->
        <div id="panel-dishes" class="space-y-3 hidden">
            <div class="bg-white rounded-2xl p-3 border border-amber-200/60 shadow-xs space-y-2">
                <h3 class="font-bold text-xs text-amber-900 flex items-center justify-between">
                    <span><i class="fa-solid fa-utensils mr-1 text-amber-600"></i>可选菜单库管理</span>
                    <button onclick="openAddDishModal()" class="text-amber-600 text-xs font-bold"><i class="fa-solid fa-plus mr-1"></i>添加新菜</button>
                </h3>
                <div id="dishesListContainer" class="grid grid-cols-1 gap-2.5 pt-1">
                    <div class="text-center py-10 text-gray-400 text-xs">加载菜品库中...</div>
                </div>
            </div>
        </div>
    </main>

    <!-- 🌟 超市采购勾选大屏模式弹窗 -->
    <div id="supermarketModal" class="fixed inset-0 bg-white z-50 flex flex-col hidden">
        <div class="bg-emerald-600 text-white px-4 py-3 flex justify-between items-center shadow-md">
            <div class="flex items-center space-x-2">
                <i class="fa-solid fa-basket-shopping text-lg"></i>
                <h2 class="font-bold text-sm">超市采购专用核对模式</h2>
            </div>
            <button onclick="closeSupermarketMode()" class="bg-emerald-700 hover:bg-emerald-800 text-white px-3 py-1.5 rounded-lg text-xs font-bold transition">退出并保存</button>
        </div>
        <div class="bg-emerald-50 px-4 py-2 text-[11px] text-emerald-800 border-b flex justify-between items-center">
            <span>在超市买一样勾选一样，家人前台可实时同步状态！</span>
            <span id="supermarketProgress" class="font-bold">已买: 0 / 0</span>
        </div>
        <div id="supermarketListContainer" class="flex-1 overflow-y-auto p-3 space-y-2.5 max-w-lg mx-auto w-full">
            <!-- 动态生成超市勾选列表 -->
        </div>
    </div>

    <!-- 添加/编辑菜品弹窗 -->
    <div id="dishModal" class="fixed inset-0 bg-black/60 z-50 flex items-center justify-center hidden p-3">
        <div class="bg-white w-full max-w-xs rounded-2xl p-4 shadow-2xl space-y-3">
            <h3 class="font-bold text-sm text-amber-900" id="dishModalTitle">添加新菜品</h3>
            <input type="hidden" id="editDishId">
            <div class="space-y-2.5 text-xs">
                <div>
                    <label class="text-gray-500 block mb-1">菜品名称</label>
                    <input type="text" id="dishNameInput" placeholder="例如：红烧肉" class="w-full bg-gray-50 border rounded-xl px-3 py-2 outline-none focus:border-amber-500">
                </div>
                <div>
                    <label class="text-gray-500 block mb-1">分类</label>
                    <select id="dishCategoryInput" class="w-full bg-gray-50 border rounded-xl px-3 py-2 outline-none focus:border-amber-500">
                        <option value="热菜">热菜</option>
                        <option value="凉菜">凉菜</option>
                        <option value="主食/汤品">主食/汤品</option>
                        <option value="饮品/甜点">饮品/甜点</option>
                    </select>
                </div>
                <div>
                    <label class="text-gray-500 block mb-1">预估价格 (¥)</label>
                    <input type="number" id="dishPriceInput" placeholder="38" class="w-full bg-gray-50 border rounded-xl px-3 py-2 outline-none focus:border-amber-500">
                </div>
                <div>
                    <label class="text-gray-500 block mb-1">图片链接 (URL)</label>
                    <input type="text" id="dishImageInput" placeholder="https://..." class="w-full bg-gray-50 border rounded-xl px-3 py-2 outline-none focus:border-amber-500">
                </div>
                <div>
                    <label class="text-gray-500 block mb-1">简介</label>
                    <input type="text" id="dishDescInput" placeholder="软烂香甜，老少皆宜" class="w-full bg-gray-50 border rounded-xl px-3 py-2 outline-none focus:border-amber-500">
                </div>
            </div>
            <div class="flex space-x-2 pt-1">
                <button onclick="closeDishModal()" class="flex-1 bg-gray-100 hover:bg-gray-200 text-gray-700 py-2 rounded-xl text-xs font-bold transition">取消</button>
                <button onclick="saveDish()" class="flex-1 bg-amber-600 hover:bg-amber-700 text-white py-2 rounded-xl text-xs font-bold transition">保存</button>
            </div>
        </div>
    </div>

    <script>
        const API_URL = 'https://api.npoint.io/692e9e8f65204c754fc5';
        let cloudData = { dishes: [], orders: [] };
        let currentTab = 'summary';

        async function fetchAllData() {
            try {
                let res = await fetch(API_URL + '?t=' + Date.now());
                let json = await res.json();
                if (json) {
                    cloudData = json;
                    if (!cloudData.dishes) cloudData.dishes = [];
                    if (!cloudData.orders) cloudData.orders = [];
                }
            } catch (e) {
                console.log('同步云端数据失败', e);
            }
            renderAll();
        }

        async function saveAllData() {
            try {
                await fetch(API_URL, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(cloudData)
                });
            } catch (e) {
                alert('云端同步失败，请检查网络！');
            }
        }

        window.onload = function() {
            fetchAllData();
            setInterval(fetchAllData, 8other = 8000);
        }

        function switchTab(tab) {
            currentTab = tab;
            ['summary', 'orders', 'dishes'].forEach(t => {
                let btn = document.getElementById(`tab-${t}`);
                let panel = document.getElementById(`panel-${t}`);
                if (t === tab) {
                    btn.className = "flex-1 py-2 rounded-lg bg-white text-amber-900 shadow-xs transition";
                    panel.classList.remove('hidden');
                } else {
                    btn.className = "flex-1 py-2 rounded-lg text-gray-600 transition";
                    panel.classList.add('hidden');
                }
            });
            renderAll();
        }

        function renderAll() {
            renderStats();
            if (currentTab === 'summary') renderSummary();
            if (currentTab === 'orders') renderOrders();
            if (currentTab === 'dishes') renderDishesAdmin();
            if (!document.getElementById('supermarketModal').classList.contains('hidden')) {
                renderSupermarketList();
            }
        }

        function renderStats() {
            let totalBudget = 0;
            (cloudData.orders || []).forEach(o => {
                totalBudget += (o.totalPrice || 0);
            });
            document.getElementById('totalBudget').innerText = totalBudget;
            document.getElementById('totalDishesCount').innerText = (cloudData.dishes || []).length;
            document.getElementById('totalOrdersCount').innerText = (cloudData.orders || []).length;
        }

        // 渲染采购总清单
        function renderSummary() {
            const container = document.getElementById('summaryListContainer');
            let orders = cloudData.orders || [];

            if (orders.length === 0) {
                container.innerHTML = `<div class="text-center py-10 text-gray-400 text-xs">还没有家人提交任何点菜订单~</div>`;
                return;
            }

            // 按菜品ID合并统计总量
            let summaryMap = {};
            let dishMap = {};
            (cloudData.dishes || []).forEach(d => { dishMap[d.id] = d; });

            orders.forEach(o => {
                (o.items || []).forEach(item => {
                    if (!summaryMap[item.id]) {
                        summaryMap[item.id] = {
                            id: item.id,
                            name: item.name,
                            price: item.price,
                            totalCount: 0,
                            days: new Set(),
                            users: new Set(),
                            checked: item.checked || false
                        };
                    }
                    summaryMap[item.id].totalCount += item.count;
                    if (o.targetDay) summaryMap[item.id].days.add(o.targetDay);
                    if (o.user) summaryMap[item.id].users.add(o.user);
                });
            });

            let list = Object.values(summaryMap);
            container.innerHTML = list.map(item => `
                <div class="bg-amber-50/50 border border-amber-200/80 p-3 rounded-xl flex items-center justify-between">
                    <div class="space-y-0.5 flex-1 min-w-0 pr-2">
                        <div class="flex items-center space-x-2">
                            <span class="font-bold text-xs text-gray-800 truncate">${item.name}</span>
                            <span class="text-[10px] bg-amber-600 text-white px-1.5 py-0.2 rounded font-bold shrink-0">共需: ${item.totalCount} 份</span>
                        </div>
                        <p class="text-[10px] text-gray-400">星期: ${Array.from(item.days).join(', ')} | 点菜人: ${Array.from(item.users).join(', ')}</p>
                        <p class="text-xs font-bold text-amber-700">小计: ¥${item.price * item.totalCount}</p>
                    </div>
                </div>
            `).join('');
        }

        // 渲染全家点菜明细（支持删除）
        function renderOrders() {
            const container = document.getElementById('ordersListContainer');
            let orders = cloudData.orders || [];

            if (orders.length === 0) {
                container.innerHTML = `<div class="text-center py-10 text-gray-400 text-xs">暂无点菜订单...</div>`;
                return;
            }

            container.innerHTML = orders.map(order => `
                <div class="bg-amber-50/50 border border-amber-200 p-3 rounded-xl space-y-1.5">
                    <div class="flex justify-between items-center border-b border-amber-100 pb-1">
                        <div class="flex items-center space-x-1.5">
                            <span class="bg-amber-600 text-white text-[10px] px-1.5 py-0.5 rounded font-bold">${order.user || '某位家人'}</span>
                            <span class="font-bold text-xs text-amber-900">${order.targetDay || '周一'}预定</span>
                        </div>
                        <div class="space-x-1">
                            <span class="text-[10px] px-2 py-0.5 rounded-full font-medium ${order.status === '已采购' ? 'bg-green-100 text-green-700' : 'bg-amber-200 text-amber-800'}">${order.status || '待采购'}</span>
                            <button onclick="deleteAdminOrder(${order.id})" class="text-gray-400 hover:text-red-500 text-xs px-1"><i class="fa-solid fa-trash"></i></button>
                        </div>
                    </div>
                    <div class="space-y-0.5 text-xs text-gray-700">
                        ${(order.items || []).map(i => `
                            <div class="flex justify-between">
                                <span>${i.name} x${i.count}</span>
                                <span class="font-bold">¥${i.price * i.count}</span>
                            </div>
                        `).join('')}
                    </div>
                    <div class="flex justify-between items-center pt-1 border-t border-amber-100 text-[10px]">
                        <span class="text-gray-400">时间: ${order.time || ''}</span>
                        <span class="font-bold text-amber-900">总计: ¥${order.totalPrice}</span>
                    </div>
                </div>
            `).join('');
        }

        async function deleteAdminOrder(orderId) {
            if (!confirm('确定要删除该笔家庭订单吗？')) return;
            await fetchAllData();
            cloudData.orders = (cloudData.orders || []).filter(o => o.id !== orderId);
            await saveAllData();
            renderAll();
        }

        // 渲染菜品库管理
        function renderDishesAdmin() {
            const container = document.getElementById('dishesListContainer');
            let dishes = cloudData.dishes || [];

            if (dishes.length === 0) {
                container.innerHTML = `<div class="text-center py-10 text-gray-400 text-xs">菜品库为空，请点击右上角添加新菜~</div>`;
                return;
            }

            container.innerHTML = dishes.map(dish => `
                <div class="bg-white rounded-xl border p-2.5 flex items-center justify-between shadow-xs">
                    <div class="flex items-center space-x-3 flex-1 min-w-0">
                        <img src="${dish.image}" class="w-12 h-12 object-cover rounded-lg shrink-0">
                        <div class="space-y-0.5 flex-1 min-w-0">
                            <div class="flex items-center space-x-1.5">
                                <h4 class="font-bold text-xs text-gray-800 truncate">${dish.name}</h4>
                                <span class="text-[9px] bg-amber-50 text-amber-700 px-1 py-0.2 rounded">${dish.category || '热菜'}</span>
                            </div>
                            <p class="text-[10px] text-amber-600 font-bold">¥${dish.price}</p>
                        </div>
                    </div>
                    <div class="flex items-center space-x-1 shrink-0 ml-2">
                        <button onclick="openEditDishModal(${dish.id})" class="bg-gray-100 hover:bg-gray-200 text-gray-700 p-1.5 rounded-lg text-xs"><i class="fa-solid fa-pen"></i></button>
                        <button onclick="deleteDish(${dish.id})" class="bg-red-50 hover:bg-red-100 text-red-600 p-1.5 rounded-lg text-xs"><i class="fa-solid fa-trash"></i></button>
                    </div>
                </div>
            `).join('');
        }

        // 菜品增删改弹窗逻辑
        function openAddDishModal() {
            document.getElementById('dishModalTitle').innerText = '添加新菜品';
            document.getElementById('editDishId').value = '';
            document.getElementById('dishNameInput').value = '';
            document.getElementById('dishCategoryInput').value = '热菜';
            document.getElementById('dishPriceInput').value = '';
            document.getElementById('dishImageInput').value = '';
            document.getElementById('dishDescInput').value = '';
            document.getElementById('dishModal').classList.remove('hidden');
        }

        function openEditDishModal(dishId) {
            let dish = (cloudData.dishes || []).find(d => d.id === dishId);
            if (!dish) return;
            document.getElementById('dishModalTitle').innerText = '编辑菜品';
            document.getElementById('editDishId').value = dish.id;
            document.getElementById('dishNameInput').value = dish.name;
            document.getElementById('dishCategoryInput').value = dish.category || '热菜';
            document.getElementById('dishPriceInput').value = dish.price;
            document.getElementById('dishImageInput').value = dish.image;
            document.getElementById('dishDescInput').value = dish.desc || '';
            document.getElementById('dishModal').classList.remove('hidden');
        }

        function closeDishModal() {
            document.getElementById('dishModal').classList.add('hidden');
        }

        async function saveDish() {
            let id = document.getElementById('editDishId').value;
            let name = document.getElementById('dishNameInput').value.trim();
            let category = document.getElementById('dishCategoryInput').value;
            let price = parseFloat(document.getElementById('dishPriceInput').value);
            let image = document.getElementById('dishImageInput').value.trim();
            let desc = document.getElementById('dishDescInput').value.trim();

            if (!name || isNaN(price)) {
                alert('请填写完整的菜品名称和有效价格！');
                return;
            }

            await fetchAllData();
            if (!cloudData.dishes) cloudData.dishes = [];

            if (id) {
                let dish = cloudData.dishes.find(d => d.id == id);
                if (dish) {
                    dish.name = name;
                    dish.category = category;
                    dish.price = price;
                    dish.image = image || 'https://images.unsplash.com/photo-1546069901-ba9599a7e63c';
                    dish.desc = desc;
                }
            } else {
                cloudData.dishes.push({
                    id: Date.now(),
                    name: name,
                    category: category,
                    price: price,
                    image: image || 'https://images.unsplash.com/photo-1546069901-ba9599a7e63c',
                    desc: desc
                });
            }

            await saveAllData();
            closeDishModal();
            renderAll();
        }

        async function deleteDish(dishId) {
            if (!confirm('确定要从菜单库删除这个菜品吗？')) return;
            await fetchAllData();
            cloudData.dishes = (cloudData.dishes || []).filter(d => d.id !== dishId);
            await saveAllData();
            renderAll();
        }

        // 🌟 超市采购勾选模式
        function openSupermarketMode() {
            document.getElementById('supermarketModal').classList.remove('hidden');
            renderSupermarketList();
        }
        function closeSupermarketMode() {
            document.getElementById('supermarketModal').classList.add('hidden');
            renderAll();
        }

        function renderSupermarketList() {
            const container = document.getElementById('supermarketListContainer');
            let orders = cloudData.orders || [];

            if (orders.length === 0) {
                container.innerHTML = `<div class="text-center py-16 text-gray-400 text-xs">当前没有采购任务~</div>`;
                document.getElementById('supermarketProgress').innerText = `已买: 0 / 0`;
                return;
            }

            // 合并所有订单中的菜品
            let summaryMap = {};
            orders.forEach(o => {
                (o.items || []).forEach(item => {
                    if (!summaryMap[item.id]) {
                        summaryMap[item.id] = {
                            id: item.id,
                            name: item.name,
                            price: item.price,
                            totalCount: 0,
                            checked: item.checked || false
                        };
                    }
                    summaryMap[item.id].totalCount += item.count;
                    if (item.checked) summaryMap[item.id].checked = true;
                });
            });

            let list = Object.values(summaryMap);
            let checkedCount = list.filter(i => i.checked).length;
            document.getElementById('supermarketProgress').innerText = `已买: ${checkedCount} / ${list.length}`;

            container.innerHTML = list.map(item => `
                <div onclick="toggleSupermarketItem(${item.id})" class="bg-white p-3.5 rounded-2xl border ${item.checked ? 'border-emerald-300 bg-emerald-50/40 opacity-70 line-through' : 'border-gray-200 shadow-xs'} flex items-center justify-between cursor-pointer transition">
                    <div class="flex items-center space-x-3">
                        <div class="w-6 h-6 rounded-lg border-2 ${item.checked ? 'bg-emerald-600 border-emerald-600 text-white flex items-center justify-center text-xs' : 'border-gray-300'}">
                            ${item.checked ? '<i class="fa-solid fa-check"></i>' : ''}
                        </div>
                        <div>
                            <h4 class="font-bold text-sm text-gray-800">${item.name}</h4>
                            <p class="text-xs text-amber-700 font-semibold">采购总量: ${item.totalCount} 份</p>
                        </div>
                    </div>
                    <span class="text-xs font-bold text-gray-500">¥${item.price * item.totalCount}</span>
                </div>
            `).join('');
        }

        async function toggleSupermarketItem(dishId) {
            await fetchAllData();
            // 遍历所有订单，把对应菜品的 checked 状态切换
            (cloudData.orders || []).forEach(o => {
                (o.items || []).forEach(item => {
                    if (item.id === dishId) {
                        item.checked = !item.checked;
                    }
                });
            });
            await saveAllData();
            renderSupermarketList();
        }
    </script>
</body>
</html>
