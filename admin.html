<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>家庭全周大采购管理后台 (澳洲极速版)</title>
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
</head>
<body class="bg-amber-50/40 text-gray-800 pb-32">

    <!-- 顶部导航 -->
    <header class="bg-white shadow-xs sticky top-0 z-40 px-4 py-3 flex justify-between items-center">
        <div class="flex items-center space-x-2">
            <span class="text-2xl">🛒</span>
            <h1 class="font-bold text-base text-amber-900">周末集中采购管理后台</h1>
        </div>
        <div class="flex items-center space-x-2">
            <button onclick="openDishModal()" class="bg-amber-600 hover:bg-amber-700 text-white text-xs font-medium px-3 py-2 rounded-full transition flex items-center space-x-1 shadow-xs">
                <i class="fa-solid fa-plus"></i>
                <span>加菜</span>
            </button>
            <button onclick="fetchAllData()" class="bg-amber-50 hover:bg-amber-100 text-amber-800 text-xs font-medium px-3 py-2 rounded-full border border-amber-200 transition flex items-center space-x-1">
                <i class="fa-solid fa-rotate"></i>
                <span>刷新</span>
            </button>
        </div>
    </header>

    <!-- 主体内容区 -->
    <main class="max-w-md mx-auto p-4 space-y-6">
        
        <!-- 统计横幅 -->
        <div class="bg-gradient-to-r from-amber-600 to-amber-700 rounded-2xl p-4 text-white shadow-md flex justify-between items-center">
            <div>
                <p class="text-xs text-amber-100">全周总预定单数</p>
                <h2 id="totalOrderCount" class="text-2xl font-bold mt-0.5">0 单</h2>
            </div>
            <div class="text-right">
                <p class="text-xs text-amber-100">全周总预算金额</p>
                <h2 id="totalSales" class="text-2xl font-bold mt-0.5">¥0</h2>
            </div>
        </div>

        <!-- 🌟 核心新功能：全周智能采购清单汇总面板 -->
        <section class="bg-white rounded-2xl border border-amber-200 shadow-sm p-4 space-y-3">
            <div class="flex justify-between items-center border-b pb-2">
                <h3 class="font-bold text-base text-amber-900 flex items-center">
                    <i class="fa-solid fa-basket-shopping mr-2 text-amber-600"></i>周末一站式采购原材料清单
                </h3>
                <span class="text-[11px] bg-amber-100 text-amber-800 px-2 py-0.5 rounded-full font-medium">自动汇总</span>
            </div>
            <p class="text-xs text-gray-500">根据全周（周一至周日）所有家庭成员点单自动合并计算所需原材料：</p>
            <div id="masterIngredientsList" class="space-y-2 pt-1">
                <div class="text-center py-6 text-gray-400 text-xs">正在计算全周原材料...</div>
            </div>
        </section>

        <!-- 按星期查看的订单看板 -->
        <section>
            <div class="flex justify-between items-center mb-3">
                <h3 class="font-bold text-base text-amber-900"><i class="fa-solid fa-calendar-days mr-1.5"></i>按星期分类查看订单</h3>
                <span class="text-xs text-gray-400">核对每日安排</span>
            </div>

            <!-- 星期切换标签 -->
            <div class="flex space-x-1.5 overflow-x-auto no-scrollbar pb-3" id="adminDayTabs">
                <button onclick="switchAdminDay('周一')" id="admonday-周一" class="admonday-btn px-3 py-1.5 rounded-xl text-xs font-bold bg-amber-600 text-white whitespace-nowrap shadow transition">周一</button>
                <button onclick="switchAdminDay('周二')" id="admonday-周二" class="admonday-btn px-3 py-1.5 rounded-xl text-xs font-bold bg-white text-gray-600 border whitespace-nowrap transition">周二</button>
                <button onclick="switchAdminDay('周三')" id="admonday-周三" class="admonday-btn px-3 py-1.5 rounded-xl text-xs font-bold bg-white text-gray-600 border whitespace-nowrap transition">周三</button>
                <button onclick="switchAdminDay('周四')" id="admonday-周四" class="admonday-btn px-3 py-1.5 rounded-xl text-xs font-bold bg-white text-gray-600 border whitespace-nowrap transition">周四</button>
                <button onclick="switchAdminDay('周五')" id="admonday-周五" class="admonday-btn px-3 py-1.5 rounded-xl text-xs font-bold bg-white text-gray-600 border whitespace-nowrap transition">周五</button>
                <button onclick="switchAdminDay('周六')" id="admonday-周六" class="admonday-btn px-3 py-1.5 rounded-xl text-xs font-bold bg-white text-gray-600 border whitespace-nowrap transition">周六</button>
                <button onclick="switchAdminDay('周日')" id="admonday-周日" class="admonday-btn px-3 py-1.5 rounded-xl text-xs font-bold bg-white text-gray-600 border whitespace-nowrap transition">周日</button>
            </div>

            <!-- 选定星期的订单容器 -->
            <div id="dayOrdersContainer" class="space-y-3">
                <div class="text-center py-12 bg-white rounded-2xl border text-gray-400 text-sm">正在加载...</div>
            </div>
        </section>

        <!-- 菜单库管理 -->
        <section class="pt-2">
            <div class="flex justify-between items-center mb-3">
                <h3 class="font-bold text-base text-amber-900"><i class="fa-solid fa-utensils mr-1.5"></i>菜单库管理（含原材料配置）</h3>
            </div>
            <div id="dishManageContainer" class="grid grid-cols-1 gap-3"></div>
        </section>
    </main>

    <!-- 添加/修改菜品弹窗（含原材料输入） -->
    <div id="dishModal" class="fixed inset-0 bg-black/50 z-50 flex items-center justify-center hidden p-4">
        <div class="bg-white w-full max-w-md rounded-2xl p-5 shadow-2xl space-y-4 max-h-[90vh] overflow-y-auto">
            <div class="flex justify-between items-center pb-2 border-b">
                <h3 id="modalTitle" class="font-bold text-base text-amber-900">新增菜品</h3>
                <button onclick="toggleDishModal()" class="text-gray-400 hover:text-gray-600"><i class="fa-solid fa-xmark text-lg"></i></button>
            </div>
            <input type="hidden" id="editDishId">
            <div class="space-y-3 text-sm">
                <div>
                    <label class="block text-xs text-gray-500 mb-1">菜品名称</label>
                    <input type="text" id="newDishName" placeholder="例如：糖醋排骨" class="w-full bg-gray-50 border border-gray-200 rounded-xl px-3 py-2 outline-none focus:border-amber-500">
                </div>
                <div class="flex space-x-3">
                    <div class="flex-1">
                        <label class="block text-xs text-gray-500 mb-1">价格 (¥)</label>
                        <input type="number" id="newDishPrice" placeholder="48" class="w-full bg-gray-50 border border-gray-200 rounded-xl px-3 py-2 outline-none focus:border-amber-500">
                    </div>
                    <div class="flex-1">
                        <label class="block text-xs text-gray-500 mb-1">分类</label>
                        <select id="newDishCategory" class="w-full bg-gray-50 border border-gray-200 rounded-xl px-3 py-2 outline-none focus:border-amber-500 bg-white">
                            <option value="热菜">热菜</option>
                            <option value="凉菜">凉菜</option>
                            <option value="主食/汤品">主食/汤品</option>
                            <option value="饮品/甜点">饮品/甜点</option>
                        </select>
                    </div>
                </div>
                <div>
                    <label class="block text-xs text-gray-500 mb-1">图片网址 (URL)</label>
                    <input type="text" id="newDishImage" placeholder="https://images.unsplash.com/..." class="w-full bg-gray-50 border border-gray-200 rounded-xl px-3 py-2 outline-none focus:border-amber-500">
                </div>
                <div>
                    <label class="block text-xs text-gray-500 mb-1">菜品简介/描述</label>
                    <input type="text" id="newDishDesc" placeholder="酸甜可口，老少皆宜" class="w-full bg-gray-50 border border-gray-200 rounded-xl px-3 py-2 outline-none focus:border-amber-500">
                </div>
                <div>
                    <label class="block text-xs text-amber-700 font-bold mb-1"><i class="fa-solid fa-basket-shopping mr-1"></i>所需原材料（用于周末采购清单汇总）</label>
                    <textarea id="newDishIngredients" rows="2" placeholder="例如：排骨 500g, 冰糖 30g, 生抽 20ml" class="w-full bg-amber-50/50 border border-amber-200 rounded-xl px-3 py-2 outline-none focus:border-amber-500 text-xs"></textarea>
                    <p class="text-[10px] text-gray-400 mt-0.5">提示：多项原材料请用逗号隔开，方便合并统计。</p>
                </div>
            </div>
            <div class="pt-2 flex space-x-3">
                <button onclick="toggleDishModal()" class="flex-1 bg-gray-100 hover:bg-gray-200 text-gray-700 py-2.5 rounded-xl font-medium transition">取消</button>
                <button onclick="saveDish()" class="flex-1 bg-amber-600 hover:bg-amber-700 text-white py-2.5 rounded-xl font-medium shadow-md transition">保存菜品</button>
            </div>
        </div>
    </div>

    <script>
        const API_URL = 'https://api.npoint.io/692e9e8f65204c754fc5';

        let cloudData = { dishes: [], orders: [] };
        let selectedAdminDay = '周一';

        async function fetchAllData() {
            try {
                let res = await fetch(API_URL + '?t=' + Date.now());
                let json = await res.json();
                if (json) {
                    cloudData = json;
                    if (!cloudData.dishes) cloudData.dishes = [];
                    if (!cloudData.orders) cloudData.orders = [];
                }
            } catch (e) {
                console.log('同步云端数据失败', e);
            }
            renderDashboard();
        }

        async function saveAllData() {
            try {
                await fetch(API_URL, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(cloudData)
                });
            } catch (e) {
                alert('云端同步失败，请检查网络！');
            }
        }

        function switchAdminDay(day) {
            selectedAdminDay = day;
            document.querySelectorAll('.admonday-btn').forEach(btn => {
                if (btn.id === `admonday-${day}`) {
                    btn.className = "admonday-btn px-3 py-1.5 rounded-xl text-xs font-bold bg-amber-600 text-white whitespace-nowrap shadow transition";
                } else {
                    btn.className = "admonday-btn px-3 py-1.5 rounded-xl text-xs font-bold bg-white text-gray-600 border whitespace-nowrap transition";
                }
            });
            renderDayOrders();
        }

        function renderDashboard() {
            const orders = cloudData.orders || [];
            const dishes = cloudData.dishes || [];

            // 统计横幅
            document.getElementById('totalOrderCount').innerText = `${orders.length} 单`;
            const totalSales = orders.reduce((sum, o) => sum + (o.totalPrice || 0), 0);
            document.getElementById('totalSales').innerText = `¥${totalSales}`;

            renderDayOrders();
            renderMasterIngredients(orders, dishes);

            // 渲染菜单管理
            const dishContainer = document.getElementById('dishManageContainer');
            if (dishes.length === 0) {
                dishContainer.innerHTML = `<div class="text-center py-6 text-gray-400 text-xs bg-white rounded-xl border">菜单库暂无菜品</div>`;
            } else {
                dishContainer.innerHTML = dishes.map(dish => `
                    <div class="bg-white rounded-xl border border-gray-100 p-3 flex items-center justify-between shadow-xs">
                        <div class="flex items-center space-x-3">
                            <img src="${dish.image}" class="w-12 h-12 object-cover rounded-lg">
                            <div class="space-y-0.5">
                                <h4 class="font-bold text-sm text-gray-800">${dish.name} <span class="text-[10px] bg-amber-50 text-amber-700 px-1.5 py-0.5 rounded ml-1">${dish.category || '热菜'}</span></h4>
                                <p class="text-xs text-amber-600 font-semibold">¥${dish.price}</p>
                                <p class="text-[11px] text-gray-400">配料: ${dish.ingredients || '未填写原材料'}</p>
                            </div>
                        </div>
                        <div class="flex items-center space-x-1">
                            <button onclick="openEditDishModal(${dish.id})" class="text-gray-400 hover:text-amber-600 p-2 transition"><i class="fa-solid fa-pen-to-square"></i></button>
                            <button onclick="deleteDish(${dish.id})" class="text-gray-300 hover:text-red-500 p-2 transition"><i class="fa-solid fa-trash"></i></button>
                        </div>
                    </div>
                `).join('');
            }
        }

        // 核心算法：智能汇总全周原材料采购清单
        function renderMasterIngredients(orders, dishes) {
            const container = document.getElementById('masterIngredientsList');
            
            if (orders.length === 0) {
                container.innerHTML = `<div class="text-center py-6 text-gray-400 text-xs">全周暂无订单，暂无采购需求~</div>`;
                return;
            }

            // 统计每道菜全周被点了多少份
            let dishCountMap = {}; // { dishName: totalCount }
            orders.forEach(order => {
                if (order.items) {
                    order.items.forEach(item => {
                        dishCountMap[item.name] = (dishCountMap[item.name] || 0) + item.count;
                    });
                }
            });

            // 搜集原材料并进行归类展示
            let summaryHTML = '';
            let hasAnyIngredient = false;

            dishes.forEach(dish => {
                let totalOrdered = dishCountMap[dish.name] || 0;
                if (totalOrdered > 0 && dish.ingredients) {
                    hasAnyIngredient = true;
                    summaryHTML += `
                        <div class="bg-amber-50/60 border border-amber-100 p-2.5 rounded-xl text-xs space-y-1">
                            <div class="flex justify-between font-bold text-amber-900">
                                <span>${dish.name}</span>
                                <span class="bg-amber-600 text-white px-2 py-0.2 rounded text-[10px]">全周共点 ${totalOrdered} 份</span>
                            </div>
                            <p class="text-gray-600"><span class="font-medium text-amber-800">原材料需求：</span>${dish.ingredients}</p>
                        </div>
                    `;
                }
            });

            if (!hasAnyIngredient) {
                container.innerHTML = `<div class="text-center py-6 text-gray-400 text-xs">已有点单，但对应的菜品未填写“原材料”，请在下方菜单库中补充。</div>`;
            } else {
                container.innerHTML = summaryHTML;
            }
        }

        function renderDayOrders() {
            const container = document.getElementById('dayOrdersContainer');
            const orders = (cloudData.orders || []).filter(o => (o.targetDay || '周一') === selectedAdminDay);

            if (orders.length === 0) {
                container.innerHTML = `<div class="text-center py-10 bg-white rounded-2xl border text-gray-400 text-sm">【${selectedAdminDay}】暂无家人预定菜品~</div>`;
                return;
            }

            container.innerHTML = orders.map(order => `
                <div class="bg-white border border-gray-100 p-4 rounded-2xl shadow-xs space-y-3">
                    <div class="flex justify-between items-center border-b border-gray-100 pb-2">
                        <div>
                            <span class="font-bold text-amber-900 text-base"><i class="fa-solid fa-user-circle mr-1"></i> ${order.user}</span>
                            <span class="text-xs text-gray-400 ml-2">${order.time}</span>
                        </div>
                        <span class="text-xs px-2.5 py-1 rounded-full font-medium ${order.status === '已采购' ? 'bg-green-100 text-green-700' : 'bg-amber-100 text-amber-800'}">${order.status}</span>
                    </div>
                    <div class="space-y-1.5">
                        ${order.items.map(i => `
                            <div class="flex justify-between text-sm text-gray-700">
                                <div>
                                    <span class="font-semibold">${i.name}</span>
                                    <span class="text-gray-400 ml-1">x${i.count}</span>${i.note ? `<span class="text-amber-600 ml-1 bg-amber-50 px-1.5 py-0.5 rounded text-xs">(${i.note})</span>` : ''}
                                </div>
                                <span class="font-bold">¥${i.price * i.count}</span>
                            </div>
                        `).join('')}
                    </div>
                    <div class="flex justify-between items-center pt-2 border-t border-gray-100">
                        <span class="text-xs font-bold text-amber-900">合计：¥${order.totalPrice}</span>
                        <div class="space-x-2">
                            ${order.status === '待采购' ? `
                                <button onclick="updateOrderStatus(${order.id}, '已采购')" class="bg-green-600 hover:bg-green-700 text-white text-xs px-3 py-1.5 rounded-lg font-medium transition shadow-xs">标记已采购</button>
                            ` : `
                                <button onclick="updateOrderStatus(${order.id}, '待采购')" class="bg-gray-100 hover:bg-gray-200 text-gray-600 text-xs px-3 py-1.5 rounded-lg font-medium transition">设为待采购</button>
                            `}
                            <button onclick="deleteOrder(${order.id})" class="text-gray-300 hover:text-red-500 text-xs px-1.5 py-1.5 transition"><i class="fa-solid fa-trash"></i></button>
                        </div>
                    </div>
                </div>
            `).join('');
        }

        async function updateOrderStatus(orderId, newStatus) {
            await fetchAllData();
            const order = (cloudData.orders || []).find(o => o.id === orderId);
            if (order) {
                order.status = newStatus;
                await saveAllData();
                renderDashboard();
            }
        }

        async function deleteOrder(orderId) {
            if (!confirm('确定要删除这条预定记录吗？')) return;
            await fetchAllData();
            cloudData.orders = (cloudData.orders || []).filter(o => o.id !== orderId);
            await saveAllData();
            renderDashboard();
        }

        function toggleDishModal() {
            document.getElementById('dishModal').classList.toggle('hidden');
        }

        function openDishModal() {
            document.getElementById('modalTitle').innerText = '新增菜品';
            document.getElementById('editDishId').value = '';
            document.getElementById('newDishName').value = '';
            document.getElementById('newDishPrice').value = '';
            document.getElementById('newDishCategory').value = '热菜';
            document.getElementById('newDishImage').value = '';
            document.getElementById('newDishDesc').value = '';
            document.getElementById('newDishIngredients').value = '';
            document.getElementById('dishModal').classList.remove('hidden');
        }

        function openEditDishModal(id) {
            const dish = (cloudData.dishes || []).find(d => d.id === id);
            if (!dish) return;
            document.getElementById('modalTitle').innerText = '修改菜品';
            document.getElementById('editDishId').value = dish.id;
            document.getElementById('newDishName').value = dish.name;
            document.getElementById('newDishPrice').value = dish.price;
            document.getElementById('newDishCategory').value = dish.category || '热菜';
            document.getElementById('newDishImage').value = dish.image || '';
            document.getElementById('newDishDesc').value = dish.desc || '';
            document.getElementById('newDishIngredients').value = dish.ingredients || '';
            document.getElementById('dishModal').classList.remove('hidden');
        }

        async function saveDish() {
            const editId = document.getElementById('editDishId').value;
            const name = document.getElementById('newDishName').value.trim();
            const price = parseFloat(document.getElementById('newDishPrice').value);
            const category = document.getElementById('newDishCategory').value;
            let image = document.getElementById('newDishImage').value.trim();
            const desc = document.getElementById('newDishDesc').value.trim();
            const ingredients = document.getElementById('newDishIngredients').value.trim();

            if (!name || isNaN(price)) {
                alert('请填写完整的菜品名称和正确价格！');
                return;
            }

            if (!image) {
                image = 'https://images.unsplash.com/photo-1546069901-ba9599a7e63c?w=300';
            }

            await fetchAllData();
            if (!cloudData.dishes) cloudData.dishes = [];

            if (editId) {
                let dish = cloudData.dishes.find(d => d.id == editId);
                if (dish) {
                    dish.name = name;
                    dish.price = price;
                    dish.category = category;
                    dish.image = image;
                    dish.desc = desc;
                    dish.ingredients = ingredients;
                }
            } else {
                const newDish = {
                    id: Date.now(),
                    name,
                    price,
                    category,
                    image,
                    desc: desc || '',
                    ingredients: ingredients || ''
                };
                cloudData.dishes.push(newDish);
            }

            await saveAllData();
            toggleDishModal();
            renderDashboard();
            alert('菜品及原材料保存成功！');
        }

        async function deleteDish(dishId) {
            if (!confirm('确定要下架并删除这道菜吗？')) return;
            await fetchAllData();
            cloudData.dishes = (cloudData.dishes || []).filter(d => d.id !== dishId);
            await saveAllData();
            renderDashboard();
        }

        setInterval(fetchAllData, 5000);
        fetchAllData();
    </script>
</body>
</html>
