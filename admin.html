<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>大厨管理后台 - 温馨家庭点餐</title>
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
</head>
<body class="bg-gray-50 text-gray-800 pb-12">

    <!-- 顶栏 -->
    <header class="bg-amber-800 text-white shadow-md px-6 py-4 flex justify-between items-center">
        <div class="flex items-center space-x-2">
            <span class="text-2xl">👨‍🍳</span>
            <h1 class="font-bold text-lg">大厨后台 & 菜单管理</h1>
        </div>
        <a href="index.html" class="bg-amber-700 hover:bg-amber-600 text-xs px-3 py-1.5 rounded-lg transition">去点餐端 &rarr;</a>
    </header>

    <main class="max-w-2xl mx-auto p-4 space-y-6">
        
        <!-- 标签切换 -->
        <div class="flex border-b border-gray-200">
            <button onclick="switchTab('orders')" id="tabOrdersBtn" class="py-2 px-4 font-bold border-b-2 border-amber-600 text-amber-800">实时订单大屏</button>
            <button onclick="switchTab('dishes')" id="tabDishesBtn" class="py-2 px-4 font-bold text-gray-400">菜品菜单维护</button>
        </div>

        <!-- 订单管理视图 -->
        <section id="ordersSection" class="space-y-4">
            <div class="flex justify-between items-center">
                <h2 class="font-bold text-gray-700">家人提交的订单</h2>
                <button onclick="loadOrders()" class="text-xs bg-gray-200 hover:bg-gray-300 px-3 py-1 rounded">刷新订单</button>
            </div>
            <div id="orderList" class="space-y-3">
                <!-- 动态加载订单 -->
            </div>
        </section>

        <!-- 菜品管理视图 (默认隐藏) -->
        <section id="dishesSection" class="space-y-4 hidden">
            <div class="bg-white p-4 rounded-xl shadow-xs border border-gray-100">
                <h3 class="font-bold text-base text-amber-900 mb-3">添加新菜品</h3>
                <div class="space-y-3">
                    <input type="text" id="newName" placeholder="菜品名称（如：糖醋排骨）" class="w-full border rounded-lg px-3 py-2 text-sm outline-none focus:border-amber-600">
                    <input type="number" id="newPrice" placeholder="价格（元）" class="w-full border rounded-lg px-3 py-2 text-sm outline-none focus:border-amber-600">
                    <input type="text" id="newImage" placeholder="图片网址 (URL)" class="w-full border rounded-lg px-3 py-2 text-sm outline-none focus:border-amber-600">
                    <input type="text" id="newDesc" placeholder="口味描述（如：酸甜可口）" class="w-full border rounded-lg px-3 py-2 text-sm outline-none focus:border-amber-600">
                    <button onclick="addNewDish()" class="w-full bg-amber-600 hover:bg-amber-700 text-white font-medium py-2 rounded-lg shadow-sm transition">确认添加菜品</button>
                </div>
            </div>

            <div class="bg-white p-4 rounded-xl shadow-xs border border-gray-100">
                <h3 class="font-bold text-base text-amber-900 mb-3">现有菜单列表</h3>
                <div id="adminDishList" class="space-y-2">
                    <!-- 动态加载菜品管理列表 -->
                </div>
            </div>
        </section>

    </main>

    <script>
        function switchTab(tab) {
            const oBtn = document.getElementById('tabOrdersBtn');
            const dBtn = document.getElementById('tabDishesBtn');
            const oSec = document.getElementById('ordersSection');
            const dSec = document.getElementById('dishesSection');

            if (tab === 'orders') {
                oBtn.className = "py-2 px-4 font-bold border-b-2 border-amber-600 text-amber-800";
                dBtn.className = "py-2 px-4 font-bold text-gray-400";
                oSec.classList.remove('hidden');
                dSec.classList.add('hidden');
                loadOrders();
            } else {
                dBtn.className = "py-2 px-4 font-bold border-b-2 border-amber-600 text-amber-800";
                oBtn.className = "py-2 px-4 font-bold text-gray-400";
                dSec.classList.remove('hidden');
                oSec.classList.add('hidden');
                loadAdminDishes();
            }
        }

        // 订单管理逻辑
        function loadOrders() {
            const orders = JSON.parse(localStorage.getItem('family_orders')) || [];
            const container = document.getElementById('orderList');

            if (orders.length === 0) {
                container.innerHTML = `<div class="text-center py-12 text-gray-400 bg-white rounded-xl border border-gray-100">暂无点餐订单，快去叫家人点菜吧~</div>`;
                return;
            }

            container.innerHTML = orders.map((order, idx) => `
                <div class="bg-white p-4 rounded-xl shadow-xs border border-gray-100 space-y-3">
                    <div class="flex justify-between items-center border-b pb-2">
                        <span class="font-bold text-amber-900"><i class="fa-solid fa-user-circle mr-1"></i> ${order.user}</span>
                        <div class="flex items-center space-x-2">
                            <span class="text-xs text-gray-400">${order.time}</span>
                            <span class="text-xs px-2 py-0.5 rounded ${order.status === '已完成' ? 'bg-green-100 text-green-700' : 'bg-amber-100 text-amber-800'}">${order.status}</span>
                        </div>
                    </div>
                    <div class="space-y-1">
                        ${order.items.map(i => `<div class="flex justify-between text-sm text-gray-600"><span>${i.name} x${i.count}</span><span>¥${i.price * i.count}</span></div>`).join('')}
                    </div>
                    <div class="flex justify-between items-center pt-2 border-t text-sm">
                        <span class="font-bold">合计：¥${order.totalPrice}</span>
                        <div class="space-x-2">
                            <button onclick="updateOrderStatus(${idx}, '已完成')" class="bg-green-600 text-white px-3 py-1 rounded text-xs">完成出餐</button>
                            <button onclick="deleteOrder(${idx})" class="text-red-500 text-xs px-2 py-1">删除</button>
                        </div>
                    </div>
                </div>
            `).join('');
        }

        function updateOrderStatus(idx, status) {
            let orders = JSON.parse(localStorage.getItem('family_orders')) || [];
            orders[idx].status = status;
            localStorage.setItem('family_orders', JSON.stringify(orders));
            loadOrders();
        }

        function deleteOrder(idx) {
            let orders = JSON.parse(localStorage.getItem('family_orders')) || [];
            orders.splice(idx, 1);
            localStorage.setItem('family_orders', JSON.stringify(orders));
            loadOrders();
        }

        // 菜品管理逻辑
        function loadAdminDishes() {
            let dishes = JSON.parse(localStorage.getItem('family_dishes')) || [
                { id: 1, name: '招牌红烧肉', price: 68, category: '热菜', image: 'https://images.unsplash.com/photo-1544025162-d76694265947?w=300', desc: '肥而不腻，软糯香甜' },
                { id: 2, name: '清蒸鲜鲈鱼', price: 58, category: '热菜', image: 'https://images.unsplash.com/photo-1519708227418-c8fd9a32b7a2?w=300', desc: '肉质鲜嫩，原汁原味' },
                { id: 3, name: '番茄炒鸡蛋', price: 22, category: '热菜', image: 'https://images.unsplash.com/photo-1546069901-ba9599a7e63c?w=300', desc: '经典家常，酸甜开胃' }
            ];

            const list = document.getElementById('adminDishList');
            list.innerHTML = dishes.map(d => `
                <div class="flex justify-between items-center border-b pb-2 text-sm">
                    <div class="flex items-center space-x-3">
                        <img src="${d.image}" class="w-10 h-10 object-cover rounded-md">
                        <div>
                            <p class="font-bold">${d.name}</p>
                            <span class="text-xs text-amber-600">¥${d.price}</span>
                        </div>
                    </div>
                    <button onclick="deleteDish(${d.id})" class="text-red-500 hover:text-red-700 text-xs"><i class="fa-solid fa-trash"></i> 删除</button>
                </div>
            `).join('');
        }

        function addNewDish() {
            const name = document.getElementById('newName').value;
            const price = parseFloat(document.getElementById('newPrice').value);
            const image = document.getElementById('newImage').value;
            const desc = document.getElementById('newDesc').value;

            if (!name || !price) {
                alert('请填写菜品名称和价格！');
                return;
            }

            let dishes = JSON.parse(localStorage.getItem('family_dishes')) || [];
            dishes.push({
                id: Date.now(),
                name,
                price,
                image: image || 'https://images.unsplash.com/photo-1546069901-ba9599a7e63c?w=300',
                desc
            });

            localStorage.setItem('family_dishes', JSON.stringify(dishes));
            document.getElementById('newName').value = '';
            document.getElementById('newPrice').value = '';
            document.getElementById('newImage').value = '';
            document.getElementById('newDesc').value = '';
            loadAdminDishes();
            alert('添加成功！');
        }

        function deleteDish(id) {
            let dishes = JSON.parse(localStorage.getItem('family_dishes')) || [];
            dishes = dishes.filter(d => d.id !== id);
            localStorage.setItem('family_dishes', JSON.stringify(dishes));
            loadAdminDishes();
        }

        loadOrders();
    </script>
</body>
</html>
