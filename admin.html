<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>家庭全周大采购管理端 (后台)</title>
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
    <style>
        .no-scrollbar::-webkit-scrollbar { display: none; }
        .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
    </style>
</head>
<body class="bg-amber-50/40 text-gray-800 pb-32">

    <!-- 顶部导航 -->
    <header class="bg-white shadow-xs sticky top-0 z-40 px-3 py-3 flex justify-between items-center w-full">
        <div class="flex items-center space-x-2">
            <span class="text-xl">🛒</span>
            <div>
                <h1 class="font-bold text-sm text-amber-900 leading-tight">家庭采购管理后台</h1>
                <p class="text-[10px] text-gray-400">实时统计与原材料汇总</p>
            </div>
        </div>
        <div class="flex items-center space-x-1.5">
            <button onclick="openSupermarketMode()" class="bg-emerald-600 hover:bg-emerald-700 text-white text-xs font-bold px-3 py-1.5 rounded-lg transition flex items-center space-x-1 shadow-xs">
                <i class="fa-solid fa-basket-shopping"></i>
                <span>去超市买菜</span>
            </button>
            <button onclick="openAddDishModal()" class="bg-amber-600 hover:bg-amber-700 text-white text-xs font-bold px-3 py-1.5 rounded-lg transition flex items-center space-x-1 shadow-xs">
                <i class="fa-solid fa-plus"></i>
                <span>加菜</span>
            </button>
        </div>
    </header>

    <!-- 主体内容区 -->
    <main class="w-full max-w-lg mx-auto p-3 space-y-4">
        
        <!-- 顶部统计看板 -->
        <div class="grid grid-cols-2 gap-3">
            <div class="bg-white p-3.5 rounded-2xl border border-amber-200/60 shadow-xs space-y-1">
                <p class="text-[11px] text-gray-400">本周预估总花费</p>
                <p class="text-lg font-extrabold text-amber-800">¥<span id="totalBudget">0</span></p>
            </div>
            <div class="bg-white p-3.5 rounded-2xl border border-amber-200/60 shadow-xs space-y-1">
                <p class="text-[11px] text-gray-400">菜品总数 / 预定单数</p>
                <p class="text-lg font-extrabold text-amber-900"><span id="totalDishesCount">0</span> 样 / <span id="totalOrdersCount">0</span> 单</p>
            </div>
        </div>

        <!-- 选项卡切换 -->
        <div class="flex bg-amber-100/60 p-1 rounded-xl text-xs font-bold">
            <button onclick="switchTab('summary')" id="tab-summary" class="flex-1 py-2 rounded-lg bg-white text-amber-900 shadow-xs transition">周末采购原材料清单</button>
            <button onclick="switchTab('orders')" id="tab-orders" class="flex-1 py-2 rounded-lg text-gray-600 transition">全家点菜明细</button>
            <button onclick="switchTab('dishes')" id="tab-dishes" class="flex-1 py-2 rounded-lg text-gray-600 transition">菜品库与配料</button>
        </div>

        <!-- 面板 1：周末采购原材料清单 -->
        <div id="panel-summary" class="space-y-3">
            <div class="bg-white rounded-2xl p-3 border border-amber-200/60 shadow-xs space-y-2">
                <h3 class="font-bold text-xs text-amber-900 flex items-center justify-between">
                    <span><i class="fa-solid fa-basket-shopping mr-1 text-amber-600"></i>周末一站式采购原材料汇总</span>
                    <span class="text-[10px] text-amber-700 bg-amber-100 px-2 py-0.5 rounded-full font-bold">自动合计重量</span>
                </h3>
                <p class="text-[11px] text-gray-400">根据全家人点单的菜品及配料，自动合并相同原材料的总数：</p>
                <div id="summaryListContainer" class="space-y-2 pt-1">
                    <div class="text-center py-10 text-gray-400 text-xs">正在计算采购原材料...</div>
                </div>
            </div>
        </div>

        <!-- 面板 2：全家点菜明细 -->
        <div id="panel-orders" class="space-y-3 hidden">
            <div class="bg-white rounded-2xl p-3 border border-amber-200/60 shadow-xs space-y-2">
                <h3 class="font-bold text-xs text-amber-900 flex items-center justify-between">
                    <span><i class="fa-solid fa-receipt mr-1 text-amber-600"></i>家庭成员预定记录（按天归类）</span>
                    <span class="text-[10px] text-gray-400">可在这里删除误点的订单</span>
                </h3>
                <div id="ordersListContainer" class="space-y-3 pt-1">
                    <div class="text-center py-10 text-gray-400 text-xs">暂无点菜订单...</div>
                </div>
            </div>
        </div>

        <!-- 面板 3：菜品库管理 -->
        <div id="panel-dishes" class="space-y-3 hidden">
            <div class="bg-white rounded-2xl p-3 border border-amber-200/60 shadow-xs space-y-2">
                <h3 class="font-bold text-xs text-amber-900 flex items-center justify-between">
                    <span><i class="fa-solid fa-utensils mr-1 text-amber-600"></i>可选菜单库与原材料设置</span>
                    <button onclick="openAddDishModal()" class="text-amber-600 text-xs font-bold"><i class="fa-solid fa-plus mr-1"></i>添加新菜</button>
                </h3>
                <div id="dishesListContainer" class="grid grid-cols-1 gap-2.5 pt-1">
                    <div class="text-center py-10 text-gray-400 text-xs">加载菜品库中...</div>
                </div>
            </div>
        </div>
    </main>

    <!-- 🌟 超市采购勾选大屏模式弹窗 -->
    <div id="supermarketModal" class="fixed inset-0 bg-white z-50 flex flex-col hidden">
        <div class="bg-emerald-600 text-white px-4 py-3 flex justify-between items-center shadow-md">
            <div class="flex items-center space-x-2">
                <i class="fa-solid fa-basket-shopping text-lg"></i>
                <h2 class="font-bold text-sm">超市原材料采购核对模式</h2>
            </div>
            <button onclick="closeSupermarketMode()" class="bg-emerald-700 hover:bg-emerald-800 text-white px-3 py-1.5 rounded-lg text-xs font-bold transition">保存退出</button>
        </div>
        <div class="bg-emerald-50 px-4 py-2 text-[11px] text-emerald-800 border-b flex justify-between items-center">
            <span>买一样勾选一样，支持现场修改或删除！</span>
            <span id="supermarketProgress" class="font-bold">已买: 0 / 0</span>
        </div>
        <div id="supermarketListContainer" class="flex-1 overflow-y-auto p-3 space-y-2.5 max-w-lg mx-auto w-full"></div>
        <div class="p-3 bg-white border-t max-w-lg mx-auto w-full">
            <button onclick="openAddManualShoppingItem()" class="w-full bg-emerald-600 hover:bg-emerald-700 text-white py-2.5 rounded-xl font-bold text-xs shadow-md transition">
                <i class="fa-solid fa-plus mr-1"></i> 在超市临时加买一项
            </button>
        </div>
    </div>

    <!-- 临时加购 / 修改原材料弹窗 -->
    <div id="manualItemModal" class="fixed inset-0 bg-black/60 z-[60] flex items-center justify-center hidden p-3">
        <div class="bg-white w-full max-w-xs rounded-2xl p-4 shadow-2xl space-y-3">
            <h3 class="font-bold text-sm text-amber-900" id="manualModalTitle">修改采购项目</h3>
            <input type="hidden" id="editManualKey">
            <input type="hidden" id="editItemType">
            <div class="space-y-2.5 text-xs">
                <div>
                    <label class="text-gray-500 block mb-1">原材料名称</label>
                    <input type="text" id="manualNameInput" placeholder="例如：洗洁精 / 纸巾" class="w-full bg-gray-50 border rounded-xl px-3 py-2 outline-none focus:border-amber-500">
                </div>
                <div class="flex space-x-2">
                    <div class="flex-1">
                        <label class="text-gray-500 block mb-1">数量</label>
                        <input type="number" id="manualTotalInput" placeholder="1" class="w-full bg-gray-50 border rounded-xl px-3 py-2 outline-none focus:border-amber-500">
                    </div>
                    <div class="flex-1">
                        <label class="text-gray-500 block mb-1">单位</label>
                        <input type="text" id="manualUnitInput" placeholder="个 / 瓶 / g" class="w-full bg-gray-50 border rounded-xl px-3 py-2 outline-none focus:border-amber-500">
                    </div>
                </div>
            </div>
            <div class="flex space-x-2 pt-1">
                <button onclick="closeManualModal()" class="flex-1 bg-gray-100 hover:bg-gray-200 text-gray-700 py-2 rounded-xl text-xs font-bold transition">取消</button>
                <button onclick="saveManualItem()" class="flex-1 bg-emerald-600 hover:bg-emerald-700 text-white py-2 rounded-xl text-xs font-bold transition">保存</button>
            </div>
        </div>
    </div>

    <!-- 添加/编辑菜品弹窗 -->
    <div id="dishModal" class="fixed inset-0 bg-black/60 z-50 flex items-center justify-center hidden p-3">
        <div class="bg-white w-full max-w-sm rounded-2xl p-4 shadow-2xl space-y-3 max-h-[90vh] overflow-y-auto">
            <h3 class="font-bold text-sm text-amber-900" id="dishModalTitle">添加新菜品</h3>
            <input type="hidden" id="editDishId">
            <div class="space-y-2.5 text-xs">
                <div>
                    <label class="text-gray-500 block mb-1">菜品名称</label>
                    <input type="text" id="dishNameInput" placeholder="例如：红烧肉" class="w-full bg-gray-50 border rounded-xl px-3 py-2 outline-none focus:border-amber-500">
                </div>
                <div class="flex space-x-2">
                    <div class="flex-1">
                        <label class="text-gray-500 block mb-1">分类</label>
                        <select id="dishCategoryInput" class="w-full bg-gray-50 border rounded-xl px-3 py-2 outline-none focus:border-amber-500">
                            <option value="热菜">热菜</option>
                            <option value="凉菜">凉菜</option>
                            <option value="主食/汤品">主食/汤品</option>
                            <option value="饮品/甜点">饮品/甜点</option>
                        </select>
                    </div>
                    <div class="flex-1">
                        <label class="text-gray-500 block mb-1">价格 (¥)</label>
                        <input type="number" id="dishPriceInput" placeholder="38" class="w-full bg-gray-50 border rounded-xl px-3 py-2 outline-none focus:border-amber-500">
                    </div>
                </div>
                <div>
                    <label class="text-gray-500 block mb-1">图片链接 (URL)</label>
                    <input type="text" id="dishImageInput" placeholder="https://..." class="w-full bg-gray-50 border rounded-xl px-3 py-2 outline-none focus:border-amber-500">
                </div>
                <div>
                    <label class="text-gray-500 block mb-1">简介</label>
                    <input type="text" id="dishDescInput" placeholder="软烂香甜，老少皆宜" class="w-full bg-gray-50 border rounded-xl px-3 py-2 outline-none focus:border-amber-500">
                </div>
                <div>
                    <label class="text-amber-800 font-bold block mb-1">所需原材料（用于超市合并采购）</label>
                    <textarea id="dishIngredientsInput" rows="2" placeholder="例如：五花肉 500g, 冰糖 30g" class="w-full bg-amber-50 border border-amber-200 rounded-xl px-3 py-2 outline-none focus:border-amber-500 text-xs"></textarea>
                    <p class="text-[10px] text-gray-400 mt-0.5">提示：请用“名称 + 数字 + 单位”格式。</p>
                </div>
            </div>
            <div class="flex space-x-2 pt-1">
                <button onclick="closeDishModal()" class="flex-1 bg-gray-100 hover:bg-gray-200 text-gray-700 py-2 rounded-xl text-xs font-bold transition">取消</button>
                <button onclick="saveDish()" class="flex-1 bg-amber-600 hover:bg-amber-700 text-white py-2 rounded-xl text-xs font-bold transition">保存</button>
            </div>
        </div>
    </div>

    <script>
        const API_URL = 'https://api.npoint.io/692e9e8f65204c754fc5';

        let cloudData = { dishes: [], orders: [], checkedIngredients: {}, manualIngredients: [], ingredientOverrides: {} };
        let currentTab = 'summary';

        async function fetchAllData() {
            try {
                let res = await fetch(API_URL + '?t=' + Date.now());
                let json = await res.json();
                if (json) {
                    cloudData.dishes = json.dishes || [];
                    cloudData.orders = json.orders || [];
                    cloudData.checkedIngredients = json.checkedIngredients || {};
                    cloudData.manualIngredients = json.manualIngredients || [];
                    cloudData.ingredientOverrides = json.ingredientOverrides || {};

                    if (cloudData.dishes.length > 0) {
                        localStorage.setItem('family_dishes_only_backup', JSON.stringify(cloudData.dishes));
                    }
                }
            } catch (e) {
                console.log('网络同步失败', e);
            }

            if (cloudData.dishes.length === 0) {
                let localBackup = localStorage.getItem('family_dishes_only_backup');
                if (localBackup) {
                    cloudData.dishes = JSON.parse(localBackup);
                    await saveAllData();
                }
            }

            renderAll();
        }

        async function saveAllData() {
            try {
                if (cloudData.dishes && cloudData.dishes.length > 0) {
                    localStorage.setItem('family_dishes_only_backup', JSON.stringify(cloudData.dishes));
                }
                await fetch(API_URL, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(cloudData)
                });
            } catch (e) {
                alert('云端同步失败，请检查网络！');
            }
        }

        window.onload = function() {
            fetchAllData();
            setInterval(fetchAllData, 8000);
        }

        function switchTab(tab) {
            currentTab = tab;
            ['summary', 'orders', 'dishes'].forEach(t => {
                let btn = document.getElementById(`tab-${t}`);
                let panel = document.getElementById(`panel-${t}`);
                if (t === tab) {
                    btn.className = "flex-1 py-2 rounded-lg bg-white text-amber-900 shadow-xs transition";
                    panel.classList.remove('hidden');
                } else {
                    btn.className = "flex-1 py-2 rounded-lg text-gray-600 transition";
                    panel.classList.add('hidden');
                }
            });
            renderAll();
        }

        function renderAll() {
            renderStats();
            if (currentTab === 'summary') renderSummaryIngredients();
            if (currentTab === 'orders') renderOrders();
            if (currentTab === 'dishes') renderDishesAdmin();
            if (!document.getElementById('supermarketModal').classList.contains('hidden')) {
                renderSupermarketList();
            }
        }

        function renderStats() {
            let totalBudget = 0;
            (cloudData.orders || []).forEach(o => {
                totalBudget += (o.totalPrice || 0);
            });
            document.getElementById('totalBudget').innerText = totalBudget;
            document.getElementById('totalDishesCount').innerText = (cloudData.dishes || []).length;
            document.getElementById('totalOrdersCount').innerText = (cloudData.orders || []).length;
        }

        function getAggregatedIngredients() {
            let orders = cloudData.orders || [];
            let dishes = cloudData.dishes || [];
            let dishMap = {};
            dishes.forEach(d => { dishMap[d.id] = d; });

            let ingredientSummary = {};

            orders.forEach(order => {
                if (!order.items) return;
                order.items.forEach(orderItem => {
                    let dish = dishMap[orderItem.id];
                    if (dish && dish.ingredients) {
                        let times = orderItem.count;
                        let rawParts = dish.ingredients.split(/[,，;；]/);
                        rawParts.forEach(part => {
                            part = part.trim();
                            if (!part) return;
                            
                            let match = part.match(/^([\u4e00-\u9fa5\w\s\(\)]+?)\s*([\d\.]+)\s*([a-zA-Z\u4e00-\u9fa5]+)?$/);
                            if (match) {
                                let ingName = match[1].trim();
                                let val = parseFloat(match[2]);
                                let unit = match[3] ? match[3].trim() : '';
                                let key = `auto_${ingName}_${unit}`;

                                if (!ingredientSummary[key]) {
                                    ingredientSummary[key] = { key: key, name: ingName, unit: unit, total: 0 };
                                }
                                ingredientSummary[key].total += val * times;
                            } else {
                                let key = `auto_other_${part}`;
                                if (!ingredientSummary[key]) {
                                    ingredientSummary[key] = { key: key, name: part, unit: '', total: 0, isText: true };
                                }
                                ingredientSummary[key].total += times;
                            }
                        });
                    }
                });
            });

            let list = [];
            // 处理自动汇总项（应用覆盖或删除规则）
            for (let key in ingredientSummary) {
                let item = ingredientSummary[key];
                if (cloudData.ingredientOverrides && cloudData.ingredientOverrides[key]) {
                    let override = cloudData.ingredientOverrides[key];
                    if (override.deleted) continue; // 如果被删除了则跳过
                    list.push({
                        key: key,
                        name: override.name,
                        unit: override.unit,
                        total: override.total,
                        isAuto: true
                    });
                } else {
                    list.push(item);
                }
            }

            // 处理用户额外手动加购项
            if (cloudData.manualIngredients) {
                cloudData.manualIngredients.forEach(m => {
                    list.push({
                        key: m.key,
                        name: m.name,
                        unit: m.unit,
                        total: m.total,
                        isManual: true
                    });
                });
            }

            return list;
        }

        function renderSummaryIngredients() {
            const container = document.getElementById('summaryListContainer');
            let list = getAggregatedIngredients();

            if (list.length === 0) {
                container.innerHTML = `<div class="text-center py-10 text-gray-400 text-xs">还没有家人点菜，或者点选的菜品未配置“原材料”~</div>`;
                return;
            }

            container.innerHTML = list.map(item => {
                let displayTotal = item.isText ? item.total : (Number.isInteger(item.total) ? item.total : item.total.toFixed(1));
                return `
                    <div class="bg-amber-50/60 border border-amber-200 p-3 rounded-xl flex items-center justify-between">
                        <span class="font-bold text-xs text-amber-900"><i class="fa-solid fa-check text-amber-600 mr-1.5"></i>${item.name}</span>
                        <span class="bg-amber-600 text-white font-bold px-2.5 py-0.5 rounded text-xs">${displayTotal}${item.unit || '份'}</span>
                    </div>
                `;
            }).join('');
        }

        function renderOrders() {
            const container = document.getElementById('ordersListContainer');
            let orders = cloudData.orders || [];

            if (orders.length === 0) {
                container.innerHTML = `<div class="text-center py-10 text-gray-400 text-xs">暂无点菜订单...</div>`;
                return;
            }

            const daysOrder = ['周一', '周二', '周三', '周四', '周五', '周六', '周日'];
            let groupedByDay = {};
            daysOrder.forEach(d => { groupedByDay[d] = []; });

            orders.forEach(o => {
                let day = o.targetDay || '周一';
                if (!groupedByDay[day]) groupedByDay[day] = [];
                groupedByDay[day].push(o);
            });

            let html = '';
            daysOrder.forEach(day => {
                let dayOrders = groupedByDay[day];
                if (dayOrders.length > 0) {
                    html += `
                        <div class="bg-amber-50/60 border border-amber-200 p-3 rounded-2xl space-y-2">
                            <div class="flex justify-between items-center border-b border-amber-200 pb-1.5">
                                <span class="font-bold text-xs text-amber-900"><i class="fa-solid fa-calendar-day mr-1 text-amber-600"></i>${day} 点菜明细</span>
                                <span class="text-[10px] bg-amber-200 text-amber-800 px-2 py-0.5 rounded-full font-bold">${dayOrders.length} 笔</span>
                            </div>
                            <div class="space-y-2 pt-0.5">
                    `;

                    dayOrders.forEach(order => {
                        html += `
                            <div class="bg-white p-2.5 rounded-xl border border-amber-100 space-y-1.5 shadow-xs">
                                <div class="flex justify-between items-center text-[11px] border-b border-gray-100 pb-1">
                                    <div class="flex items-center space-x-1.5">
                                        <span class="bg-amber-600 text-white text-[10px] px-1.5 py-0.2 rounded font-bold">${order.user || '某位家人'}</span>
                                        <span class="text-[10px] text-gray-400">${order.time || ''}</span>
                                    </div>
                                    <button onclick="deleteAdminOrder(${order.id})" class="text-gray-400 hover:text-red-500 text-xs px-1"><i class="fa-solid fa-trash"></i></button>
                                </div>
                                <div class="space-y-0.5 text-xs text-gray-700">
                                    ${(order.items || []).map(i => `
                                        <div class="flex justify-between">
                                            <span>${i.name} x${i.count}</span>
                                            <span class="font-bold">¥${i.price * i.count}</span>
                                        </div>
                                    `).join('')}
                                </div>
                                <div class="flex justify-between items-center pt-1 border-t border-gray-100 text-[10px]">
                                    <span class="text-gray-400">单笔小计</span>
                                    <span class="font-bold text-amber-900">¥${order.totalPrice}</span>
                                </div>
                            </div>
                        `;
                    });

                    html += `</div></div>`;
                }
            });

            container.innerHTML = html;
        }

        async function deleteAdminOrder(orderId) {
            if (!confirm('确定要删除该笔家庭订单吗？')) return;
            await fetchAllData();
            cloudData.orders = (cloudData.orders || []).filter(o => o.id !== orderId);
            await saveAllData();
            renderAll();
        }

        function renderDishesAdmin() {
            const container = document.getElementById('dishesListContainer');
            let dishes = cloudData.dishes || [];

            if (dishes.length === 0) {
                container.innerHTML = `<div class="text-center py-10 text-gray-400 text-xs">菜品库为空，请点击右上角添加新菜~</div>`;
                return;
            }

            container.innerHTML = dishes.map(dish => `
                <div class="bg-white rounded-xl border p-2.5 flex items-center justify-between shadow-xs">
                    <div class="flex items-center space-x-3 flex-1 min-w-0">
                        <img src="${dish.image}" class="w-12 h-12 object-cover rounded-lg shrink-0">
                        <div class="space-y-0.5 flex-1 min-w-0">
                            <div class="flex items-center space-x-1.5">
                                <h4 class="font-bold text-xs text-gray-800 truncate">${dish.name}</h4>
                                <span class="text-[9px] bg-amber-50 text-amber-700 px-1 py-0.2 rounded">${dish.category || '热菜'}</span>
                            </div>
                            <p class="text-[10px] text-amber-600 font-bold">¥${dish.price}</p>
                            <p class="text-[10px] text-gray-400 truncate">配料: ${dish.ingredients || '未填写'}</p>
                        </div>
                    </div>
                    <div class="flex items-center space-x-1 shrink-0 ml-2">
                        <button onclick="openEditDishModal(${dish.id})" class="bg-gray-100 hover:bg-gray-200 text-gray-700 p-1.5 rounded-lg text-xs"><i class="fa-solid fa-pen"></i></button>
                        <button onclick="deleteDish(${dish.id})" class="bg-red-50 hover:bg-red-100 text-red-600 p-1.5 rounded-lg text-xs"><i class="fa-solid fa-trash"></i></button>
                    </div>
                </div>
            `).join('');
        }

        function openAddDishModal() {
            document.getElementById('dishModalTitle').innerText = '添加新菜品与配料';
            document.getElementById('editDishId').value = '';
            document.getElementById('dishNameInput').value = '';
            document.getElementById('dishCategoryInput').value = '热菜';
            document.getElementById('dishPriceInput').value = '';
            document.getElementById('dishImageInput').value = '';
            document.getElementById('dishDescInput').value = '';
            document.getElementById('dishIngredientsInput').value = '';
            document.getElementById('dishModal').classList.remove('hidden');
        }

        function openEditDishModal(dishId) {
            let dish = (cloudData.dishes || []).find(d => d.id === dishId);
            if (!dish) return;
            document.getElementById('dishModalTitle').innerText = '编辑菜品与配料';
            document.getElementById('editDishId').value = dish.id;
            document.getElementById('dishNameInput').value = dish.name;
            document.getElementById('dishCategoryInput').value = dish.category || '热菜';
            document.getElementById('dishPriceInput').value = dish.price;
            document.getElementById('dishImageInput').value = dish.image;
            document.getElementById('dishDescInput').value = dish.desc || '';
            document.getElementById('dishIngredientsInput').value = dish.ingredients || '';
            document.getElementById('dishModal').classList.remove('hidden');
        }

        function closeDishModal() {
            document.getElementById('dishModal').classList.add('hidden');
        }

        async function saveDish() {
            let id = document.getElementById('editDishId').value;
            let name = document.getElementById('dishNameInput').value.trim();
            let category = document.getElementById('dishCategoryInput').value;
            let price = parseFloat(document.getElementById('dishPriceInput').value);
            let image = document.getElementById('dishImageInput').value.trim();
            let desc = document.getElementById('dishDescInput').value.trim();
            let ingredients = document.getElementById('dishIngredientsInput').value.trim();

            if (!name || isNaN(price)) {
                alert('请填写完整的菜品名称和有效价格！');
                return;
            }

            await fetchAllData();
            if (!cloudData.dishes) cloudData.dishes = [];

            if (id) {
                let dish = cloudData.dishes.find(d => d.id == id);
                if (dish) {
                    dish.name = name;
                    dish.category = category;
                    dish.price = price;
                    dish.image = image || 'https://images.unsplash.com/photo-1546069901-ba9599a7e63c';
                    dish.desc = desc;
                    dish.ingredients = ingredients;
                }
            } else {
                cloudData.dishes.push({
                    id: Date.now(),
                    name: name,
                    category: category,
                    price: price,
                    image: image || 'https://images.unsplash.com/photo-1546069901-ba9599a7e63c',
                    desc: desc,
                    ingredients: ingredients
                });
            }

            await saveAllData();
            closeDishModal();
            renderAll();
        }

        async function deleteDish(dishId) {
            if (!confirm('确定要从菜单库删除这个菜品吗？')) return;
            await fetchAllData();
            cloudData.dishes = (cloudData.dishes || []).filter(d => d.id !== dishId);
            await saveAllData();
            renderAll();
        }

        function openSupermarketMode() {
            document.getElementById('supermarketModal').classList.remove('hidden');
            renderSupermarketList();
        }
        async function closeSupermarketMode() {
            document.getElementById('supermarketModal').classList.add('hidden');
            await saveAllData();
            renderAll();
        }

        function renderSupermarketList() {
            const container = document.getElementById('supermarketListContainer');
            let list = getAggregatedIngredients();

            if (list.length === 0) {
                container.innerHTML = `<div class="text-center py-16 text-gray-400 text-xs">当前没有采购原材料任务~</div>`;
                document.getElementById('supermarketProgress').innerText = `已买: 0 / 0`;
                return;
            }

            if (!cloudData.checkedIngredients) cloudData.checkedIngredients = {};

            let checkedCount = list.filter(item => cloudData.checkedIngredients[item.key]).length;
            document.getElementById('supermarketProgress').innerText = `已买: ${checkedCount} / ${list.length}`;

            container.innerHTML = list.map(item => {
                let displayTotal = item.isText ? item.total : (Number.isInteger(item.total) ? item.total : item.total.toFixed(1));
                let isChecked = !!cloudData.checkedIngredients[item.key];
                return `
                    <div class="bg-white p-3 rounded-2xl border ${isChecked ? 'border-emerald-300 bg-emerald-50/40 opacity-70 line-through' : 'border-gray-200 shadow-xs'} flex items-center justify-between transition">
                        <div class="flex items-center space-x-3 flex-1 min-w-0 cursor-pointer" onclick="toggleSupermarketItem('${item.key}')">
                            <div class="w-6 h-6 rounded-lg border-2 shrink-0 ${isChecked ? 'bg-emerald-600 border-emerald-600 text-white flex items-center justify-center text-xs' : 'border-gray-300'}">
                                ${isChecked ? '<i class="fa-solid fa-check"></i>' : ''}
                            </div>
                            <div class="min-w-0">
                                <h4 class="font-bold text-sm text-gray-800 truncate">${item.name}</h4>
                                <p class="text-xs text-amber-700 font-semibold">需采购: ${displayTotal}${item.unit || '份'}</p>
                            </div>
                        </div>
                        <div class="flex items-center space-x-1 shrink-0 ml-2">
                            <button onclick="openEditManualItem('${item.key}', '${item.name}', ${item.total}, '${item.unit || ''}', ${item.isManual ? 'true' : 'false'})" class="bg-amber-50 text-amber-800 px-2 py-1 rounded text-xs" title="修改"><i class="fa-solid fa-pen"></i></button>
                            <button onclick="deleteSupermarketItem('${item.key}', ${item.isManual ? 'true' : 'false'})" class="bg-red-50 text-red-600 px-2 py-1 rounded text-xs" title="删除"><i class="fa-solid fa-trash"></i></button>
                        </div>
                    </div>
                `;
            }).join('');
        }

        async function toggleSupermarketItem(key) {
            if (!cloudData.checkedIngredients) cloudData.checkedIngredients = {};
            cloudData.checkedIngredients[key] = !cloudData.checkedIngredients[key];
            renderSupermarketList();
            await saveAllData();
        }

        function openAddManualShoppingItem() {
            document.getElementById('manualModalTitle').innerText = '临时加买原材料';
            document.getElementById('editManualKey').value = '';
            document.getElementById('editItemType').value = 'manual';
            document.getElementById('manualNameInput').value = '';
            document.getElementById('manualTotalInput').value = '';
            document.getElementById('manualUnitInput').value = '';
            document.getElementById('manualItemModal').classList.remove('hidden');
        }

        function openEditManualItem(key, name = '', total = '', unit = '', isManual = false) {
            document.getElementById('manualModalTitle').innerText = '修改采购项目';
            document.getElementById('editManualKey').value = key;
            document.getElementById('editItemType').value = isManual ? 'manual' : 'auto';
            document.getElementById('manualNameInput').value = name;
            document.getElementById('manualTotalInput').value = total;
            document.getElementById('manualUnitInput').value = unit;
            document.getElementById('manualItemModal').classList.remove('hidden');
        }

        function closeManualModal() {
            document.getElementById('manualItemModal').classList.add('hidden');
        }

        async function saveManualItem() {
            let key = document.getElementById('editManualKey').value;
            let itemType = document.getElementById('editItemType').value;
            let name = document.getElementById('manualNameInput').value.trim();
            let total = parseFloat(document.getElementById('manualTotalInput').value);
            let unit = document.getElementById('manualUnitInput').value.trim();

            if (!name || isNaN(total)) {
                alert('请填写完整的名称和有效数量！');
                return;
            }

            await fetchAllData();

            if (itemType === 'manual') {
                if (!cloudData.manualIngredients) cloudData.manualIngredients = [];
                let item = cloudData.manualIngredients.find(m => m.key === key);
                if (item) {
                    item.name = name;
                    item.total = total;
                    item.unit = unit;
                } else {
                    let newKey = 'manual_' + Date.now();
                    cloudData.manualIngredients.push({ key: newKey, name: name, total: total, unit: unit });
                }
            } else {
                // 自动汇总项的修改：通过覆盖机制直接更新名称、单位和目标总数
                if (!cloudData.ingredientOverrides) cloudData.ingredientOverrides = {};
                // 计算当前原本自动计算的差额或者直接覆盖总量
                cloudData.ingredientOverrides[key] = { name: name, unit: unit, total: total, deleted: false };
            }

            await saveAllData();
            closeManualModal();
            renderSupermarketList();
            renderSummaryIngredients();
        }

        async function deleteSupermarketItem(key, isManual = false) {
            if (!confirm('确定要从采购清单中删除这一项吗？')) return;
            await fetchAllData();

            if (isManual) {
                if (cloudData.manualIngredients) {
                    cloudData.manualIngredients = cloudData.manualIngredients.filter(m => m.key !== key);
                }
            } else {
                // 自动汇总项的删除：标记为 deleted
                if (!cloudData.ingredientOverrides) cloudData.ingredientOverrides = {};
                if (!cloudData.ingredientOverrides[key]) cloudData.ingredientOverrides[key] = {};
                cloudData.ingredientOverrides[key].deleted = true;
            }

            if (cloudData.checkedIngredients) {
                delete cloudData.checkedIngredients[key];
            }

            await saveAllData();
            renderSupermarketList();
            renderSummaryIngredients();
        }
    </script>
</body>
</html>
