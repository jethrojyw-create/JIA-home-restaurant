<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>家庭大厨管理系统 (澳洲极速版)</title>
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
</head>
<body class="bg-amber-50/40 text-gray-800 pb-32">

    <!-- 顶部导航 -->
    <header class="bg-white shadow-xs sticky top-0 z-40 px-4 py-3 flex justify-between items-center">
        <div class="flex items-center space-x-2">
            <span class="text-2xl">👨‍🍳</span>
            <h1 class="font-bold text-base text-amber-900">家庭大厨管理后台</h1>
        </div>
        <div class="flex items-center space-x-2">
            <button onclick="toggleDishModal()" class="bg-amber-600 hover:bg-amber-700 text-white text-xs font-medium px-3 py-2 rounded-full transition flex items-center space-x-1 shadow-xs">
                <i class="fa-solid fa-plus"></i>
                <span>添加新菜品</span>
            </button>
            <button onclick="fetchAllData()" class="bg-amber-50 hover:bg-amber-100 text-amber-800 text-xs font-medium px-3 py-2 rounded-full border border-amber-200 transition flex items-center space-x-1">
                <i class="fa-solid fa-rotate"></i>
                <span>刷新</span>
            </button>
        </div>
    </header>

    <!-- 主体内容区 -->
    <main class="max-w-md mx-auto p-4 space-y-6">
        
        <!-- 订单统计横幅 -->
        <div class="bg-gradient-to-r from-amber-600 to-amber-700 rounded-2xl p-4 text-white shadow-md flex justify-between items-center">
            <div>
                <p class="text-xs text-amber-100">今日待处理订单</p>
                <h2 id="pendingCount" class="text-2xl font-bold mt-0.5">0 单</h2>
            </div>
            <div class="text-right">
                <p class="text-xs text-amber-100">今日累计销售额</p>
                <h2 id="totalSales" class="text-2xl font-bold mt-0.5">¥0</h2>
            </div>
        </div>

        <!-- 订单列表 -->
        <section>
            <div class="flex justify-between items-center mb-3">
                <h3 class="font-bold text-base text-amber-900"><i class="fa-solid id-card mr-1.5"></i>实时点餐订单</h3>
                <span class="text-xs text-gray-400">数据自动同步中</span>
            </div>
            <div id="ordersContainer" class="space-y-3">
                <div class="text-center py-16 text-gray-400 text-sm">正在加载云端订单...</div>
            </div>
        </section>

        <!-- 现有菜单管理预览 -->
        <section class="pt-2">
            <div class="flex justify-between items-center mb-3">
                <h3 class="font-bold text-base text-amber-900"><i class="fa-solid fa-utensils mr-1.5"></i>当前菜单库</h3>
            </div>
            <div id="dishManageContainer" class="grid grid-cols-1 gap-3">
                <!-- 菜品列表动态渲染 -->
            </div>
        </section>
    </main>

    <!-- 添加菜品弹窗 -->
    <div id="dishModal" class="fixed inset-0 bg-black/50 z-50 flex items-center justify-center hidden p-4">
        <div class="bg-white w-full max-w-md rounded-2xl p-5 shadow-2xl space-y-4">
            <div class="flex justify-between items-center pb-2 border-b">
                <h3 class="font-bold text-base text-amber-900">新增菜品</h3>
                <button onclick="toggleDishModal()" class="text-gray-400 hover:text-gray-600"><i class="fa-solid fa-xmark text-lg"></i></button>
            </div>
            <div class="space-y-3 text-sm">
                <div>
                    <label class="block text-xs text-gray-500 mb-1">菜品名称</label>
                    <input type="text" id="newDishName" placeholder="例如：糖醋排骨" class="w-full bg-gray-50 border border-gray-200 rounded-xl px-3 py-2 outline-none focus:border-amber-500">
                </div>
                <div class="flex space-x-3">
                    <div class="flex-1">
                        <label class="block text-xs text-gray-500 mb-1">价格 (¥)</label>
                        <input type="number" id="newDishPrice" placeholder="48" class="w-full bg-gray-50 border border-gray-200 rounded-xl px-3 py-2 outline-none focus:border-amber-500">
                    </div>
                    <div class="flex-1">
                        <label class="block text-xs text-gray-500 mb-1">分类</label>
                        <select id="newDishCategory" class="w-full bg-gray-50 border border-gray-200 rounded-xl px-3 py-2 outline-none focus:border-amber-500">
                            <option value="热菜">热菜</option>
                            <option value="凉菜">凉菜</option>
                            <option value="主食/汤品">主食/汤品</option>
                            <option value="饮品/甜点">饮品/甜点</option>
                        </select>
                    </div>
                </div>
                <div>
                    <label class="block text-xs text-gray-500 mb-1">图片网址 (URL)</label>
                    <input type="text" id="newDishImage" placeholder="https://images.unsplash.com/..." class="w-full bg-gray-50 border border-gray-200 rounded-xl px-3 py-2 outline-none focus:border-amber-500">
                </div>
                <div>
                    <label class="block text-xs text-gray-500 mb-1">菜品简介/描述</label>
                    <input type="text" id="newDishDesc" placeholder="酸甜可口，老少皆宜" class="w-full bg-gray-50 border border-gray-200 rounded-xl px-3 py-2 outline-none focus:border-amber-500">
                </div>
            </div>
            <div class="pt-2 flex space-x-3">
                <button onclick="toggleDishModal()" class="flex-1 bg-gray-100 hover:bg-gray-200 text-gray-700 py-2.5 rounded-xl font-medium transition">取消</button>
                <button onclick="addNewDish()" class="flex-1 bg-amber-600 hover:bg-amber-700 text-white py-2.5 rounded-xl font-medium shadow-md transition">确认添加</button>
            </div>
        </div>
    </div>

    <script>
        // ======================== 使用同一个 Bin ID 对应你的 npoint.io 网址 ========================
        const API_URL = 'https://api.npoint.io/692e9e8f65204c754fc5';
        // =========================================================================================

        let cloudData = { dishes: [], orders: [] };

        async function fetchAllData() {
            try {
                let res = await fetch(API_URL);
                let json = await res.json();
                if (json) {
                    cloudData = json;
                    if (!cloudData.dishes) cloudData.dishes = [];
                    if (!cloudData.orders) cloudData.orders = [];
                }
            } catch (e) {
                console.log('同步云端数据失败', e);
            }
            renderDashboard();
        }

        async function saveAllData() {
            try {
                await fetch(API_URL, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(cloudData)
                });
            } catch (e) {
                alert('云端同步失败，请检查网络！');
            }
        }

        function renderDashboard() {
            const orders = cloudData.orders || [];
            const dishes = cloudData.dishes || [];

            // 统计待办与销售额
            const pending = orders.filter(o => o.status === '待制作').length;
            const totalSales = orders.reduce((sum, o) => sum + (o.totalPrice || 0), 0);
            document.getElementById('pendingCount').innerText = `${pending} 单`;
            document.getElementById('totalSales').innerText = `¥${totalSales}`;

            // 渲染订单列表
            const orderContainer = document.getElementById('ordersContainer');
            if (orders.length === 0) {
                orderContainer.innerHTML = `<div class="text-center py-12 bg-white rounded-2xl border border-gray-100 text-gray-400 text-sm">暂无点餐订单~</div>`;
            } else {
                orderContainer.innerHTML = orders.map(order => `
                    <div class="bg-white border border-gray-100 p-4 rounded-2xl shadow-xs space-y-3">
                        <div class="flex justify-between items-center border-b border-gray-100 pb-2">
                            <div>
                                <span class="font-bold text-amber-900 text-base"><i class="fa-solid fa-user-circle mr-1"></i> ${order.user}</span>
                                <span class="text-xs text-gray-400 ml-2">${order.time}</span>
                            </div>
                            <span class="text-xs px-2.5 py-1 rounded-full font-medium ${order.status === '已完成' ? 'bg-green-100 text-green-700' : 'bg-amber-100 text-amber-800 animate-pulse'}">${order.status}</span>
                        </div>
                        <div class="space-y-1.5">
                            ${order.items.map(i => `
                                <div class="flex justify-between text-sm text-gray-700">
                                    <div>
                                        <span class="font-semibold">${i.name}</span>
                                        <span class="text-gray-400 ml-1">x${i.count}</span>${i.note ? `<span class="text-amber-600 ml-1 bg-amber-50 px-1.5 py-0.5 rounded text-xs">(${i.note})</span>` : ''}
                                    </div>
                                    <span class="font-bold">¥${i.price * i.count}</span>
                                </div>
                            `).join('')}
                        </div>
                        <div class="flex justify-between items-center pt-2 border-t border-gray-100">
                            <span class="text-xs font-bold text-amber-900">合计：¥${order.totalPrice}</span>
                            <div class="space-x-2">
                                ${order.status === '待制作' ? `
                                    <button onclick="updateOrderStatus(${order.id}, '已完成')" class="bg-green-600 hover:bg-green-700 text-white text-xs px-3 py-1.5 rounded-lg font-medium transition shadow-xs">接单并完成</button>
                                ` : `
                                    <button onclick="updateOrderStatus(${order.id}, '待制作')" class="bg-gray-100 hover:bg-gray-200 text-gray-600 text-xs px-3 py-1.5 rounded-lg font-medium transition">设为待制作</button>
                                `}
                                <button onclick="deleteOrder(${order.id})" class="text-gray-300 hover:text-red-500 text-xs px-1.5 py-1.5 transition"><i class="fa-solid fa-trash"></i></button>
                            </div>
                        </div>
                    </div>
                `).join('');
            }

            // 渲染菜单管理列表
            const dishContainer = document.getElementById('dishManageContainer');
            if (dishes.length === 0) {
                dishContainer.innerHTML = `<div class="text-center py-6 text-gray-400 text-xs">菜单库暂无菜品</div>`;
            } else {
                dishContainer.innerHTML = dishes.map(dish => `
                    <div class="bg-white rounded-xl border border-gray-100 p-2.5 flex items-center justify-between shadow-xs">
                        <div class="flex items-center space-x-3">
                            <img src="${dish.image}" class="w-12 h-12 object-cover rounded-lg">
                            <div>
                                <h4 class="font-bold text-sm text-gray-800">${dish.name}</h4>
                                <p class="text-xs text-amber-600 font-semibold">¥${dish.price} <span class="text-gray-400 font-normal ml-1">(${dish.category})</span></p>
                            </div>
                        </div>
                        <button onclick="deleteDish(${dish.id})" class="text-gray-300 hover:text-red-500 p-2 transition"><i class="fa-solid fa-trash text-sm"></i></button>
                    </div>
                `).join('');
            }
        }

        async function updateOrderStatus(orderId, newStatus) {
            await fetchAllData();
            const order = (cloudData.orders || []).find(o => o.id === orderId);
            if (order) {
                order.status = newStatus;
                await saveAllData();
                renderDashboard();
            }
        }

        async function deleteOrder(orderId) {
            if (!confirm('确定要删除这条订单记录吗？')) return;
            await fetchAllData();
            cloudData.orders = (cloudData.orders || []).filter(o => o.id !== orderId);
            await saveAllData();
            renderDashboard();
        }

        function toggleDishModal() {
            document.getElementById('dishModal').classList.toggle('hidden');
        }

        async function addNewDish() {
            const name = document.getElementById('newDishName').value.trim();
            const price = parseFloat(document.getElementById('newDishPrice').value);
            const category = document.getElementById('newDishCategory').value;
            let image = document.getElementById('newDishImage').value.trim();
            const desc = document.getElementById('newDishDesc').value.trim();

            if (!name || isNaN(price)) {
                alert('请填写完整的菜品名称和价格！');
                return;
            }

            if (!image) {
                image = 'https://images.unsplash.com/photo-1546069901-ba9599a7e63c?w=300'; // 默认美食图片
            }

            await fetchAllData();
            if (!cloudData.dishes) cloudData.dishes = [];

            const newDish = {
                id: Date.now(),
                name,
                price,
                category,
                image,
                desc: desc || '美味家常菜'
            };

            cloudData.dishes.push(newDish);
            await saveAllData();
            toggleDishModal();
            renderDashboard();

            // 清空输入框
            document.getElementById('newDishName').value = '';
            document.getElementById('newDishPrice').value = '';
            document.getElementById('newDishImage').value = '';
            document.getElementById('newDishDesc').value = '';
            alert('新菜品添加成功！前台点餐页面将同步更新。');
        }

        async function deleteDish(dishId) {
            if (!confirm('确定要从菜单中下架并删除这个菜品吗？')) return;
            await fetchAllData();
            cloudData.dishes = (cloudData.dishes || []).filter(d => d.id !== dishId);
            await saveAllData();
            renderDashboard();
        }

        // 定时轮询（每隔 5 秒自动同步一次最新订单，方便大厨实时接单）
        setInterval(fetchAllData, 5000);
        fetchAllData();
    </script>
</body>
</html>
