<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>家庭采购管理后台 (后台)</title>
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
    <style>
        .no-scrollbar::-webkit-scrollbar { display: none; }
        .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
    </style>
</head>
<body class="bg-amber-50/40 text-gray-800 pb-32">

    <!-- 顶部导航 -->
    <header class="bg-white shadow-xs sticky top-0 z-40 px-3 py-3 flex justify-between items-center w-full">
        <div class="flex items-center space-x-2">
            <span class="text-xl">🛒</span>
            <div>
                <h1 class="font-bold text-sm text-amber-900 leading-tight">家庭采购管理后台</h1>
                <p class="text-[10px] text-gray-400">智能库存抵扣与订单清空</p>
            </div>
        </div>
        <div class="flex items-center space-x-1.5">
            <button onclick="openSupermarketMode()" class="bg-emerald-600 hover:bg-emerald-700 text-white text-xs font-bold px-3 py-1.5 rounded-lg transition flex items-center space-x-1 shadow-xs">
                <i class="fa-solid fa-basket-shopping"></i>
                <span>去超市买菜</span>
            </button>
            <button onclick="openAddDishModal()" class="bg-amber-600 hover:bg-amber-700 text-white text-xs font-bold px-3 py-1.5 rounded-lg transition flex items-center space-x-1 shadow-xs">
                <i class="fa-solid fa-plus"></i>
                <span>加菜</span>
            </button>
        </div>
    </header>

    <!-- 主体内容区 -->
    <main class="w-full max-w-lg mx-auto p-3 space-y-4">
        
        <!-- 顶部统计看板 (已移除预估总花费，保留菜品总数与订单数统计) -->
        <div class="grid grid-cols-1 gap-3">
            <div class="bg-white p-3.5 rounded-2xl border border-amber-200/60 shadow-xs space-y-1 text-center">
                <p class="text-[11px] text-gray-400">菜品总数 / 预定单数</p>
                <p class="text-lg font-extrabold text-amber-900"><span id="totalDishesCount">0</span> 样 / <span id="totalOrdersCount">0</span> 单</p>
            </div>
        </div>

        <!-- 选项卡切换 -->
        <div class="flex bg-amber-100/60 p-1 rounded-xl text-xs font-bold overflow-x-auto no-scrollbar">
            <button onclick="switchTab('summary')" id="tab-summary" class="flex-1 py-2 px-2 rounded-lg bg-white text-amber-900 shadow-xs transition whitespace-nowrap">周末采购清单</button>
            <button onclick="switchTab('inventory')" id="tab-inventory" class="flex-1 py-2 px-2 rounded-lg text-gray-600 transition whitespace-nowrap">库存管理</button>
            <button onclick="switchTab('orders')" id="tab-orders" class="flex-1 py-2 px-2 rounded-lg text-gray-600 transition whitespace-nowrap">点菜明细</button>
            <button onclick="switchTab('dishes')" id="tab-dishes" class="flex-1 py-2 px-2 rounded-lg text-gray-600 transition whitespace-nowrap">菜品库</button>
        </div>

        <!-- 面板 1：周末采购原材料清单 -->
        <div id="panel-summary" class="space-y-3">
            <div class="bg-white rounded-2xl p-3 border border-amber-200/60 shadow-xs space-y-2">
                <h3 class="font-bold text-xs text-amber-900 flex items-center justify-between">
                    <span><i class="fa-solid fa-basket-shopping mr-1 text-amber-600"></i>扣除库存后的实际需购清单</span>
                    <span class="text-[10px] text-amber-700 bg-amber-100 px-2 py-0.5 rounded-full font-bold">自动扣库存</span>
                </h3>
                <div id="summaryListContainer" class="space-y-2 pt-1">
                    <div class="text-center py-10 text-gray-400 text-xs">正在计算采购原材料...</div>
                </div>
            </div>
        </div>

        <!-- 面板 2：库存管理 -->
        <div id="panel-inventory" class="space-y-3 hidden">
            <div class="bg-white rounded-2xl p-3 border border-amber-200/60 shadow-xs space-y-2">
                <div class="flex justify-between items-center">
                    <h3 class="font-bold text-xs text-amber-900"><i class="fa-solid fa-warehouse mr-1 text-amber-600"></i>现有原材料库存</h3>
                    <button onclick="openAddInventoryModal()" class="text-amber-600 text-xs font-bold"><i class="fa-solid fa-plus mr-1"></i>添加库存</button>
                </div>
                <div class="relative">
                    <span class="absolute inset-y-0 left-0 flex items-center pl-3 text-gray-400"><i class="fa-solid fa-search text-xs"></i></span>
                    <input type="text" id="inventorySearchInput" oninput="renderInventory()" placeholder="输入原材料名称搜索库存..." class="w-full bg-gray-50 border border-gray-200 rounded-xl pl-8 pr-3 py-2 text-xs outline-none">
                </div>
                <div id="inventoryListContainer" class="space-y-2 pt-1">
                    <div class="text-center py-10 text-gray-400 text-xs">暂无库存记录...</div>
                </div>
            </div>
        </div>

        <!-- 面板 3：全家点菜明细 -->
        <div id="panel-orders" class="space-y-3 hidden">
            <div class="bg-white rounded-2xl p-3 border border-amber-200/60 shadow-xs space-y-2">
                <h3 class="font-bold text-xs text-amber-900 flex items-center justify-between">
                    <span><i class="fa-solid fa-receipt mr-1 text-amber-600"></i>家庭成员预定记录（按天归类）</span>
                    <span class="text-[10px] text-gray-400">原料买齐会自动变已采购</span>
                </h3>
                <div id="ordersListContainer" class="space-y-3 pt-1">
                    <div class="text-center py-10 text-gray-400 text-xs">暂无点菜订单...</div>
                </div>
            </div>
        </div>

        <!-- 面板 4：菜品库管理 -->
        <div id="panel-dishes" class="space-y-3 hidden">
            <div class="bg-white rounded-2xl p-3 border border-amber-200/60 shadow-xs space-y-2">
                <div class="flex justify-between items-center">
                    <h3 class="font-bold text-xs text-amber-900"><i class="fa-solid fa-utensils mr-1 text-amber-600"></i>可选菜单库与原材料</h3>
                    <button onclick="openAddDishModal()" class="text-amber-600 text-xs font-bold"><i class="fa-solid fa-plus mr-1"></i>添加新菜</button>
                </div>
                <div class="relative">
                    <span class="absolute inset-y-0 left-0 flex items-center pl-3 text-gray-400"><i class="fa-solid fa-search text-xs"></i></span>
                    <input type="text" id="dishSearchInput" oninput="renderDishesAdmin()" placeholder="输入菜品名称或配料关键字搜索..." class="w-full bg-gray-50 border border-gray-200 rounded-xl pl-8 pr-3 py-2 text-xs outline-none">
                </div>
                <div id="dishesListContainer" class="grid grid-cols-1 gap-2.5 pt-1">
                    <div class="text-center py-10 text-gray-400 text-xs">加载菜品库中...</div>
                </div>
            </div>
        </div>

        <!-- 📌 独立固定在页面最下方的：当天订单汇总与一键清空模块 -->
        <div class="bg-white rounded-2xl p-3.5 border-2 border-amber-300 shadow-md space-y-3 mt-6">
            <div class="flex justify-between items-center">
                <h3 class="font-bold text-xs text-amber-900 flex items-center">
                    <i class="fa-solid fa-calendar-day mr-1.5 text-amber-600 text-sm"></i>当天订单汇总与一键清空
                </h3>
                <select id="selectedDaySelect" onchange="renderTodaySummary()" class="bg-amber-50 border border-amber-200 text-amber-900 text-xs rounded-lg px-2.5 py-1 outline-none font-bold">
                    <option value="周一">周一</option>
                    <option value="周二">周二</option>
                    <option value="周三">周三</option>
                    <option value="周四">周四</option>
                    <option value="周五">周五</option>
                    <option value="周六">周六</option>
                    <option value="周日">周日</option>
                </select>
            </div>

            <!-- 当天菜品汇总容器 -->
            <div id="todayDishesSummaryContainer" class="space-y-2 pt-1">
                <div class="text-center py-6 text-gray-400 text-xs">暂无当天菜品需求...</div>
            </div>

            <!-- 一键结算并清空当天订单按钮 -->
            <div class="pt-2">
                <button onclick="settleAndClearTodayOrders()" class="w-full bg-red-600 hover:bg-red-700 text-white font-bold py-2.5 rounded-xl text-xs transition shadow-md flex items-center justify-center space-x-1.5">
                    <i class="fa-solid fa-trash-can-arrow-up"></i>
                    <span>一键扣除库存并清空当天订单</span>
                </button>
                <p class="text-[10px] text-gray-400 text-center mt-1.5">点击后将扣除对应库存，并**彻底清空**当天所有订单以接受新点菜</p>
            </div>
        </div>

    </main>

    <!-- 超市采购勾选大屏模式弹窗 -->
    <div id="supermarketModal" class="fixed inset-0 bg-white z-50 flex flex-col hidden">
        <div class="bg-emerald-600 text-white px-4 py-3 flex justify-between items-center shadow-md">
            <div class="flex items-center space-x-2">
                <i class="fa-solid fa-basket-shopping text-lg"></i>
                <h2 class="font-bold text-sm">超市原材料采购核对模式</h2>
            </div>
            <button onclick="closeSupermarketMode()" class="bg-emerald-700 hover:bg-emerald-800 text-white px-3 py-1.5 rounded-lg text-xs font-bold transition">保存退出</button>
        </div>
        <div class="bg-emerald-50 px-4 py-2 border-b space-y-2">
            <div class="flex justify-between items-center text-[11px] text-emerald-800">
                <span>买一样勾选一样，已扣除库存！</span>
                <span id="supermarketProgress" class="font-bold">已买: 0 / 0</span>
            </div>
            <div class="relative">
                <span class="absolute inset-y-0 left-0 flex items-center pl-3 text-gray-400"><i class="fa-solid fa-search text-xs"></i></span>
                <input type="text" id="supermarketSearchInput" oninput="renderSupermarketList()" placeholder="在采购清单中快速搜索..." class="w-full bg-white border border-emerald-200 rounded-xl pl-8 pr-3 py-1.5 text-xs outline-none">
            </div>
        </div>
        <div id="supermarketListContainer" class="flex-1 overflow-y-auto p-3 space-y-2.5 max-w-lg mx-auto w-full"></div>
        <div class="p-3 bg-white border-t max-w-lg mx-auto w-full">
            <button onclick="openAddManualShoppingItem()" class="w-full bg-emerald-600 hover:bg-emerald-700 text-white py-2.5 rounded-xl font-bold text-xs shadow-md transition">
                <i class="fa-solid fa-plus mr-1"></i> 在超市临时加买一项
            </button>
        </div>
    </div>

    <!-- 添加/修改库存弹窗 -->
    <div id="inventoryModal" class="fixed inset-0 bg-black/60 z-[60] flex items-center justify-center hidden p-3">
        <div class="bg-white w-full max-w-xs rounded-2xl p-4 shadow-2xl space-y-3">
            <h3 class="font-bold text-sm text-amber-900" id="inventoryModalTitle">添加/修改库存</h3>
            <input type="hidden" id="editInventoryKey">
            <div class="space-y-2.5 text-xs">
                <div>
                    <label class="text-gray-500 block mb-1">原材料名称</label>
                    <input type="text" id="inventoryNameInput" class="w-full bg-gray-50 border rounded-xl px-3 py-2 outline-none" placeholder="例如：五花肉">
                </div>
                <div class="flex space-x-2">
                    <div class="flex-1">
                        <label class="text-gray-500 block mb-1">库存数量</label>
                        <input type="number" id="inventoryTotalInput" class="w-full bg-gray-50 border rounded-xl px-3 py-2 outline-none" placeholder="500">
                    </div>
                    <div class="flex-1">
                        <label class="text-gray-500 block mb-1">单位</label>
                        <input type="text" id="inventoryUnitInput" class="w-full bg-gray-50 border rounded-xl px-3 py-2 outline-none" placeholder="g">
                    </div>
                </div>
            </div>
            <div class="flex space-x-2 pt-1">
                <button onclick="closeInventoryModal()" class="flex-1 bg-gray-100 py-2 rounded-xl text-xs font-bold">取消</button>
                <button onclick="saveInventoryItem()" class="flex-1 bg-amber-600 text-white py-2 rounded-xl text-xs font-bold">保存</button>
            </div>
        </div>
    </div>

    <!-- 临时加购弹窗 -->
    <div id="manualItemModal" class="fixed inset-0 bg-black/60 z-[60] flex items-center justify-center hidden p-3">
        <div class="bg-white w-full max-w-xs rounded-2xl p-4 shadow-2xl space-y-3">
            <h3 class="font-bold text-sm text-amber-900" id="manualModalTitle">修改采购项目</h3>
            <input type="hidden" id="editManualKey">
            <input type="hidden" id="editItemType">
            <div class="space-y-2.5 text-xs">
                <div>
                    <label class="text-gray-500 block mb-1">原材料名称</label>
                    <input type="text" id="manualNameInput" class="w-full bg-gray-50 border rounded-xl px-3 py-2 outline-none">
                </div>
                <div class="flex space-x-2">
                    <div class="flex-1">
                        <label class="text-gray-500 block mb-1">数量</label>
                        <input type="number" id="manualTotalInput" class="w-full bg-gray-50 border rounded-xl px-3 py-2 outline-none">
                    </div>
                    <div class="flex-1">
                        <label class="text-gray-500 block mb-1">单位</label>
                        <input type="text" id="manualUnitInput" class="w-full bg-gray-50 border rounded-xl px-3 py-2 outline-none">
                    </div>
                </div>
            </div>
            <div class="flex space-x-2 pt-1">
                <button onclick="closeManualModal()" class="flex-1 bg-gray-100 py-2 rounded-xl text-xs font-bold">取消</button>
                <button onclick="saveManualItem()" class="flex-1 bg-emerald-600 text-white py-2 rounded-xl text-xs font-bold">保存</button>
            </div>
        </div>
    </div>

    <!-- 添加/编辑菜品弹窗 -->
    <div id="dishModal" class="fixed inset-0 bg-black/60 z-50 flex items-center justify-center hidden p-3">
        <div class="bg-white w-full max-w-sm rounded-2xl p-4 shadow-2xl space-y-3 max-h-[90vh] overflow-y-auto">
            <h3 class="font-bold text-sm text-amber-900" id="dishModalTitle">添加新菜品</h3>
            <input type="hidden" id="editDishId">
            <div class="space-y-2.5 text-xs">
                <div>
                    <label class="text-gray-500 block mb-1">菜品名称</label>
                    <input type="text" id="dishNameInput" class="w-full bg-gray-50 border rounded-xl px-3 py-2 outline-none">
                </div>
                <div>
                    <label class="text-gray-500 block mb-1">分类</label>
                    <select id="dishCategoryInput" class="w-full bg-gray-50 border rounded-xl px-3 py-2 outline-none">
                        <option value="热菜">热菜</option>
                        <option value="凉菜">凉菜</option>
                        <option value="主食/汤品">主食/汤品</option>
                        <option value="饮品/甜点">饮品/甜点</option>
                        <option value="点心/面包">点心/面包</option>
                    </select>
                </div>
                <div>
                    <label class="text-gray-500 block mb-1">图片链接 (URL)</label>
                    <input type="text" id="dishImageInput" class="w-full bg-gray-50 border rounded-xl px-3 py-2 outline-none">
                </div>
                <div>
                    <label class="text-gray-500 block mb-1">简介</label>
                    <input type="text" id="dishDescInput" class="w-full bg-gray-50 border rounded-xl px-3 py-2 outline-none">
                </div>
                <div>
                    <label class="text-amber-800 font-bold block mb-1">所需原材料</label>
                    <textarea id="dishIngredientsInput" rows="2" class="w-full bg-amber-50 border border-amber-200 rounded-xl px-3 py-2 outline-none text-xs" placeholder="例如：五花肉 500g, 冰糖 30g"></textarea>
                </div>
                <div>
                    <label class="text-emerald-800 font-bold block mb-1">可选配菜 / 附加选项 (可选)</label>
                    <textarea id="dishOptionsInput" rows="2" class="w-full bg-emerald-50 border border-emerald-200 rounded-xl px-3 py-2 outline-none text-xs" placeholder="格式：名称:原材料 (多项用逗号隔开)"></textarea>
                </div>
            </div>
            <div class="flex space-x-2 pt-1">
                <button onclick="closeDishModal()" class="flex-1 bg-gray-100 py-2 rounded-xl text-xs font-bold">取消</button>
                <button onclick="saveDish()" class="flex-1 bg-amber-600 text-white py-2 rounded-xl text-xs font-bold">保存</button>
            </div>
        </div>
    </div>

    <script>
        const API_URL = 'https://api.npoint.io/692e9e8f65204c754fc5';

        let cloudData = { dishes: [], orders: [], checkedIngredients: [], manualIngredients: [], ingredientOverrides: {}, inventory: {} };
        let currentTab = 'summary';

        async function fetchAllData() {
            try {
                let res = await fetch(API_URL + '?t=' + Date.now());
                let json = await res.json();
                if (json) {
                    cloudData.dishes = json.dishes || [];
                    cloudData.orders = json.orders || [];
                    cloudData.checkedIngredients = json.checkedIngredients || {};
                    cloudData.manualIngredients = json.manualIngredients || [];
                    cloudData.ingredientOverrides = json.ingredientOverrides || {};
                    cloudData.inventory = json.inventory || {};

                    if (cloudData.dishes.length > 0) {
                        localStorage.setItem('family_dishes_only_backup', JSON.stringify(cloudData.dishes));
                    }
                }
            } catch (e) {
                console.log('网络同步失败', e);
            }

            if (cloudData.dishes.length === 0) {
                let localBackup = localStorage.getItem('family_dishes_only_backup');
                if (localBackup) {
                    cloudData.dishes = JSON.parse(localBackup);
                    await saveAllData();
                }
            }

            updateOrdersStatusAutomatically();
            renderAll();
        }

        async function saveAllData() {
            try {
                if (cloudData.dishes && cloudData.dishes.length > 0) {
                    localStorage.setItem('family_dishes_only_backup', JSON.stringify(cloudData.dishes));
                }
                await fetch(API_URL, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(cloudData)
                });
            } catch (e) {
                alert('云端同步失败，请检查网络！');
            }
        }

        window.onload = function() {
            initDeviceDateSelection(); 
            fetchAllData();
            setInterval(fetchAllData, 8000);
        }

        function initDeviceDateSelection() {
            const daysMap = ['周日', '周一', '周二', '周三', '周四', '周五', '周六'];
            const todayIndex = new Date().getDay();
            const todayStr = daysMap[todayIndex];
            
            let selectElem = document.getElementById('selectedDaySelect');
            if (selectElem) {
                selectElem.value = todayStr;
            }
        }

        function switchTab(tab) {
            currentTab = tab;
            ['summary', 'inventory', 'orders', 'dishes'].forEach(t => {
                let btn = document.getElementById(`tab-${t}`);
                let panel = document.getElementById(`panel-${t}`);
                if (t === tab) {
                    btn.className = "flex-1 py-2 px-2 rounded-lg bg-white text-amber-900 shadow-xs transition whitespace-nowrap";
                    panel.classList.remove('hidden');
                } else {
                    btn.className = "flex-1 py-2 px-2 rounded-lg text-gray-600 transition whitespace-nowrap";
                    panel.classList.add('hidden');
                }
            });
            renderAll();
        }

        function renderAll() {
            renderStats();
            if (currentTab === 'summary') renderSummaryIngredients();
            if (currentTab === 'inventory') renderInventory();
            if (currentTab === 'orders') renderOrders();
            if (currentTab === 'dishes') renderDishesAdmin();
            renderTodaySummary(); 
            if (!document.getElementById('supermarketModal').classList.contains('hidden')) {
                renderSupermarketList();
            }
        }

        function renderStats() {
            document.getElementById('totalDishesCount').innerText = (cloudData.dishes || []).length;
            document.getElementById('totalOrdersCount').innerText = (cloudData.orders || []).length;
        }

        function updateOrdersStatusAutomatically() {
            let list = getRawAggregatedIngredients();
            let inventory = cloudData.inventory || {};
            let checked = cloudData.checkedIngredients || {};
            let statusChanged = false;

            let netNeededList = [];
            list.forEach(item => {
                let invItem = inventory[item.key];
                let invStock = invItem ? invItem.total : 0;
                let needed = item.total - invStock;
                if (item.isText || needed > 0) {
                    netNeededList.push(item.key);
                }
            });

            let allChecked = netNeededList.length > 0 && netNeededList.every(key => checked[key]);

            (cloudData.orders || []).forEach(order => {
                if (!order.items || order.items.length === 0) return;
                let targetStatus = (netNeededList.length === 0 || allChecked) ? '已采购' : '待采购';
                if (!order.status) order.status = '待采购';

                if (order.status !== targetStatus) {
                    order.status = targetStatus;
                    statusChanged = true;
                }
            });

            if (statusChanged) {
                saveAllData();
            }
        }

        async function cycleOrderStatus(orderId) {
            await fetchAllData();
            let order = (cloudData.orders || []).find(o => o.id === orderId);
            if (order) {
                if (!order.status || order.status === '待采购') order.status = '已采购';
                else order.status = '待采购';
                await saveAllData();
                renderAll();
            }
        }

        function getRawAggregatedIngredients() {
            let orders = cloudData.orders || [];
            let dishes = cloudData.dishes || [];
            let dishMap = {};
            dishes.forEach(d => { dishMap[d.id] = d; });

            let ingredientSummary = {};

            function addIngredientsToSummary(ingredientsStr, times) {
                if (!ingredientsStr) return;
                let rawParts = ingredientsStr.split(/[,，;；]/);
                rawParts.forEach(part => {
                    part = part.trim();
                    if (!part) return;
                    let match = part.match(/^([\u4e00-\u9fa5\w\s\(\)]+?)\s*([\d\.]+)\s*([a-zA-Z\u4e00-\u9fa5]+)?$/);
                    if (match) {
                        let ingName = match[1].trim();
                        let val = parseFloat(match[2]);
                        let unit = match[3] ? match[3].trim() : '';
                        let key = `auto_${ingName}_${unit}`;

                        if (!ingredientSummary[key]) {
                            ingredientSummary[key] = { key: key, name: ingName, unit: unit, total: 0 };
                        }
                        ingredientSummary[key].total += val * times;
                    } else {
                        let key = `auto_other_${part}`;
                        if (!ingredientSummary[key]) {
                            ingredientSummary[key] = { key: key, name: part, unit: '', total: 0, isText: true };
                        }
                        ingredientSummary[key].total += times;
                    }
                });
            }

            orders.forEach(order => {
                if (!order.items) return;
                order.items.forEach(orderItem => {
                    let dish = dishMap[orderItem.id];
                    if (dish) {
                        let times = orderItem.count;
                        if (dish.ingredients) addIngredientsToSummary(dish.ingredients, times);
                        if (orderItem.selectedOptions && orderItem.selectedOptions.length > 0 && dish.options) {
                            orderItem.selectedOptions.forEach(optName => {
                                let foundOpt = dish.options.find(o => o.name === optName);
                                if (foundOpt && foundOpt.ingredients) {
                                    addIngredientsToSummary(foundOpt.ingredients, times);
                                }
                            });
                        }
                    }
                });
            });

            let list = [];
            for (let key in ingredientSummary) {
                let item = ingredientSummary[key];
                if (cloudData.ingredientOverrides && cloudData.ingredientOverrides[key]) {
                    let override = cloudData.ingredientOverrides[key];
                    if (override.deleted) continue;
                    list.push({ key: key, name: override.name, unit: override.unit, total: override.total });
                } else {
                    list.push(item);
                }
            }
            return list;
        }

        function getAggregatedIngredients() {
            let rawList = getRawAggregatedIngredients();
            let inventory = cloudData.inventory || {};
            let resultList = [];

            rawList.forEach(item => {
                let invItem = inventory[item.key];
                let stock = invItem ? invItem.total : 0;
                let needed = item.isText ? item.total : (item.total - stock);

                if (item.isText || needed > 0) {
                    resultList.push({
                        key: item.key,
                        name: item.name,
                        unit: item.unit,
                        total: needed,
                        stockUsed: stock,
                        originalTotal: item.total
                    });
                }
            });

            if (cloudData.manualIngredients) {
                cloudData.manualIngredients.forEach(m => {
                    resultList.push({
                        key: m.key,
                        name: m.name,
                        unit: m.unit,
                        total: m.total,
                        isManual: true
                    });
                });
            }

            return resultList;
        }

            orders.forEach(order => {
                if (!order.items) return;
                order.items.forEach(item => {
                    let key = item.id;

                                let ingKey = `auto_${ingName}_${unit}`;
                                if (!ingredientSummary[ingKey]) {

            html += `<div class="grid grid-cols-1 gap-1.5">`;

            for (let k in ingredientSummary) {
                hasIng = true;
                let ing = ingredientSummary[k];

        async function settleAndClearTodayOrders() {
            const selectedDay = document.getElementById('selectedDaySelect').value;
            if (!confirm(`确定要结算并【清空】【${selectedDay}】的所有订单吗？\n\n注意：此操作将自动扣除库存，并彻底删除当天订单以便接受新的点菜！`)) return;

            await fetchAllData();
            let orders = cloudData.orders || [];
            let inventory = cloudData.inventory || {};
            let dishesMap = {};
            (cloudData.dishes || []).forEach(d => { dishesMap[d.id] = d; });

            let targetOrders = orders.filter(o => o.targetDay === selectedDay);
            if (targetOrders.length === 0) {
                alert(`【${selectedDay}】当前没有订单可以清空！`);
                return;
            }

            let ingredientConsumption = {};
            targetOrders.forEach(order => {
                if (!order.items) return;
                order.items.forEach(item => {
                    let dish = dishesMap[item.id];
                    if (dish && dish.ingredients) {
                        let times = item.count;
                        let rawParts = dish.ingredients.split(/[,，;；]/);
                        rawParts.forEach(part => {
                            part = part.trim();
                            if (!part) return;
                            let match = part.match(/^([\u4e00-\u9fa5\w\s\(\)]+?)\s*([\d\.]+)\s*([a-zA-Z\u4e00-\u9fa5]+)?$/);
                            if (match) {
                                let ingName = match[1].trim();
                                let val = parseFloat(match[2]);
                                let unit = match[3] ? match[3].trim() : '';
                                let ingKey = `auto_${ingName}_${unit}`;
                                if (!ingredientConsumption[ingKey]) {
                                    ingredientConsumption[ingKey] = { name: ingName, unit: unit, total: 0 };
                                }
                                ingredientConsumption[ingKey].total += val * times;
                            }
                        });
                    }
                });
            });

            for (let key in ingredientConsumption) {
                let consumption = ingredientConsumption[key];
                if (inventory[key]) {
                    inventory[key].total = Math.max(0, inventory[key].total - consumption.total);
                } else {
                    inventory[key] = {
                        name: consumption.name,
                        total: -consumption.total,
                        unit: consumption.unit
                    };
                }
            }

            cloudData.inventory = inventory;
            cloudData.orders = orders.filter(o => o.targetDay !== selectedDay);

            updateOrdersStatusAutomatically();
            await saveAllData();
            renderAll();
            alert(`【${selectedDay}】订单已成功清空，库存已完成扣除！现在可以接受新的点菜了✨`);
        }

        async function saveDish() {

            let name = document.getElementById('dishNameInput').value.trim();
            let category = document.getElementById('dishCategoryInput').value;
            let image = document.getElementById('dishImageInput').value.trim();

                    if (!p) return;
                    let sub = p.split(':');
                    if (sub.length >= 1) {
                        parsedOptions.push({
                            name: sub[0].trim(),
                            price: 0,
                            ingredients: sub[1] ? sub[1].trim() : ''
                        });
                    }
                });
            }

            await fetchAllData();

            if (id) {

                    dish.ingredients = ingredients;

                    id: Date.now(),
                    name: name,
                    category: category,
                    price: 0,
                    image: image || 'https://images.unsplash.com/photo-1546069901-ba9599a7e63c',
                    desc: desc,
                    ingredients: ingredients,
                    options: parsedOptions
                });

            await saveAllData();
            closeDishModal();

                let displayTotal = item.isText ? item.total : (Number.isInteger(item.total) ? item.total : item.total.toFixed(1));
                let isChecked = !!cloudData.checkedIngredients[item.key];
                let stockInfo = item.stockUsed ? `<span class="text-[10px] text-emerald-600 block">已用库存抵扣 ${item.stockUsed}${item.unit}</span>` : '';
                return `
                    <div class="bg-white p-3 rounded-2xl border ${isChecked ? 'border-emerald-300 bg-emerald-50/40 opacity-70 line-through' : 'border-gray-200 shadow-xs'} flex items-center justify-between transition">
                        <div class="flex items-center space-x-3 flex-1 min-w-0 cursor-pointer" onclick="toggleSupermarketItem('${item.key}')">
                            <div class="w-6 h-6 rounded-lg border-2 shrink-0 ${isChecked ? 'bg-emerald-600 border-emerald-600 text-white flex items-center justify-center text-xs' : 'border-gray-300'}">
                                ${isChecked ? '<i class="fa-solid fa-check"></i>' : ''}
                            </div>
                            <div class="min-w-0">
                                <h4 class="font-bold text-sm text-gray-800 truncate">${item.name}</h4>
                                <p class="text-xs text-amber-700 font-semibold">需采购差额: ${displayTotal}${item.unit || '份'}</p>
                                ${stockInfo}
                            </div>
                        </div>
                        <div class="flex items-center space-x-1 shrink-0 ml-2">
                            <button onclick="openEditManualItem('${item.key}', '${item.name}', ${item.total}, '${item.unit || ''}', ${item.isManual ? 'true' : 'false'})" class="bg-amber-50 text-amber-800 px-2 py-1 rounded text-xs" title="修改"><i class="fa-solid fa-pen"></i></button>
                            <button onclick="deleteSupermarketItem('${item.key}', ${item.isManual ? 'true' : 'false'})" class="bg-red-50 text-red-600 px-2 py-1 rounded text-xs" title="删除"><i class="fa-solid fa-trash"></i></button>
                        </div>
                    </div>
                `;
            }).join('');
        }

        async function toggleSupermarketItem(key) {
            if (!cloudData.checkedIngredients) cloudData.checkedIngredients = {};
            cloudData.checkedIngredients[key] = !cloudData.checkedIngredients[key];
            
            updateOrdersStatusAutomatically();
            renderSupermarketList();
            await saveAllData();
        }

        function openAddManualShoppingItem() {
            document.getElementById('manualModalTitle').innerText = '临时加买原材料';
            document.getElementById('editManualKey').value = '';
            document.getElementById('editItemType').value = 'manual';
            document.getElementById('manualNameInput').value = '';
            document.getElementById('manualTotalInput').value = '';
            document.getElementById('manualUnitInput').value = '';
            document.getElementById('manualItemModal').classList.remove('hidden');
        }

        function openEditManualItem(key, name = '', total = '', unit = '', isManual = false) {
            document.getElementById('manualModalTitle').innerText = '修改采购项目';
            document.getElementById('editManualKey').value = key;
            document.getElementById('editItemType').value = isManual ? 'manual' : 'auto';
            document.getElementById('manualNameInput').value = name;
            document.getElementById('manualTotalInput').value = total;
            document.getElementById('manualUnitInput').value = unit;
            document.getElementById('manualItemModal').classList.remove('hidden');
        }

        function closeManualModal() {
            document.getElementById('manualItemModal').classList.add('hidden');
        }

        async function saveManualItem() {
            let key = document.getElementById('editManualKey').value;
            let itemType = document.getElementById('editItemType').value;
            let name = document.getElementById('manualNameInput').value.trim();
            let total = parseFloat(document.getElementById('manualTotalInput').value);
            let unit = document.getElementById('manualUnitInput').value.trim();

            if (!name || isNaN(total)) {
                alert('请填写完整的名称和有效数量！');
                return;
            }

            await fetchAllData();

            if (itemType === 'manual') {
                if (!cloudData.manualIngredients) cloudData.manualIngredients = [];
                let item = cloudData.manualIngredients.find(m => m.key === key);
                if (item) {
                    item.name = name;
                    item.total = total;
                    item.unit = unit;
                } else {
                    let newKey = 'manual_' + Date.now();
                    cloudData.manualIngredients.push({ key: newKey, name: name, total: total, unit: unit });
                }
            } else {
                if (!cloudData.ingredientOverrides) cloudData.ingredientOverrides = {};
                cloudData.ingredientOverrides[key] = { name: name, unit: unit, total: total, deleted: false };
            }

            updateOrdersStatusAutomatically();
            await saveAllData();
            closeManualModal();
            renderSupermarketList();
            renderSummaryIngredients();
        }

        async function deleteSupermarketItem(key, isManual = false) {
            if (!confirm('确定要从采购清单中删除这一项吗？')) return;
            await fetchAllData();

            if (isManual) {
                if (cloudData.manualIngredients) {
                    cloudData.manualIngredients = cloudData.manualIngredients.filter(m => m.key !== key);
                }
            } else {
                if (!cloudData.ingredientOverrides) cloudData.ingredientOverrides = {};
                if (!cloudData.ingredientOverrides[key]) cloudData.ingredientOverrides[key] = {};
                cloudData.ingredientOverrides[key].deleted = true;
            }

            if (cloudData.checkedIngredients) {
                delete cloudData.checkedIngredients[key];
            }

            updateOrdersStatusAutomatically();
            await saveAllData();
            renderSupermarketList();
            renderSummaryIngredients();
        }
    </script>
</body>
</html>
