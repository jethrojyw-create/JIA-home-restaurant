<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>家庭全周大采购 - 点菜端</title>
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
    <style>
        .no-scrollbar::-webkit-scrollbar { display: none; }
        .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
    </style>
</head>
<body class="bg-amber-50/40 text-gray-800 pb-32">

    <!-- 顶部导航 -->
    <header class="bg-white shadow-xs sticky top-0 z-40 px-3 py-3 flex justify-between items-center w-full">
        <div class="flex items-center space-x-2">
            <span class="text-xl">🍲</span>
            <div>
                <h1 class="font-bold text-sm text-amber-900 leading-tight">家庭全周大采购</h1>
                <p class="text-[10px] text-gray-400">点选你想吃的美食</p>
            </div>
        </div>
        <div class="flex items-center space-x-2">
            <select id="userSelector" class="bg-amber-50 text-amber-900 text-xs font-bold px-2 py-1.5 rounded-lg border border-amber-200 outline-none">
                <option value="爸爸">👨 爸爸</option>
                <option value="妈妈">👩 妈妈</option>
                <option value="哥哥">👦 哥哥</option>
                <option value="妹妹">👧 妹妹</option>
                <option value="爷爷">👴 爷爷</option>
                <option value="奶奶">👵 奶奶</option>
            </select>
        </div>
    </header>

    <!-- 主体内容区 -->
    <main class="w-full max-w-lg mx-auto p-3 space-y-4">
        
        <!-- 星期选择横向滚动 -->
        <div class="flex space-x-2 overflow-x-auto no-scrollbar py-1" id="daySelectorContainer"></div>

        <!-- 分类筛选标签 -->
        <div class="flex space-x-2 overflow-x-auto no-scrollbar text-xs">
            <button onclick="filterCategory('全部')" id="cat-全部" class="px-3 py-1.5 rounded-full bg-amber-600 text-white font-bold shrink-0 transition">全部菜品</button>
            <button onclick="filterCategory('热菜')" id="cat-热菜" class="px-3 py-1.5 rounded-full bg-white text-gray-600 border border-amber-200 shrink-0 transition">热菜</button>
            <button onclick="filterCategory('凉菜')" id="cat-凉菜" class="px-3 py-1.5 rounded-full bg-white text-gray-600 border border-amber-200 shrink-0 transition">凉菜</button>
            <button onclick="filterCategory('主食/汤品')" id="cat-主食/汤品" class="px-3 py-1.5 rounded-full bg-white text-gray-600 border border-amber-200 shrink-0 transition">主食/汤品</button>
            <button onclick="filterCategory('饮品/甜点')" id="cat-饮品/甜点" class="px-3 py-1.5 rounded-full bg-white text-gray-600 border border-amber-200 shrink-0 transition">饮品/甜点</button>
        </div>

        <!-- 菜品列表 -->
        <div id="dishListContainer" class="grid grid-cols-1 gap-3">
            <div class="text-center py-16 text-gray-400 text-xs">正在加载菜单库...</div>
        </div>
    </main>

    <!-- 底部悬浮购物车栏 -->
    <div class="fixed bottom-0 left-0 right-0 bg-white border-t border-amber-100 p-3 shadow-lg z-40">
        <div class="w-full max-w-lg mx-auto flex items-center justify-between">
            <div class="flex items-center space-x-2">
                <div class="relative bg-amber-100 p-2.5 rounded-xl text-amber-800">
                    <i class="fa-solid fa-basket-shopping text-base"></i>
                    <span id="cartBadge" class="absolute -top-1 -right-1 bg-red-500 text-white text-[10px] w-4 h-4 rounded-full flex items-center justify-center font-bold hidden">0</span>
                </div>
                <div>
                    <p class="text-xs text-gray-400" id="cartSummaryText">已选 0 样菜品</p>
                    <p class="text-sm font-extrabold text-amber-900">¥<span id="cartTotalPrice">0</span></p>
                </div>
            </div>
            <div class="flex space-x-2">
                <button onclick="openCartModal()" class="bg-amber-100 text-amber-900 px-3 py-2 rounded-xl text-xs font-bold">查看已点</button>
                <button onclick="submitOrder()" class="bg-amber-600 hover:bg-amber-700 text-white px-4 py-2 rounded-xl text-xs font-bold transition shadow-xs">提交订单</button>
            </div>
        </div>
    </div>

    <!-- 已选菜品明细弹窗 -->
    <div id="cartModal" class="fixed inset-0 bg-black/60 z-50 flex items-end hidden">
        <div class="bg-white w-full rounded-t-3xl p-4 space-y-3 max-h-[70vh] flex flex-col">
            <div class="flex justify-between items-center border-b pb-2">
                <h3 class="font-bold text-sm text-amber-900">当前选择的菜单明细</h3>
                <button onclick="closeCartModal()" class="text-gray-400 hover:text-gray-600"><i class="fa-solid fa-xmark text-base"></i></button>
            </div>
            <div id="cartModalItems" class="flex-1 overflow-y-auto space-y-2.5 py-1"></div>
            <div class="pt-2 border-t flex justify-between items-center">
                <span class="text-xs text-gray-500">合计总额</span>
                <span class="text-base font-extrabold text-amber-900">¥<span id="cartModalTotal">0</span></span>
            </div>
        </div>
    </div>

    <script>
        const API_URL = 'https://api.npoint.io/692e9e8f65204c754fc5';

        let cloudData = { dishes: [], orders: [] };
        let selectedDay = '周一';
        let currentCategory = '全部';
        let cart = {};
        const days = ['周一', '周二', '周三', '周四', '周五', '周六', '周日'];

        async function fetchAllData() {
            try {
                let res = await fetch(API_URL + '?t=' + Date.now());
                let json = await res.json();
                if (json && json.dishes && json.dishes.length > 0) {
                    cloudData = json;
                    if (!cloudData.orders) cloudData.orders = [];
                    // 💾 成功从云端拉取菜单后，自动更新本地备份
                    localStorage.setItem('family_dishes_backup', JSON.stringify(cloudData.dishes));
                } else {
                    // 🛡️ 如果云端被清空，自动从本地备份恢复
                    let localBackup = localStorage.getItem('family_dishes_backup');
                    if (localBackup) {
                        cloudData.dishes = JSON.parse(localBackup);
                        console.log('前台检测到云端清空，已从本地备份恢复！');
                        await saveAllData();
                    }
                }
            } catch (e) {
                console.log('网络请求失败，尝试读取本地备份', e);
                let localBackup = localStorage.getItem('family_dishes_backup');
                if (localBackup) {
                    cloudData.dishes = JSON.parse(localBackup);
                }
            }

            renderAll();
        }

        async function saveAllData() {
            try {
                if (cloudData.dishes && cloudData.dishes.length > 0) {
                    localStorage.setItem('family_dishes_backup', JSON.stringify(cloudData.dishes));
                }
                await fetch(API_URL, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(cloudData)
                });
            } catch (e) {
                console.log('云端同步失败');
            }
        }

        window.onload = function() {
            renderDaySelector();
            fetchAllData();
            setInterval(fetchAllData, 8000);
        }

        function renderDaySelector() {
            const container = document.getElementById('daySelectorContainer');
            container.innerHTML = days.map(d => `
                <button onclick="selectDay('${d}')" id="day-btn-${d}" class="px-3.5 py-2 rounded-xl text-xs font-bold shrink-0 transition ${d === selectedDay ? 'bg-amber-600 text-white shadow-xs' : 'bg-white text-gray-600 border border-amber-200'}">
                    ${d}
                </button>
            `).join('');
        }

        function selectDay(day) {
            selectedDay = day;
            renderDaySelector();
        }

        function filterCategory(cat) {
            currentCategory = cat;
            ['全部', '热菜', '凉菜', '主食/汤品', '饮品/甜点'].forEach(c => {
                let btn = document.getElementById(`cat-${c}`);
                if (c === cat) {
                    btn.className = "px-3 py-1.5 rounded-full bg-amber-600 text-white font-bold shrink-0 transition";
                } else {
                    btn.className = "px-3 py-1.5 rounded-full bg-white text-gray-600 border border-amber-200 shrink-0 transition";
                }
            });
            renderDishes();
        }

        function renderAll() {
            renderDishes();
            updateCartUI();
        }

        function renderDishes() {
            const container = document.getElementById('dishListContainer');
            let dishes = cloudData.dishes || [];

            if (currentCategory !== '全部') {
                dishes = dishes.filter(d => d.category === currentCategory);
            }

            if (dishes.length === 0) {
                container.innerHTML = `<div class="text-center py-16 text-gray-400 text-xs">暂无相关菜品~</div>`;
                return;
            }

            container.innerHTML = dishes.map(dish => {
                let count = cart[dish.id] || 0;
                return `
                    <div class="bg-white rounded-2xl p-3 border border-amber-200/60 shadow-xs flex items-center justify-between space-x-3">
                        <img src="${dish.image}" class="w-16 h-16 object-cover rounded-xl shrink-0">
                        <div class="space-y-1 flex-1 min-w-0">
                            <div class="flex items-center space-x-1.5">
                                <h3 class="font-bold text-xs text-gray-800 truncate">${dish.name}</h3>
                                <span class="text-[9px] bg-amber-50 text-amber-700 px-1.5 py-0.2 rounded">${dish.category || '热菜'}</span>
                            </div>
                            <p class="text-[10px] text-gray-400 truncate">${dish.desc || '美味可口'}</p>
                            <p class="text-xs font-extrabold text-amber-700">¥${dish.price}</p>
                        </div>
                        <div class="flex items-center space-x-2 shrink-0">
                            ${count > 0 ? `
                                <button onclick="updateCart(${dish.id}, -1)" class="w-7 h-7 bg-amber-100 text-amber-900 rounded-lg font-bold flex items-center justify-center text-xs"><i class="fa-solid fa-minus"></i></button>
                                <span class="text-xs font-bold w-4 text-center">${count}</span>
                            ` : ''}
                            <button onclick="updateCart(${dish.id}, 1)" class="w-7 h-7 bg-amber-600 text-white rounded-lg font-bold flex items-center justify-center text-xs shadow-xs"><i class="fa-solid fa-plus"></i></button>
                        </div>
                    </div>
                `;
            }).join('');
        }

        function updateCart(dishId, delta) {
            cart[dishId] = (cart[dishId] || 0) + delta;
            if (cart[dishId] <= 0) delete cart[dishId];
            renderDishes();
            updateCartUI();
        }

        function updateCartUI() {
            let totalCount = 0;
            let totalPrice = 0;
            let dishMap = {};
            (cloudData.dishes || []).forEach(d => { dishMap[d.id] = d; });

            Object.entries(cart).forEach(([id, count]) => {
                let dish = dishMap[id];
                if (dish) {
                    totalCount += count;
                    totalPrice += dish.price * count;
                }
            });

            document.getElementById('cartBadge').innerText = totalCount;
            if (totalCount > 0) {
                document.getElementById('cartBadge').classList.remove('hidden');
            } else {
                document.getElementById('cartBadge').classList.add('hidden');
            }

            document.getElementById('cartSummaryText').innerText = `已选 ${totalCount} 样菜品 (${selectedDay})`;
            document.getElementById('cartTotalPrice').innerText = totalPrice;
            document.getElementById('cartModalTotal').innerText = totalPrice;
        }

        function openCartModal() {
            const container = document.getElementById('cartModalItems');
            let dishMap = {};
            (cloudData.dishes || []).forEach(d => { dishMap[d.id] = d; });

            let entries = Object.entries(cart);
            if (entries.length === 0) {
                container.innerHTML = `<div class="text-center py-10 text-gray-400 text-xs">还没有选择任何菜品~</div>`;
            } else {
                container.innerHTML = entries.map(([id, count]) => {
                    let dish = dishMap[id];
                    if (!dish) return '';
                    return `
                        <div class="flex justify-between items-center bg-amber-50/50 p-2.5 rounded-xl border border-amber-100 text-xs">
                            <span class="font-bold text-gray-800">${dish.name}</span>
                            <div class="flex items-center space-x-3">
                                <span class="text-amber-700 font-bold">¥${dish.price * count}</span>
                                <div class="flex items-center space-x-1.5">
                                    <button onclick="updateCart(${dish.id}, -1)" class="w-6 h-6 bg-amber-100 rounded text-amber-900 font-bold">-</button>
                                    <span class="w-4 text-center font-bold">${count}</span>
                                    <button onclick="updateCart(${dish.id}, 1)" class="w-6 h-6 bg-amber-600 rounded text-white font-bold">+</button>
                                </div>
                            </div>
                        </div>
                    `;
                }).join('');
            }
            document.getElementById('cartModal').classList.remove('hidden');
        }

        function closeCartModal() {
            document.getElementById('cartModal').classList.add('hidden');
        }

        async function submitOrder() {
            let entries = Object.entries(cart);
            if (entries.length === 0) {
                alert('请先选择要吃的菜品！');
                return;
            }

            let user = document.getElementById('userSelector').value;
            let dishMap = {};
            (cloudData.dishes || []).forEach(d => { dishMap[d.id] = d; });

            let items = [];
            let totalPrice = 0;
            entries.forEach(([id, count]) => {
                let dish = dishMap[id];
                if (dish) {
                    items.push({ id: dish.id, name: dish.name, price: dish.price, count: count });
                    totalPrice += dish.price * count;
                }
            });

            let newOrder = {
                id: Date.now(),
                user: user,
                targetDay: selectedDay,
                items: items,
                totalPrice: totalPrice,
                status: '待采购',
                time: new Date().toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' })
            };

            await fetchAllData();
            if (!cloudData.orders) cloudData.orders = [];
            cloudData.orders.unshift(newOrder);

            await saveAllData();
            cart = {};
            closeCartModal();
            renderAll();
            alert(`🎉 成功为 ${selectedDay} 点餐提交成功！`);
        }
    </script>
</body>
</html>
