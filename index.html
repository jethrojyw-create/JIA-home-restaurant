<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>家庭全周大采购点菜端 (澳洲极速版)</title>
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
</head>
<body class="bg-amber-50/40 text-gray-800 pb-32">

    <!-- 顶部导航 -->
    <header class="bg-white shadow-xs sticky top-0 z-40 px-4 py-3 flex justify-between items-center">
        <div class="flex items-center space-x-2">
            <span class="text-2xl">🍲</span>
            <div>
                <h1 class="font-bold text-base text-amber-900">家庭全周菜单预定</h1>
                <p class="text-[10px] text-gray-400" id="currentLoginUserDisplay">当前点菜人: 请设置</p>
            </div>
        </div>
        <div class="flex items-center space-x-2">
            <!-- 新增：查看我的预定单按钮 -->
            <button onclick="openMyOrdersModal()" class="bg-amber-100 hover:bg-amber-200 text-amber-800 text-xs font-bold px-3 py-2 rounded-xl transition flex items-center space-x-1 shadow-xs">
                <i class="fa-solid fa-receipt"></i>
                <span>我的预定单</span>
            </button>
            <button onclick="openUserModal()" class="bg-amber-600 hover:bg-amber-700 text-white text-xs font-medium px-3 py-2 rounded-xl transition flex items-center space-x-1 shadow-xs">
                <i class="fa-solid fa-user-pen"></i>
                <span id="switchUserBtnText">切换</span>
            </button>
        </div>
    </header>

    <!-- 主体内容区 -->
    <main class="max-w-md mx-auto p-4 space-y-5">
        
        <!-- 星期选择横幅 -->
        <div class="bg-white rounded-2xl p-4 border border-amber-200 shadow-sm space-y-3">
            <div class="flex justify-between items-center">
                <h2 class="font-bold text-sm text-amber-900"><i class="fa-solid fa-calendar-day mr-1 text-amber-600"></i>选择你想预定哪一天的饭菜</h2>
                <span id="selectedDayBadge" class="text-xs bg-amber-600 text-white px-2.5 py-0.5 rounded-full font-bold">周一</span>
            </div>
            <!-- 星期切换标签 -->
            <div class="flex space-x-1.5 overflow-x-auto no-scrollbar pb-1" id="dayTabs">
                <button onclick="selectDay('周一')" id="day-周一" class="day-btn px-3.5 py-1.5 rounded-xl text-xs font-bold bg-amber-600 text-white whitespace-nowrap shadow transition">周一</button>
                <button onclick="selectDay('周二')" id="day-周二" class="day-btn px-3.5 py-1.5 rounded-xl text-xs font-bold bg-white text-gray-600 border whitespace-nowrap transition">周二</button>
                <button onclick="selectDay('周三')" id="day-周三" class="day-btn px-3.5 py-1.5 rounded-xl text-xs font-bold bg-white text-gray-600 border whitespace-nowrap transition">周三</button>
                <button onclick="selectDay('周四')" id="day-周四" class="day-btn px-3.5 py-1.5 rounded-xl text-xs font-bold bg-white text-gray-600 border whitespace-nowrap transition">周四</button>
                <button onclick="selectDay('周五')" id="day-周五" class="day-btn px-3.5 py-1.5 rounded-xl text-xs font-bold bg-white text-gray-600 border whitespace-nowrap transition">周五</button>
                <button onclick="selectDay('周六')" id="day-周六" class="day-btn px-3.5 py-1.5 rounded-xl text-xs font-bold bg-white text-gray-600 border whitespace-nowrap transition">周六</button>
                <button onclick="selectDay('周日')" id="day-周日" class="day-btn px-3.5 py-1.5 rounded-xl text-xs font-bold bg-white text-gray-600 border whitespace-nowrap transition">周日</button>
            </div>
        </div>

        <!-- 菜单分类导航 -->
        <div class="flex space-x-2 overflow-x-auto no-scrollbar pb-1" id="categoryTabs">
            <button onclick="filterCategory('全部')" id="cat-全部" class="cat-btn px-3 py-1.5 rounded-xl text-xs font-bold bg-amber-900 text-white whitespace-nowrap transition shadow-xs">全部菜品</button>
            <button onclick="filterCategory('热菜')" id="cat-热菜" class="cat-btn px-3 py-1.5 rounded-xl text-xs font-bold bg-white text-gray-600 border whitespace-nowrap transition">热菜</button>
            <button onclick="filterCategory('凉菜')" id="cat-凉菜" class="cat-btn px-3 py-1.5 rounded-xl text-xs font-bold bg-white text-gray-600 border whitespace-nowrap transition">凉菜</button>
            <button onclick="filterCategory('主食/汤品')" id="cat-主食/汤品" class="cat-btn px-3 py-1.5 rounded-xl text-xs font-bold bg-white text-gray-600 border whitespace-nowrap transition">主食/汤品</button>
            <button onclick="filterCategory('饮品/甜点')" id="cat-饮品/甜点" class="cat-btn px-3 py-1.5 rounded-xl text-xs font-bold bg-white text-gray-600 border whitespace-nowrap transition">饮品/甜点</button>
        </div>

        <!-- 菜品列表容器 -->
        <div id="dishListContainer" class="grid grid-cols-1 gap-3.5">
            <div class="text-center py-12 text-gray-400 text-sm bg-white rounded-2xl border">正在加载云端菜单库...</div>
        </div>
    </main>

    <!-- 底部已选购物车悬浮栏 -->
    <div id="cartBar" class="fixed bottom-0 left-0 right-0 bg-white/95 backdrop-blur border-t p-4 z-30 max-w-md mx-auto hidden shadow-2xl rounded-t-3xl">
        <div class="max-w-md mx-auto space-y-3">
            <div class="flex justify-between items-center border-b pb-2">
                <div>
                    <span class="font-bold text-sm text-amber-900">已选 <span id="cartCount" class="text-amber-600">0</span> 样菜品</span>
                    <span class="text-xs text-gray-400 ml-2">(. <span id="cartDayLabel">周一</span>)</span>
                </div>
                <span class="font-extrabold text-amber-800 text-base">预估: ¥<span id="cartTotalPrice">0</span></span>
            </div>
            <div id="cartItemsPreview" class="max-h-32 overflow-y-auto space-y-1.5 text-xs text-gray-600"></div>
            <button onclick="submitOrder()" class="w-full bg-amber-600 hover:bg-amber-700 text-white font-bold py-3 rounded-xl shadow-lg transition text-sm flex items-center justify-center space-x-1">
                <i class="fa-solid fa-paper-plane"></i>
                <span>确认提交给采购员</span>
            </button>
        </div>
    </div>

    <!-- 🌟 新增页面/弹窗：查看和修改我的预定单 -->
    <div id="myOrdersModal" class="fixed inset-0 bg-black/50 z-50 flex items-center justify-center hidden p-4">
        <div class="bg-white w-full max-w-md rounded-2xl p-5 shadow-2xl space-y-4 max-h-[85vh] overflow-y-auto">
            <div class="flex justify-between items-center pb-2 border-b">
                <h3 class="font-bold text-base text-amber-900"><i class="fa-solid fa-receipt mr-1.5"></i>我的全部预定单记录</h3>
                <button onclick="closeMyOrdersModal()" class="text-gray-400 hover:text-gray-600"><i class="fa-solid fa-xmark text-lg"></i></button>
            </div>
            <p class="text-xs text-gray-400">在这里你可以查看自己点过的所有饭菜，并可随时删除或取消不需要的订单：</p>
            <div id="myOrdersListContainer" class="space-y-3 pt-1">
                <!-- 动态生成我的订单列表 -->
            </div>
            <button onclick="closeMyOrdersModal()" class="w-full bg-gray-100 hover:bg-gray-200 text-gray-700 py-2.5 rounded-xl font-medium text-xs transition">关闭</button>
        </div>
    </div>

    <!-- 第一次进入或切换用户的弹窗 -->
    <div id="userModal" class="fixed inset-0 bg-black/60 z-50 flex items-center justify-center p-4">
        <div class="bg-white w-full max-w-sm rounded-2xl p-6 shadow-2xl space-y-4 text-center">
            <div class="text-4xl">👋</div>
            <h3 class="font-bold text-lg text-amber-900">欢迎点菜！请先告诉我们你是谁</h3>
            <p class="text-xs text-gray-500">方便后台统计是谁点的菜，买菜时好核对~</p>
            <input type="text" id="userNameInput" placeholder="例如：爸爸 / 妈妈 / 儿子 / 小美" class="w-full bg-gray-50 border border-gray-200 rounded-xl px-4 py-3 text-center text-sm outline-none focus:border-amber-500 font-semibold">
            <button onclick="saveUser()" class="w-full bg-amber-600 hover:bg-amber-700 text-white font-bold py-3 rounded-xl shadow-md transition text-sm">开始点菜</button>
        </div>
    </div>

    <script>
        const API_URL = 'https://api.npoint.io/692e9e8f65204c754fc5';

        let cloudData = { dishes: [], orders: [] };
        let currentUser = '';
        let selectedDay = '周一';
        let selectedCategory = '全部';
        let cart = {}; // { dishId: count }

        async function fetchAllData() {
            try {
                let res = await fetch(API_URL + '?t=' + Date.now());
                let json = await res.json();
                if (json) {
                    cloudData = json;
                    if (!cloudData.dishes) cloudData.dishes = [];
                    if (!cloudData.orders) cloudData.orders = [];
                }
            } catch (e) {
                console.log('同步云端数据失败', e);
            }
            renderDishes();
            if(!document.getElementById('myOrdersModal').classList.contains('hidden')) {
                renderMyOrdersList();
            }
        }

        async function saveAllData() {
            try {
                await fetch(API_URL, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(cloudData)
                });
            } catch (e) {
                alert('云端同步失败，请检查网络！');
            }
        }

        window.onload = function() {
            let savedUser = localStorage.getItem('family_order_user');
            if (savedUser) {
                currentUser = savedUser;
                document.getElementById('currentLoginUserDisplay').innerText = `当前点菜人: ${currentUser}`;
                document.getElementById('switchUserBtnText').innerText = currentUser;
                document.getElementById('userModal').classList.add('hidden');
            }
            fetchAllData();
            setInterval(fetchAllData, 8000); // 8秒轮询同步
        }

        function openUserModal() {
            document.getElementById('userNameInput').value = currentUser || '';
            document.getElementById('userModal').classList.remove('hidden');
        }

        function saveUser() {
            let name = document.getElementById('userNameInput').value.trim();
            if (!name) {
                alert('请输入名字或称呼！');
                return;
            }
            currentUser = name;
            localStorage.setItem('family_order_user', currentUser);
            document.getElementById('currentLoginUserDisplay').innerText = `当前点菜人: ${currentUser}`;
            document.getElementById('switchUserBtnText').innerText = currentUser;
            document.getElementById('userModal').classList.add('hidden');
        }

        function selectDay(day) {
            selectedDay = day;
            document.getElementById('selectedDayBadge').innerText = day;
            document.querySelectorAll('.day-btn').forEach(btn => {
                if (btn.id === `day-${day}`) {
                    btn.className = "day-btn px-3.5 py-1.5 rounded-xl text-xs font-bold bg-amber-600 text-white whitespace-nowrap shadow transition";
                } else {
                    btn.className = "day-btn px-3.5 py-1.5 rounded-xl text-xs font-bold bg-white text-gray-600 border whitespace-nowrap transition";
                }
            });
            renderDishes();
        }

        function filterCategory(cat) {
            selectedCategory = cat;
            document.querySelectorAll('.cat-btn').forEach(btn => {
                if (btn.id === `cat-${cat}`) {
                    btn.className = "cat-btn px-3 py-1.5 rounded-xl text-xs font-bold bg-amber-900 text-white whitespace-nowrap transition shadow-xs";
                } else {
                    btn.className = "cat-btn px-3 py-1.5 rounded-xl text-xs font-bold bg-white text-gray-600 border whitespace-nowrap transition";
                }
            });
            renderDishes();
        }

        function renderDishes() {
            const container = document.getElementById('dishListContainer');
            let dishes = cloudData.dishes || [];

            if (selectedCategory !== '全部') {
                dishes = dishes.filter(d => (d.category || '热菜') === selectedCategory);
            }

            if (dishes.length === 0) {
                container.innerHTML = `<div class="text-center py-16 text-gray-400 text-sm bg-white rounded-2xl border">该分类暂无菜品，快去后台添加吧~</div>`;
                return;
            }

            container.innerHTML = dishes.map(dish => {
                let count = cart[dish.id] || 0;
                return `
                    <div class="bg-white rounded-2xl border border-gray-100 p-3.5 flex items-center justify-between shadow-xs">
                        <div class="flex items-center space-x-3.5 flex-1">
                            <img src="${dish.image}" class="w-16 h-16 object-cover rounded-xl shadow-xs">
                            <div class="space-y-1 flex-1">
                                <div class="flex items-center space-x-1.5">
                                    <h3 class="font-bold text-sm text-gray-800">${dish.name}</h3>
                                    <span class="text-[10px] bg-amber-50 text-amber-700 px-1.5 py-0.5 rounded font-medium">${dish.category || '热菜'}</span>
                                </div>
                                <p class="text-[11px] text-gray-400 line-clamp-1">${dish.desc || '暂无简介'}</p>
                                <p class="text-xs font-bold text-amber-600">¥${dish.price}</p>
                            </div>
                        </div>
                        <div class="flex items-center space-x-2">
                            ${count > 0 ? `
                                <button onclick="changeCart(${dish.id}, -1)" class="w-8 h-8 rounded-full bg-gray-100 text-gray-600 flex items-center justify-center font-bold text-sm hover:bg-gray-200 transition"><i class="fa-solid fa-minus text-xs"></i></button>
                                <span class="font-bold text-sm w-5 text-center">${count}</span>
                            ` : ''}
                            <button onclick="changeCart(${dish.id}, 1)" class="w-8 h-8 rounded-full bg-amber-600 text-white flex items-center justify-center font-bold text-sm shadow-md hover:bg-amber-700 transition"><i class="fa-solid fa-plus text-xs"></i></button>
                        </div>
                    </div>
                `;
            }).join('');

            updateCartBar();
        }

        function changeCart(dishId, delta) {
            if (!cart[dishId]) cart[dishId] = 0;
            cart[dishId] += delta;
            if (cart[dishId] <= 0) delete cart[dishId];
            renderDishes();
        }

        function updateCartBar() {
            const bar = document.getElementById('cartBar');
            let totalCount = 0;
            let totalPrice = 0;
            let previewHtml = '';

            let dishMap = {};
            (cloudData.dishes || []).forEach(d => { dishMap[d.id] = d; });

            for (let id in cart) {
                let count = cart[id];
                let dish = dishMap[id];
                if (dish) {
                    totalCount += count;
                    totalPrice += dish.price * count;
                    previewHtml += `<div class="flex justify-between"><span>${dish.name} x${count}</span><span class="font-bold">¥${dish.price * count}</span></div>`;
                }
            }

            if (totalCount > 0) {
                bar.classList.remove('hidden');
                document.getElementById('cartCount').innerText = totalCount;
                document.getElementById('cartTotalPrice').innerText = totalPrice;
                document.getElementById('cartDayLabel').innerText = selectedDay;
                document.getElementById('cartItemsPreview').innerHTML = previewHtml;
            } else {
                bar.classList.add('hidden');
            }
        }

        async function submitOrder() {
            if (!currentUser) {
                openUserModal();
                return;
            }
            let dishMap = {};
            (cloudData.dishes || []).forEach(d => { dishMap[d.id] = d; });

            let items = [];
            let totalPrice = 0;
            for (let id in cart) {
                let dish = dishMap[id];
                if (dish) {
                    items.push({ id: dish.id, name: dish.name, price: dish.price, count: cart[id] });
                    totalPrice += dish.price * cart[id];
                }
            }

            if (items.length === 0) return;

            const newOrder = {
                id: Date.now(),
                user: currentUser,
                targetDay: selectedDay,
                items: items,
                totalPrice: totalPrice,
                status: '待采购',
                time: new Date().toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' })
            };

            await fetchAllData();
            if (!cloudData.orders) cloudData.orders = [];
            cloudData.orders.push(newOrder);

            await saveAllData();
            cart = {};
            updateCartBar();
            renderDishes();
            alert(`成功为【${selectedDay}】提交订单！`);
        }

        // 🌟 我的预定单管理功能
        function openMyOrdersModal() {
            if (!currentUser) {
                openUserModal();
                return;
            }
            document.getElementById('myOrdersModal').classList.remove('hidden');
            renderMyOrdersList();
        }

        function closeMyOrdersModal() {
            document.getElementById('myOrdersModal').classList.add('hidden');
        }

        function renderMyOrdersList() {
            const container = document.getElementById('myOrdersListContainer');
            const myOrders = (cloudData.orders || []).filter(o => o.user === currentUser);

            if (myOrders.length === 0) {
                container.innerHTML = `<div class="text-center py-10 text-gray-400 text-xs">你还没有提交过任何预定单~</div>`;
                return;
            }

            container.innerHTML = myOrders.map(order => `
                <div class="bg-amber-50/50 border border-amber-200 p-3.5 rounded-2xl space-y-2">
                    <div class="flex justify-between items-center border-b border-amber-100 pb-1.5">
                        <span class="font-bold text-xs text-amber-900"><i class="fa-solid fa-calendar-day mr-1"></i>${order.targetDay || '周一'}预定</span>
                        <div class="space-x-1">
                            <span class="text-[10px] px-2 py-0.5 rounded-full font-medium ${order.status === '已采购' ? 'bg-green-100 text-green-700' : 'bg-amber-200 text-amber-800'}">${order.status}</span>
                            <button onclick="deleteMyOrder(${order.id})" class="text-gray-400 hover:text-red-500 text-xs px-1"><i class="fa-solid fa-trash"></i></button>
                        </div>
                    </div>
                    <div class="space-y-1 text-xs text-gray-700">
                        ${order.items.map(i => `
                            <div class="flex justify-between">
                                <span>${i.name} x${i.count}</span>
                                <span class="font-bold">¥${i.price * i.count}</span>
                            </div>
                        `).join('')}
                    </div>
                    <div class="flex justify-between items-center pt-1 border-t border-amber-100 text-[11px]">
                        <span class="text-gray-400">时间: ${order.time}</span>
                        <span class="font-bold text-amber-900">总计: ¥${order.totalPrice}</span>
                    </div>
                </div>
            `).join('');
        }

        async function deleteMyOrder(orderId) {
            if (!confirm('确定要取消并删除这个预定单吗？')) return;
            await fetchAllData();
            cloudData.orders = (cloudData.orders || []).filter(o => o.id !== orderId);
            await saveAllData();
            renderMyOrdersList();
            renderDishes();
        }
    </script>
</body>
</html>
