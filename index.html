<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>温馨家庭点餐系统</title>
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
</head>
<body class="bg-amber-50/50 text-gray-800 pb-28">

    <!-- 顶部导航 -->
    <header class="bg-white shadow-xs sticky top-0 z-40 px-4 py-3 flex justify-between items-center">
        <div class="flex items-center space-x-2">
            <span class="text-2xl">🍲</span>
            <h1 class="font-bold text-lg text-amber-900">温馨家庭点餐</h1>
        </div>
        <!-- 身份选择 -->
        <div class="flex items-center bg-amber-100/60 px-3 py-1.5 rounded-full text-sm">
            <i class="fa-solid fa-user text-amber-700 mr-1.5"></i>
            <select id="userSelect" class="bg-transparent font-medium text-amber-900 outline-none">
                <option value="爸爸">爸爸</option>
                <option value="妈妈">妈妈</option>
                <option value="大宝">大宝</option>
                <option value="二宝">二宝</option>
                <option value="爷爷">爷爷</option>
                <option value="奶奶">奶奶</option>
            </select>
        </div>
    </header>

    <!-- 菜品展示网格 -->
    <main class="max-w-md mx-auto p-4">
        <div id="dishGrid" class="grid grid-cols-1 gap-4">
            <!-- 动态加载菜品 -->
        </div>
    </main>

    <!-- 底部悬浮购物车栏 -->
    <div id="cartBar" class="fixed bottom-0 left-0 right-0 bg-white border-t border-gray-100 shadow-lg p-4 max-w-md mx-auto flex items-center justify-between z-50 hidden">
        <div class="flex items-center space-x-3 cursor-pointer" onclick="toggleCartModal()">
            <div class="relative bg-amber-600 text-white w-12 h-12 rounded-full flex items-center justify-center shadow-md">
                <i class="fa-solid fa-cart-shopping text-lg"></i>
                <span id="cartBadge" class="absolute -top-1 -right-1 bg-red-500 text-white text-xs w-5 h-5 rounded-full flex items-center justify-center font-bold">0</span>
            </div>
            <div>
                <p id="cartTotalPrice" class="text-lg font-bold text-amber-900">¥0</p>
                <p class="text-xs text-gray-500">点击查看已选菜品</p>
            </div>
        </div>
        <button onclick="submitOrder()" class="bg-amber-600 hover:bg-amber-700 text-white font-medium px-6 py-2.5 rounded-full shadow-md transition">
            提交给大厨
        </button>
    </div>

    <!-- 购物车明细弹窗 -->
    <div id="cartModal" class="fixed inset-0 bg-black/50 z-50 flex items-end justify-center hidden">
        <div class="bg-white w-full max-w-md rounded-t-2xl p-5 max-h-[70vh] flex flex-col">
            <div class="flex justify-between items-center pb-3 border-b">
                <h3 class="font-bold text-lg text-amber-900">已选菜品清单</h3>
                <button onclick="toggleCartModal()" class="text-gray-400 hover:text-gray-600"><i class="fa-solid fa-xmark text-lg"></i></button>
            </div>
            <div id="cartItemsList" class="overflow-y-auto py-4 space-y-3 flex-1">
                <!-- 动态生成购物车内项目 -->
            </div>
            <div class="pt-3 border-t flex justify-between items-center font-bold">
                <span>合计：</span>
                <span id="cartModalTotal" class="text-xl text-amber-600">¥0</span>
            </div>
        </div>
    </div>

    <script>
        // 默认内置菜品（如果本地没有）
        let dishes = JSON.parse(localStorage.getItem('family_dishes')) || [
            { id: 1, name: '招牌红烧肉', price: 68, category: '热菜', image: 'https://images.unsplash.com/photo-1544025162-d76694265947?w=300', desc: '肥而不腻，软糯香甜' },
            { id: 2, name: '清蒸鲜鲈鱼', price: 58, category: '热菜', image: 'https://images.unsplash.com/photo-1519708227418-c8fd9a32b7a2?w=300', desc: '肉质鲜嫩，原汁原味' },
            { id: 3, name: '番茄炒鸡蛋', price: 22, category: '热菜', image: 'https://images.unsplash.com/photo-1546069901-ba9599a7e63c?w=300', desc: '经典家常，酸甜开胃' }
        ];

        let cart = [];

        function renderDishes() {
            const grid = document.getElementById('dishGrid');
            grid.innerHTML = dishes.map(dish => `
                <div class="bg-white rounded-xl shadow-xs overflow-hidden flex border border-gray-100">
                    <img src="${dish.image}" alt="${dish.name}" class="w-28 h-28 object-cover">
                    <div class="p-3 flex-1 flex flex-col justify-between">
                        <div>
                            <h3 class="font-bold text-base text-gray-800">${dish.name}</h3>
                            <p class="text-xs text-gray-500 line-clamp-1 mt-0.5">${dish.desc || ''}</p>
                        </div>
                        <div class="flex justify-between items-center mt-2">
                            <span class="text-amber-600 font-bold">¥${dish.price}</span>
                            <div class="flex items-center space-x-2">
                                <button onclick="updateCart(${dish.id}, -1)" class="w-7 h-7 rounded-full bg-gray-100 text-gray-600 flex items-center justify-center">-</button>
                                <span class="text-sm font-semibold w-5 text-center">${getCartCount(dish.id)}</span>
                                <button onclick="updateCart(${dish.id}, 1)" class="w-7 h-7 rounded-full bg-amber-600 text-white flex items-center justify-center">+</button>
                            </div>
                        </div>
                    </div>
                </div>
            `).join('');
        }

        function getCartCount(id) {
            const item = cart.find(i => i.id === id);
            return item ? item.count : 0;
        }

        function updateCart(id, delta) {
            const dish = dishes.find(d => d.id === id);
            let item = cart.find(i => i.id === id);
            if (item) {
                item.count += delta;
                if (item.count <= 0) {
                    cart = cart.filter(i => i.id !== id);
                }
            } else if (delta > 0) {
                cart.push({ ...dish, count: 1 });
            }
            renderDishes();
            updateCartBar();
        }

        function updateCartBar() {
            const cartBar = document.getElementById('cartBar');
            const badge = document.getElementById('cartBadge');
            const totalPriceEl = document.getElementById('cartTotalPrice');
            
            const totalCount = cart.reduce((sum, i) => sum + i.count, 0);
            const totalPrice = cart.reduce((sum, i) => sum + i.price * i.count, 0);

            if (totalCount > 0) {
                cartBar.classList.remove('hidden');
                badge.innerText = totalCount;
                totalPriceEl.innerText = `¥${totalPrice}`;
            } else {
                cartBar.classList.add('hidden');
            }
            renderCartModalList();
        }

        function renderCartModalList() {
            const list = document.getElementById('cartItemsList');
            const modalTotal = document.getElementById('cartModalTotal');
            const totalPrice = cart.reduce((sum, i) => sum + i.price * i.count, 0);
            modalTotal.innerText = `¥${totalPrice}`;

            list.innerHTML = cart.map(item => `
                <div class="flex justify-between items-center">
                    <div>
                        <h4 class="font-medium text-sm">${item.name}</h4>
                        <span class="text-xs text-gray-400">¥${item.price} / 份</span>
                    </div>
                    <div class="flex items-center space-x-3">
                        <button onclick="updateCart(${item.id}, -1)" class="w-6 h-6 rounded-full bg-gray-100 text-gray-600 flex items-center justify-center text-xs">-</button>
                        <span class="text-sm font-semibold">${item.count}</span>
                        <button onclick="updateCart(${item.id}, 1)" class="w-6 h-6 rounded-full bg-amber-600 text-white flex items-center justify-center text-xs">+</button>
                    </div>
                </div>
            `).join('');
        }

        function toggleCartModal() {
            const modal = document.getElementById('cartModal');
            modal.classList.toggle('hidden');
        }

        function submitOrder() {
            if (cart.length === 0) return;
            const user = document.getElementById('userSelect').value;
            const orders = JSON.parse(localStorage.getItem('family_orders')) || [];
            
            const newOrder = {
                id: Date.now(),
                user: user,
                items: [...cart],
                totalPrice: cart.reduce((sum, i) => sum + i.price * i.count, 0),
                time: new Date().toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' }),
                status: '待制作'
            };

            orders.unshift(newOrder);
            localStorage.setItem('family_orders', JSON.stringify(orders));

            alert(`下单成功！大厨 ${user} 已经收到您的点餐啦~`);
            cart = [];
            toggleCartModal();
            updateCartBar();
            renderDishes();
        }

        renderDishes();
    </script>
</body>
</html>
