<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>家庭全周大采购 - 点菜端</title>
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
    <style>
        .no-scrollbar::-webkit-scrollbar { display: none; }
        .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
    </style>
</head>
<body class="bg-amber-50/40 text-gray-800 pb-36 pt-[160px]">

    <!-- 顶部导航 -->
    <header class="bg-white shadow-xs fixed top-0 left-0 right-0 z-40 px-3 py-1.5 flex justify-between items-center w-full max-w-lg mx-auto" style="padding-top: calc(0.35rem + env(safe-area-inset-top, 0px));">
        <div class="flex items-center space-x-1.5">
            <span class="text-lg">🍲</span>
            <div>
                <h1 class="font-bold text-xs text-amber-900 leading-tight" data-i18n="app_title">家庭全周大采购</h1>
                <p class="text-[9px] text-gray-400" id="currentLoginUserDisplay">点菜人: 请设置</p>
            </div>
        </div>
        <div class="flex items-center space-x-1">
            <button onclick="toggleLang()" class="bg-gray-100 hover:bg-gray-200 text-gray-700 text-[11px] font-bold px-2 py-1 rounded-lg transition" id="langBtn">EN</button>
            <button onclick="openFamilyOrdersModal()" class="bg-amber-50 hover:bg-amber-100 text-amber-900 text-[11px] font-bold px-1.5 py-1 rounded-lg transition flex items-center space-x-0.5 border border-amber-200">
                <i class="fa-solid fa-users text-amber-600"></i>
                <span data-i18n="nav_family_menu">全家菜单</span>
            </button>
            <button onclick="openMyOrdersModal()" class="bg-amber-100 hover:bg-amber-200 text-amber-800 text-[11px] font-bold px-1.5 py-1 rounded-lg transition flex items-center space-x-0.5">
                <i class="fa-solid fa-receipt"></i>
                <span data-i18n="nav_my_orders">我的</span>
            </button>
            <button onclick="openUserModal()" class="bg-amber-600 hover:bg-amber-700 text-white text-[11px] font-medium px-1.5 py-1 rounded-lg transition flex items-center space-x-0.5">
                <i class="fa-solid fa-user-pen"></i>
                <span id="switchUserBtnText">切换</span>
            </button>
        </div>
    </header>

    <!-- 🔍 搜索栏、星期选择、分类导航 -->
    <div class="fixed left-0 right-0 z-30 bg-amber-50/95 backdrop-blur px-3 py-1.5 border-b border-amber-200/40 shadow-xs" style="top: calc(44px + env(safe-area-inset-top, 0px));">
        <div class="w-full max-w-lg mx-auto space-y-1">
            <!-- 搜索栏 -->
            <div class="relative w-full">
                <span class="absolute inset-y-0 left-0 flex items-center pl-3 pointer-events-none text-gray-400">
                    <i class="fa-solid fa-magnifying-glass text-xs"></i>
                </span>
                <input type="text" id="searchInput" oninput="handleSearchInput(this.value)" placeholder="搜索想吃的菜品..." class="w-full bg-white border border-amber-200/80 rounded-2xl pl-9 pr-8 py-1.5 text-xs outline-none focus:border-amber-600 shadow-xs transition placeholder-gray-400 font-medium">
                <button onclick="clearSearch()" id="clearSearchBtn" class="absolute inset-y-0 right-0 pr-3 flex items-center text-gray-400 hover:text-gray-600 hidden text-xs">
                    <i class="fa-solid fa-circle-xmark"></i>
                </button>
            </div>

            <!-- 星期选择横幅 -->
            <div class="bg-white rounded-xl p-2 border border-amber-200/60 shadow-xs space-y-1">
                <div class="flex justify-between items-center">
                    <h2 class="font-bold text-xs text-amber-900"><i class="fa-solid fa-calendar-day mr-1 text-amber-600"></i><span data-i18n="select_day_title">选择预定哪一天的饭菜</span></h2>
                    <span id="selectedDayBadge" class="text-[11px] bg-amber-600 text-white px-2 py-0.2 rounded-full font-bold">周一</span>
                </div>
                <div class="flex space-x-1.5 overflow-x-auto no-scrollbar pb-0.5" id="dayTabs">
                    <button onclick="selectDay('周一')" id="day-周一" class="day-btn px-3 py-1 rounded-xl text-xs font-bold bg-amber-600 text-white whitespace-nowrap shadow transition" data-day="周一" data-i18n-day="monday">周一</button>
                    <button onclick="selectDay('周二')" id="day-周二" class="day-btn px-3 py-1 rounded-xl text-xs font-bold bg-white text-gray-600 border whitespace-nowrap transition" data-day="周二" data-i18n-day="tuesday">周二</button>
                    <button onclick="selectDay('周三')" id="day-周三" class="day-btn px-3 py-1 rounded-xl text-xs font-bold bg-white text-gray-600 border whitespace-nowrap transition" data-day="周三" data-i18n-day="wednesday">周三</button>
                    <button onclick="selectDay('周四')" id="day-周四" class="day-btn px-3 py-1 rounded-xl text-xs font-bold bg-white text-gray-600 border whitespace-nowrap transition" data-day="周四" data-i18n-day="thursday">周四</button>
                    <button onclick="selectDay('周五')" id="day-周五" class="day-btn px-3 py-1 rounded-xl text-xs font-bold bg-white text-gray-600 border whitespace-nowrap transition" data-day="周五" data-i18n-day="friday">周五</button>
                    <button onclick="selectDay('周六')" id="day-周六" class="day-btn px-3 py-1 rounded-xl text-xs font-bold bg-white text-gray-600 border whitespace-nowrap transition" data-day="周六" data-i18n-day="saturday">周六</button>
                    <button onclick="selectDay('周日')" id="day-周日" class="day-btn px-3 py-1 rounded-xl text-xs font-bold bg-white text-gray-600 border whitespace-nowrap transition" data-day="周日" data-i18n-day="sunday">周日</button>
                </div>
            </div>

            <!-- 菜单分类导航 -->
            <div class="flex space-x-1.5 overflow-x-auto no-scrollbar pb-0.5" id="categoryTabs">
                <button onclick="filterCategory('全部')" id="cat-all" class="cat-btn px-3 py-1 rounded-xl text-xs font-bold bg-amber-900 text-white whitespace-nowrap transition shadow-xs" data-i18n="cat_all">全部菜品</button>
                <button onclick="filterCategory('热菜')" id="cat-hot" class="cat-btn px-3 py-1 rounded-xl text-xs font-bold bg-white text-gray-600 border whitespace-nowrap transition" data-i18n="cat_hot">热菜</button>
                <button onclick="filterCategory('凉菜')" id="cat-cold" class="cat-btn px-3 py-1 rounded-xl text-xs font-bold bg-white text-gray-600 border whitespace-nowrap transition" data-i18n="cat_cold">凉菜</button>
                <button onclick="filterCategory('主食/汤品')" id="cat-soup" class="cat-btn px-3 py-1 rounded-xl text-xs font-bold bg-white text-gray-600 border whitespace-nowrap transition" data-i18n="cat_soup">主食/汤品</button>
                <button onclick="filterCategory('饮品/甜点')" id="cat-drink" class="cat-btn px-3 py-1 rounded-xl text-xs font-bold bg-white text-gray-600 border whitespace-nowrap transition" data-i18n="cat_drink">饮品/甜点</button>
                <button onclick="filterCategory('点心/面包')" id="cat-bakery" class="cat-btn px-3 py-1 rounded-xl text-xs font-bold bg-white text-gray-600 border whitespace-nowrap transition" data-i18n="cat_bakery">点心/面包</button>
            </div>
        </div>
    </div>

    <!-- 主体内容区 -->
    <main class="w-full max-w-lg mx-auto p-3 space-y-3">

        <!-- 🌟 新增功能模块：今日大厨备菜与切洗台（与手机日期自动匹配） -->
        <div class="bg-gradient-to-br from-amber-500 to-amber-700 text-white rounded-2xl p-3.5 shadow-md space-y-2.5">
            <div class="flex justify-between items-center border-b border-amber-400/40 pb-2">
                <div class="flex items-center space-x-1.5">
                    <span class="text-base">👨‍🍳</span>
                    <div>
                        <h3 class="font-bold text-xs" id="chefWidgetTitle">今日大厨备菜台 (匹配手机日期)</h3>
                        <p class="text-[10px] text-amber-100" id="chefWidgetDateSubtitle">正在加载当天日期...</p>
                    </div>
                </div>
                <span id="todayMatchBadge" class="bg-white/20 text-white text-[10px] px-2 py-0.5 rounded-full font-bold backdrop-blur">自动匹配中</span>
            </div>

            <!-- 当天菜单展示 -->
            <div class="space-y-1">
                <p class="text-[11px] font-bold text-amber-100 flex items-center justify-between">
                    <span><i class="fa-solid fa-utensils mr-1"></i>今日已点菜单：</span>
                    <span id="todayOrdersCountText" class="text-[10px] bg-amber-800/50 px-1.5 py-0.2 rounded">0 份菜品</span>
                </p>
                <div id="chefTodayMenuList" class="bg-amber-800/30 rounded-xl p-2 text-xs space-y-1 max-h-28 overflow-y-auto no-scrollbar">
                    <div class="text-amber-200 text-center py-2 text-[11px]">今天还没有人点菜哦~</div>
                </div>
            </div>

            <!-- 需要准备切洗的食材 -->
            <div class="space-y-1 pt-1 border-t border-amber-400/40">
                <p class="text-[11px] font-bold text-amber-100 flex items-center">
                    <i class="fa-solid fa-kitchen-set mr-1"></i>下班直接烧！需提前切洗准备的食材清单：
                </p>
                <div id="chefPrePrepList" class="bg-white/10 rounded-xl p-2 text-xs space-y-1 max-h-32 overflow-y-auto">
                    <div class="text-amber-200 text-center py-2 text-[11px]">暂无切洗食材需求</div>
                </div>
            </div>
        </div>

        <!-- 菜品列表 -->
        <div id="dishListContainer" class="grid grid-cols-1 gap-2">
            <div class="text-center py-12 text-gray-400 text-xs bg-white rounded-2xl border" data-i18n="loading_dishes">正在加载云端菜单库...</div>
        </div>
    </main>

    <!-- 底部已选购物车悬浮栏 -->
    <div id="cartBar" class="fixed bottom-0 left-0 right-0 bg-white/95 backdrop-blur border-t p-3.5 z-30 w-full hidden shadow-2xl rounded-t-2xl">
        <div class="w-full max-w-lg mx-auto space-y-2.5">
            <div class="flex justify-between items-center border-b pb-2">
                <div>
                    <span class="font-bold text-xs text-amber-900"><span data-i18n="cart_selected">已选</span> <span id="cartCount" class="text-amber-600">0</span> <span data-i18n="cart_dishes">样菜品</span></span>
                    <span class="text-[11px] text-gray-400 ml-1.5">(<span id="cartDayLabel">周一</span>)</span>
                </div>
            </div>
            <div id="cartItemsPreview" class="max-h-28 overflow-y-auto space-y-1.5 text-xs text-gray-600"></div>
            <button onclick="submitOrder()" class="w-full bg-amber-600 hover:bg-amber-700 text-white font-bold py-2.5 rounded-xl shadow-md transition text-xs flex items-center justify-center space-x-1">
                <i class="fa-solid fa-paper-plane"></i>
                <span data-i18n="btn_submit_order">确认提交给采购员</span>
            </button>
        </div>
    </div>

    <!-- 🍳 配菜选择弹窗 -->
    <div id="optionsModal" class="fixed inset-0 bg-black/60 z-[70] flex items-center justify-center hidden p-3">
        <div class="bg-white w-full max-w-sm rounded-2xl p-4 shadow-2xl space-y-3">
            <div class="flex justify-between items-center border-b pb-2">
                <h3 class="font-bold text-sm text-amber-900" id="optionsDishName" data-i18n="modal_options_title">选择配菜与口味偏好</h3>
                <button onclick="closeOptionsModal()" class="text-gray-400 hover:text-gray-600 text-xs"><i class="fa-solid fa-xmark text-base"></i></button>
            </div>
            <div id="optionsListContainer" class="space-y-2 max-h-60 overflow-y-auto text-xs py-1"></div>
            <div class="flex space-x-2 pt-2">
                <button onclick="closeOptionsModal()" class="flex-1 bg-gray-100 hover:bg-gray-200 text-gray-700 py-2 rounded-xl text-xs font-bold" data-i18n="btn_cancel">取消</button>
                <button id="optionsConfirmBtn" onclick="confirmAddWithOptions()" class="flex-1 bg-amber-600 hover:bg-amber-700 text-white py-2 rounded-xl text-xs font-bold" data-i18n="btn_confirm">确认加入购物车</button>
            </div>
        </div>
    </div>

    <!-- 查看全家人点菜面板 -->
    <div id="familyOrdersModal" class="fixed inset-0 bg-black/50 z-50 flex items-center justify-center hidden p-3">
        <div class="bg-white w-full max-w-md rounded-2xl p-4 shadow-2xl space-y-3 max-h-[85vh] overflow-y-auto">
            <div class="flex justify-between items-center pb-2 border-b">
                <h3 class="font-bold text-sm text-amber-900"><i class="fa-solid fa-users mr-1.5 text-amber-600"></i><span data-i18n="family_modal_title">全家人本周点菜一览</span></h3>
                <button onclick="closeFamilyOrdersModal()" class="text-gray-400 hover:text-gray-600"><i class="fa-solid fa-xmark text-base"></i></button>
            </div>
            <div id="familyOrdersListContainer" class="space-y-3 pt-1"></div>
            <button onclick="closeFamilyOrdersModal()" class="w-full bg-gray-100 hover:bg-gray-200 text-gray-700 py-2 rounded-xl font-medium text-xs transition" data-i18n="btn_close">关闭</button>
        </div>
    </div>

    <!-- 我的预定单弹窗 -->
    <div id="myOrdersModal" class="fixed inset-0 bg-black/50 z-50 flex items-center justify-center hidden p-3">
        <div class="bg-white w-full max-w-md rounded-2xl p-4 shadow-2xl space-y-3 max-h-[85vh] overflow-y-auto">
            <div class="flex justify-between items-center pb-2 border-b">
                <h3 class="font-bold text-sm text-amber-900"><i class="fa-solid fa-receipt mr-1.5"></i><span data-i18n="my_modal_title">我的全部预定单记录</span></h3>
                <button onclick="closeMyOrdersModal()" class="text-gray-400 hover:text-gray-600"><i class="fa-solid fa-xmark text-base"></i></button>
            </div>
            <div id="myOrdersListContainer" class="space-y-2.5 pt-1"></div>
            <button onclick="closeMyOrdersModal()" class="w-full bg-gray-100 hover:bg-gray-200 text-gray-700 py-2 rounded-xl font-medium text-xs transition" data-i18n="btn_close">关闭</button>
        </div>
    </div>

    <!-- 用户设置弹窗 -->
    <div id="userModal" class="fixed inset-0 bg-black/60 z-50 flex items-center justify-center p-3 hidden">
        <div class="bg-white w-full max-w-xs rounded-2xl p-5 shadow-2xl space-y-3.5 text-center">
            <div class="text-3xl">👋</div>
            <h3 class="font-bold text-base text-amber-900" data-i18n="user_modal_title">欢迎点菜！请先告诉我们你是谁</h3>
            <input type="text" id="userNameInput" placeholder="爸爸 / 妈妈 / Dad / Mom" class="w-full bg-gray-50 border border-gray-200 rounded-xl px-3 py-2.5 text-center text-xs outline-none focus:border-amber-500 font-semibold">
            <button onclick="saveUser()" class="w-full bg-amber-600 hover:bg-amber-700 text-white font-bold py-2.5 rounded-xl shadow-md transition text-xs" data-i18n="btn_start_ordering">开始点菜</button>
        </div>
    </div>

    <!-- 🖼️ 图片放大预览弹窗 -->
    <div id="imageModal" class="fixed inset-0 bg-black/80 z-50 flex items-center justify-center hidden p-4" onclick="closeImageModal()">
        <div class="relative max-w-lg w-full flex flex-col items-center" onclick="event.stopPropagation()">
            <button onclick="closeImageModal()" class="absolute -top-10 right-0 text-white text-2xl hover:text-gray-300 transition"><i class="fa-solid fa-xmark"></i></button>
            <img id="enlargedImg" src="" class="max-h-[75vh] max-w-full rounded-2xl shadow-2xl object-contain bg-black/20">
            <p id="enlargedTitle" class="text-white text-sm mt-3 font-bold tracking-wide"></p>
        </div>
    </div>

    <script>
        const API_URL = 'https://api.npoint.io/692e9e8f65204c754fc5';
        let cloudData = { dishes: [], orders: [] };
        let currentUser = '';
        let selectedDay = '周一';
        let selectedCategory = '全部';
        let searchKeyword = '';
        let cart = {};
        let activeDishForOptions = null;
        let activeEditingOrderContext = null;
        let activeEditingCartKey = null;

        let currentLang = localStorage.getItem('family_order_lang') || 'zh';

        let translationCache = JSON.parse(localStorage.getItem('family_order_trans_cache') || '{}');

        const professionalDishDict = {
            "大排面": "Noodles with Fried Spare Ribs",
            "上海大排面": "Shanghai Pork Chop Noodles",
            "炸酱面": "Zhajiangmian (Noodles with Soy Bean Paste)",
            "老北京炸酱面": "Old Beijing Zhajiangmian",
            "小笼包": "Steamed Pork Soup Dumplings",
            "红烧肉": "Braised Pork Belly in Soy Sauce",
            "宫保鸡丁": "Kung Pao Chicken",
            "麻婆豆腐": "Mapo Tofu",
            "担担面": "Dan Dan Noodles",
            "锅包肉": "Sweet and Sour Crispy Pork",
            "水饺": "Boiled Dumplings",
            "葱油拌面": "Scallion Oil Noodles",
            "牛肉面": "Beef Noodle Soup",
            "酸辣汤": "Hot and Sour Soup",
            "蛋炒饭": "Egg Fried Rice",
            "微辣": "Mild Spicy",
            "中辣": "Medium Spicy",
            "特辣": "Extra Spicy",
            "不加葱": "No Scallions",
            "不加蒜": "No Garlic",
            "不要香菜": "No Coriander",
            "少油": "Less Oil",
            "少盐": "Less Salt",
            "加辣": "Extra Spicy",
            "加面": "Extra Noodles"
        };

        function capitalizeWords(str) {
            if (!str) return '';
            return str.replace(/\b\w/g, l => l.toUpperCase());
        }

        async function onlineTranslate(text) {
            if (!text || currentLang === 'zh') return text;
            if (professionalDishDict[text]) {
                return professionalDishDict[text];
            }
            if (translationCache[text]) return capitalizeWords(translationCache[text]);

            try {
                let url = `https://translate.googleapis.com/translate_a/single?client=gtx&sl=zh&tl=en&dt=t&q=${encodeURIComponent(text)}`;
                let res = await fetch(url);
                let json = await res.json();
                if (json && json[0] && json[0][0] && json[0][0][0]) {
                    let translated = json[0].map(item => item[0]).join('');
                    let capitalized = capitalizeWords(translated);
                    translationCache[text] = capitalized;
                    localStorage.setItem('family_order_trans_cache', JSON.stringify(translationCache));
                    return capitalized;
                }
            } catch (e) {
                console.log('Translation fallback:', e);
            }
            return capitalizeWords(text);
        }

        async function translateDishName(name) {
            if (currentLang !== 'en' || !name) return name;
            return await onlineTranslate(name);
        }

        async function translateOptionName(opt) {
            if (currentLang !== 'en' || !opt) return opt;
            return await onlineTranslate(opt);
        }

        const categoryTranslationMap = {
            "热菜": "Hot Dish", "凉菜": "Cold Dish", "主食/汤品": "Staple / Soup",
            "饮品/甜点": "Drink / Dessert", "点心/面包": "Bakery / Bread"
        };

        function translateCategory(cat) {
            if (currentLang === 'en') {
                return categoryTranslationMap[cat] || capitalizeWords(cat);
            }
            return cat;
        }

        const i18nText = {
            zh: {
                app_title: "家庭全周大采购",
                nav_family_menu: "全家菜单",
                nav_my_orders: "我的",
                select_day_title: "选择预定哪一天的饭菜",
                cat_all: "全部菜品", cat_hot: "热菜", cat_cold: "凉菜", cat_soup: "主食/汤品", cat_drink: "饮品/甜点", cat_bakery: "点心/面包",
                loading_dishes: "正在加载云端菜单库...",
                cart_selected: "已选", cart_dishes: "样菜品",
                btn_submit_order: "确认提交给采购员",
                family_modal_title: "全家人本周点菜一览",
                my_modal_title: "我的全部预定单记录",
                btn_close: "关闭",
                user_modal_title: "欢迎点菜！请先告诉我们你是谁",
                btn_start_ordering: "开始点菜",
                modal_options_title: "选择配菜与口味偏好",
                btn_cancel: "取消", btn_confirm: "确认加入购物车",
                btn_order: "点单 ➕", btn_select_side: "选配菜 ➕",
                monday: "周一", tuesday: "周二", wednesday: "周三", thursday: "周四", friday: "周五", saturday: "周六", sunday: "周日",
                status_pending: "待采购", status_purchased: "已采购", status_completed: "已完成"
            },
            en: {
                app_title: "Weekly Family Grocery",
                nav_family_menu: "Family Menu",
                nav_my_orders: "My Orders",
                select_day_title: "Select day for meal booking",
                cat_all: "All Dishes", cat_hot: "Hot Dishes", cat_cold: "Cold Dishes", cat_soup: "Staples/Soup", cat_drink: "Drinks/Dessert", cat_bakery: "Bakery/Bread",
                loading_dishes: "Loading cloud menu...",
                cart_selected: "Selected", cart_dishes: "items",
                btn_submit_order: "Submit to Buyer",
                family_modal_title: "Family Weekly Orders Overview",
                my_modal_title: "My Booking History",
                btn_close: "Close",
                user_modal_title: "Welcome! Please tell us who you are",
                btn_start_ordering: "Start Ordering",
                modal_options_title: "Select Sides & Preferences",
                btn_cancel: "Cancel", btn_confirm: "Confirm & Add",
                btn_order: "Order ➕", btn_select_side: "Sides ➕",
                monday: "Monday", tuesday: "Tuesday", wednesday: "Wednesday", thursday: "Thursday", friday: "Friday", saturday: "Saturday", sunday: "Sunday",
                status_pending: "Pending", status_purchased: "Purchased", status_completed: "Completed"
            }
        };

        function t(key) {
            return (i18nText[currentLang] && i18nText[currentLang][key]) || i18nText['zh'][key] || key;
        }

        async function toggleLang() {
            currentLang = currentLang === 'zh' ? 'en' : 'zh';
            localStorage.setItem('family_order_lang', currentLang);
            updateUIStrings();
            await renderDishes();
            await updateCartBar();
            renderChefTodayWidget();

        // 🌟 核心新增：渲染今日大厨备菜与切洗食材清单
        async function renderChefTodayWidget() {
            const menuContainer = document.getElementById('chefTodayMenuList');
            const prepContainer = document.getElementById('chefPrePrepList');
            const countText = document.getElementById('todayOrdersCountText');

            // 根据当前手机匹配并选中的星期筛选订单
            const orders = (cloudData.orders || []).filter(o => o.targetDay === selectedDay);
            const dishesMap = {};
            (cloudData.dishes || []).forEach(d => { dishesMap[d.id] = d; });

            if (orders.length === 0) {
                countText.innerText = `0 份菜品`;
                menuContainer.innerHTML = `<div class="text-amber-200 text-center py-2 text-[11px]">${selectedDay} 还没有人点单哦~</div>`;
                prepContainer.innerHTML = `<div class="text-amber-200 text-center py-2 text-[11px]">暂无切洗食材需求</div>`;
                return;
            }

            // 统计菜品及总份数
            let dishSummary = {};
            let totalDishesCount = 0;
            let ingredientSummary = {}; // 用于汇总需要切洗的食材

            orders.forEach(order => {
                if (!order.items) return;
                order.items.forEach(item => {
                    let times = item.count || 1;
                    totalDishesCount += times;

                    // 汇总菜品名称
                    if (!dishSummary[item.name]) {
                        dishSummary[item.name] = { count: 0, users: new Set() };
                    }
                    dishSummary[item.name].count += times;
                    if (order.user) dishSummary[item.name].users.add(order.user);

                    // 提取并解析该菜品对应的原材料与配菜，以便列出切洗清单
                    let dish = dishesMap[item.id];
                    if (dish) {
                        // 解析主料
                        if (dish.ingredients) {
                            parseAndAddIngredients(dish.ingredients, times, ingredientSummary);
                        }
                        // 解析配菜选项中的原料
                        if (item.selectedOptions && item.selectedOptions.length > 0 && dish.options) {
                            item.selectedOptions.forEach(optName => {
                                let foundOpt = dish.options.find(o => o.name === optName);
                                if (foundOpt && foundOpt.ingredients) {
                                    parseAndAddIngredients(foundOpt.ingredients, times, ingredientSummary);
                                }
                            });
                        }
                    }
                });
            });

            countText.innerText = `${totalDishesCount} 份菜品 (${orders.length} 单)`;

            // 渲染今日菜单列表
            let menuHtml = '';
            for (let name in dishSummary) {
                let info = dishSummary[name];
                let userStr = Array.from(info.users).join(', ');
                let translatedName = await translateDishName(name);
                menuHtml += `
                    <div class="flex justify-between items-center bg-amber-900/40 px-2 py-1 rounded-lg">
                        <span class="font-bold text-white">${translatedName} <span class="text-[10px] text-amber-200 font-normal">(点单人: ${userStr})</span></span>
                        <span class="bg-amber-600 text-white font-bold px-1.5 py-0.2 rounded text-[10px]">x${info.count}</span>
                    </div>
                `;
            }
            menuContainer.innerHTML = menuHtml;

            // 渲染切洗食材列表
            let prepKeys = Object.keys(ingredientSummary);
            if (prepKeys.length === 0) {
                prepContainer.innerHTML = `<div class="text-amber-200 text-center py-2 text-[11px]">该日菜单暂无明细原料记录</div>`;
                return;
            }

            let prepHtml = '';
            for (let k of prepKeys) {
                let ing = ingredientSummary[k];
                let displayVal = Number.isInteger(ing.total) ? ing.total : ing.total.toFixed(1);
                prepHtml += `
                    <div class="flex justify-between items-center bg-black/15 px-2 py-1 rounded-lg text-[11px]">
                        <span class="text-white font-bold flex items-center"><i class="fa-solid fa-check text-amber-300 mr-1 text-[10px]"></i>${ing.name}</span>
                        <span class="bg-amber-500 text-white font-bold px-1.5 py-0.5 rounded text-[10px]">需准备: ${displayVal}${ing.unit || '份'}</span>
                    </div>
                `;
            }
            prepContainer.innerHTML = prepHtml;
        }

        // 辅助解析原料字符串工具函数
        function parseAndAddIngredients(ingredientsStr, times, summaryObj) {
            if (!ingredientsStr) return;
            let rawParts = ingredientsStr.split(/[,，;；]/);
            rawParts.forEach(part => {
                part = part.trim();
                if (!part) return;
                let match = part.match(/^([\u4e00-\u9fa5\w\s\(\)]+?)\s*([\d\.]+)\s*([a-zA-Z\u4e00-\u9fa5]+)?$/);
                if (match) {
                    let ingName = match[1].trim();
                    let val = parseFloat(match[2]);
                    let unit = match[3] ? match[3].trim() : '';
                    let key = `${ingName}_${unit}`;
                    if (!summaryObj[key]) {
                        summaryObj[key] = { name: ingName, unit: unit, total: 0 };
                    }
                    summaryObj[key].total += val * times;
                } else {
                    let key = `${part}_`;
                    if (!summaryObj[key]) {
                        summaryObj[key] = { name: part, unit: '', total: 0 };
                    }
                    summaryObj[key].total += times;
                }
            });
        }

        function handleOptionCheckboxChange(changedCheckbox) {
            let checkboxes = document.querySelectorAll('input[name="dishOption"]');
            let val = changedCheckbox.value.toLowerCase();
            let isNoneOption = (val.includes('不加') || val.includes('无') || val.includes('no') || val.includes('none'));

            if (isNoneOption && changedCheckbox.checked) {
                checkboxes.forEach(cb => {
                    let cVal = cb.value.toLowerCase();
                    let isOtherNone = (cVal.includes('不加') || cVal.includes('无') || cVal.includes('no') || cVal.includes('none'));
                    if (!isOtherNone) cb.checked = false;
                });
            } else if (!isNoneOption && changedCheckbox.checked) {
                checkboxes.forEach(cb => {
                    let cVal = cb.value.toLowerCase();
                    let isNone = (cVal.includes('不加') || cVal.includes('无') || cVal.includes('no') || cVal.includes('none'));
                    if (isNone) cb.checked = false;
                });
            }
        }

                        <div class="space-x-2 shrink-0 flex items-center">
                            ${editBtnHtml}
                            <button onclick="removeCartItem('${cartKey}')" class="text-red-500 hover:text-red-700 text-[10px] font-bold"><i class="fa-solid fa-trash"></i> ${delBtnText}</button>
                        </div>
                    </div>`;
            }

            if (totalCount > 0) {
                bar.classList.remove('hidden');
                document.getElementById('cartCount').innerText = totalCount;
                document.getElementById('cartDayLabel').innerText = t(getDayKeyMap(selectedDay));
                document.getElementById('cartItemsPreview').innerHTML = previewHtml;
            } else {
                bar.classList.add('hidden');
            }
        }

        function removeCartItem(cartKey) {
            delete cart[cartKey];
            updateCartBar();
        }

        async function submitOrder() {
            if (!currentUser) return openUserModal();
            let keys = Object.keys(cart);
            if (keys.length === 0) return;

            let items = [];

            for (let k in keys) {
                let key = keys[k];
                let item = cart[key];
                items.push({
                    id: item.dish.id,
                    name: item.dish.name,
                    subOption: item.selectedOptions.join(', '),
                    selectedOptions: item.selectedOptions,
                    count: 1
                });
            }

            const newOrder = {
                id: Date.now(),
                user: currentUser,
                targetDay: selectedDay,
                items: items,
                status: '待采购',
                time: new Date().toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' })
            };

            await fetchAllData();
            if (!cloudData.orders) cloudData.orders = [];
            cloudData.orders.unshift(newOrder);
            await saveAllData();

            cart = {};
            updateCartBar();
            await renderDishes();
            renderChefTodayWidget();
            alert((currentLang === 'zh' ? '成功为【' : 'Successfully booked for ') + t(getDayKeyMap(selectedDay)) + (currentLang === 'zh' ? '】提交订单！' : '!'));
        }

        async function openFamilyOrdersModal() {
            document.getElementById('familyOrdersModal').classList.remove('hidden');
            await renderFamilyOrdersList();
        }
        function closeFamilyOrdersModal() { document.getElementById('familyOrdersModal').classList.add('hidden'); }

        async function renderFamilyOrdersList() {
            const container = document.getElementById('familyOrdersListContainer');
            const orders = cloudData.orders || [];
            if (orders.length === 0) return container.innerHTML = `<div class="text-center py-8 text-gray-400 text-xs">${currentLang === 'zh' ? '暂无点单记录~' : 'No orders yet~'}</div>`;

            const daysOrder = ['周一', '周二', '周三', '周四', '周五', '周六', '周日'];
            let groupedByDay = {};
            daysOrder.forEach(d => { groupedByDay[d] = []; });
            orders.forEach(o => { if (groupedByDay[o.targetDay || '周一']) groupedByDay[o.targetDay || '周一'].push(o); });

            let html = '';
            for (let day of daysOrder) {
                let dayOrders = groupedByDay[day];
                if (dayOrders.length > 0) {
                    let ordersUnit = currentLang === 'zh' ? '单' : 'orders';
                    html += `<div class="bg-amber-50/60 border border-amber-200 p-3 rounded-xl space-y-2"><div class="flex justify-between items-center border-b border-amber-200 pb-1.5"><span class="font-bold text-xs text-amber-900">${t(getDayKeyMap(day))}</span><span class="text-[10px] bg-amber-200 text-amber-800 px-2 py-0.5 rounded-full font-bold">${dayOrders.length} ${ordersUnit}</span></div><div class="space-y-2">`;
                    for (let order of dayOrders) {
                        let statusText = order.status === '已完成' ? t('status_completed') : (order.status === '已采购' ? t('status_purchased') : t('status_pending'));
                        let statusColor = order.status === '已完成' ? 'bg-blue-100 text-blue-700' : (order.status === '已采购' ? 'bg-green-100 text-green-700' : 'bg-amber-100 text-amber-800');

                        let itemsHtml = '';
                        for (let i of order.items) {
                            let rawOpts = i.selectedOptions || (i.subOption ? i.subOption.split(', ') : []);
                            let translatedOpts = [];
                            for (let opt of rawOpts) {
                                translatedOpts.push(await translateOptionName(opt.trim()));
                            }
                            let subText = translatedOpts.filter(o => o).length > 0 ? ` (${translatedOpts.filter(o => o).join(', ')})` : '';
                            let itemNameEn = await translateDishName(i.name);
                            itemsHtml += `<div class="flex justify-between"><span>${itemNameEn}${subText} x1</span></div>`;
                        }

                        html += `
                            <div class="bg-white p-2.5 rounded-lg border space-y-1 shadow-xs">
                                <div class="flex justify-between items-center text-[11px]">
                                    <span class="bg-amber-600 text-white px-1.5 py-0.2 rounded font-bold">${order.user}</span>
                                    <span class="text-[10px] px-2 py-0.5 rounded font-bold ${statusColor}">${statusText}</span>
                                </div>
                                <div class="space-y-0.5 text-xs text-gray-700">
                                    ${itemsHtml}
                                </div>
                            </div>
                        `;
                    }
                    html += `</div></div>`;
                }
            }
            container.innerHTML = html;
        }

        async function openMyOrdersModal() {
            if (!currentUser) return openUserModal();
            document.getElementById('myOrdersModal').classList.remove('hidden');
            await renderMyOrdersList();
        }
        function closeMyOrdersModal() { document.getElementById('myOrdersModal').classList.add('hidden'); }

        async function renderMyOrdersList() {
            const container = document.getElementById('myOrdersListContainer');
            const myOrders = (cloudData.orders || []).filter(o => o.user === currentUser);
            if (myOrders.length === 0) return container.innerHTML = `<div class="text-center py-8 text-gray-400 text-xs">${currentLang === 'zh' ? '你还没有提交过预定单~' : 'You have no bookings~'}</div>`;

            let html = '';
            for (let order of myOrders) {
                let statusText = order.status === '已完成' ? t('status_completed') : (order.status === '已采购' ? t('status_purchased') : t('status_pending'));
                let statusColor = order.status === '已完成' ? 'bg-blue-100 text-blue-700' : (order.status === '已采购' ? 'bg-green-100 text-green-700' : 'bg-amber-200 text-amber-800');
                let editBtnText = currentLang === 'zh' ? '修改' : 'Edit';
                let delItemText = currentLang === 'zh' ? '删除' : 'Delete';
                let delOrderText = currentLang === 'zh' ? '删除整单' : 'Delete Order';

                let itemsHtml = '';
                for (let index = 0; index < order.items.length; index++) {
                    let i = order.items[index];
                    let rawOpts = i.selectedOptions || (i.subOption ? i.subOption.split(', ') : []);
                    let translatedOpts = [];
                    for (let opt of rawOpts) {
                        translatedOpts.push(await translateOptionName(opt.trim()));
                    }
                    let subText = translatedOpts.filter(o => o).length > 0 ? ` (${translatedOpts.filter(o => o).join(', ')})` : '';

                    let dish = (cloudData.dishes || []).find(d => d.id === i.id);
                    let hasOptions = dish && dish.options && dish.options.length > 0;
                    let editBtnHtml = hasOptions ? `<button onclick="openEditOrderOptionsModal(${order.id}, ${index})" class="text-amber-700 font-bold text-[11px]"><i class="fa-solid fa-pen"></i> ${editBtnText}</button>` : '';
                    let itemNameEn = await translateDishName(i.name);

                    itemsHtml += `
                        <div class="flex justify-between items-center bg-white p-2 rounded-lg border">
                            <span>${itemNameEn}${subText} x1</span>
                            <div class="space-x-2">
                                ${editBtnHtml}
                                <button onclick="deleteMyOrderItem(${order.id}, ${index})" class="text-red-600 font-bold text-[11px]"><i class="fa-solid fa-trash"></i> ${delItemText}</button>
                            </div>
                        </div>
                    `;
                }

                html += `
                    <div class="bg-amber-50/50 border border-amber-200 p-3 rounded-xl space-y-1.5">
                        <div class="flex justify-between items-center border-b border-amber-100 pb-1">
                            <span class="font-bold text-xs text-amber-900">${t(getDayKeyMap(order.targetDay || '周一'))}</span>
                            <span class="text-[10px] px-2 py-0.5 rounded-full font-bold ${statusColor}">${statusText}</span>
                        </div>
                        <div class="space-y-1 text-xs text-gray-700">
                            ${itemsHtml}
                        </div>
                        <div class="flex justify-between items-center pt-1 border-t border-amber-100 text-[10px]">
                            <span class="text-gray-400">${order.time || ''}</span>
                            <button onclick="deleteMyOrder(${order.id})" class="text-red-500 font-bold">${delOrderText}</button>
                        </div>
                    </div>
                `;
            }
            container.innerHTML = html;
        }

        async function deleteMyOrder(orderId) {
            let msg = currentLang === 'zh' ? '确定要删除整条预定单吗？' : 'Are you sure to delete this entire order?';
            if (!confirm(msg)) return;
            await fetchAllData();
            cloudData.orders = (cloudData.orders || []).filter(o => o.id !== orderId);
            await saveAllData();
            await renderMyOrdersList();
            renderChefTodayWidget();
        }

        async function deleteMyOrderItem(orderId, itemIndex) {
            let msg = currentLang === 'zh' ? '确定要从订单中删除该菜品吗？' : 'Are you sure to remove this item?';
            if (!confirm(msg)) return;
            await fetchAllData();
            let order = (cloudData.orders || []).find(o => o.id === orderId);
            if (order) {
                order.items.splice(itemIndex, 1);
                if (order.items.length === 0) {
                    cloudData.orders = cloudData.orders.filter(o => o.id !== orderId);
                }
                await saveAllData();
                await renderMyOrdersList();
                renderChefTodayWidget();
            }
        }
    </script>
</body>
</html>
