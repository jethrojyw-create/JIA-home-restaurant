<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>家庭周末点菜系统 (前台)</title>
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
    <style>
        .no-scrollbar::-webkit-scrollbar { display: none; }
        .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
    </style>
</head>
<body class="bg-amber-50/40 text-gray-800 pb-36">

    <!-- 顶部导航与星期选择 -->
    <header class="bg-white shadow-xs sticky top-0 z-40 px-3 py-2.5 space-y-2 w-full">
        <div class="flex justify-between items-center">
            <div class="flex items-center space-x-2">
                <span class="text-xl">🍲</span>
                <div>
                    <h1 class="font-bold text-sm text-amber-900 leading-tight">家庭周末点菜系统</h1>
                    <p class="text-[10px] text-gray-400">选择心仪的菜品与配菜，享受美味周末</p>
                </div>
            </div>
            <div class="flex items-center space-x-2">
                <button onclick="openUserOrdersModal()" class="bg-amber-100 hover:bg-amber-200 text-amber-900 px-3 py-1.5 rounded-lg text-xs font-bold transition flex items-center space-x-1">
                    <i class="fa-solid fa-receipt"></i>
                    <span>我的点单</span>
                </button>
            </div>
        </div>

        <!-- 星期选择横向滚动栏 -->
        <div class="flex space-x-1.5 overflow-x-auto no-scrollbar py-1" id="daySelectorContainer">
            <!-- 动态渲染周一至周日 -->
        </div>
    </header>

    <!-- 主体菜单区 -->
    <main class="w-full max-w-lg mx-auto p-3 space-y-4">
        <!-- 分类切换标签 -->
        <div class="flex space-x-2 overflow-x-auto no-scrollbar text-xs font-bold" id="categoryTabsContainer">
            <button onclick="filterCategory('全部')" class="cat-btn px-3 py-1.5 rounded-full bg-amber-600 text-white shrink-0 shadow-xs">全部</button>
            <button onclick="filterCategory('热菜')" class="cat-btn px-3 py-1.5 rounded-full bg-white text-gray-600 border shrink-0">热菜</button>
            <button onclick="filterCategory('凉菜')" class="cat-btn px-3 py-1.5 rounded-full bg-white text-gray-600 border shrink-0">凉菜</button>
            <button onclick="filterCategory('主食/汤品')" class="cat-btn px-3 py-1.5 rounded-full bg-white text-gray-600 border shrink-0">主食/汤品</button>
            <button onclick="filterCategory('饮品/甜点')" class="cat-btn px-3 py-1.5 rounded-full bg-white text-gray-600 border shrink-0">饮品/甜点</button>
        </div>

        <!-- 菜品列表 -->
        <div id="menuListContainer" class="grid grid-cols-1 gap-3">
            <div class="text-center py-16 text-gray-400 text-xs">正在加载美味菜单...</div>
        </div>
    </main>

    <!-- 底部已选购物车悬浮栏 -->
    <div id="cartBar" class="fixed bottom-0 left-0 right-0 bg-white/95 backdrop-blur border-t border-amber-100 p-3 z-30 shadow-lg max-w-lg mx-auto hidden">
        <div class="flex justify-between items-center mb-2 text-xs">
            <div class="flex items-center space-x-2">
                <span class="bg-amber-600 text-white w-6 h-6 rounded-full flex items-center justify-center font-bold" id="cartCount">0</span>
                <span class="font-bold text-amber-900" id="cartSummaryText">已选 0 样菜品</span>
            </div>
            <span class="font-extrabold text-amber-800 text-sm">总计: ¥<span id="cartTotalPrice">0</span></span>
        </div>
        <div class="flex space-x-2">
            <button onclick="openCartPreview()" class="flex-1 bg-amber-100 hover:bg-amber-200 text-amber-900 py-2.5 rounded-xl font-bold text-xs transition">查看明细</button>
            <button onclick="submitOrder()" class="flex-2 bg-amber-600 hover:bg-amber-700 text-white py-2.5 rounded-xl font-bold text-xs shadow-md transition">提交给大厨 (<span id="cartTargetDayText">周一</span>)</button>
        </div>
    </div>

    <!-- 配菜选择弹窗 -->
    <div id="optionsModal" class="fixed inset-0 bg-black/60 z-50 flex items-center justify-center hidden p-3">
        <div class="bg-white w-full max-w-sm rounded-2xl p-4 shadow-2xl space-y-3">
            <div class="flex justify-between items-center border-b pb-2">
                <h3 class="font-bold text-sm text-amber-900" id="optionsDishName">选择配菜与偏好</h3>
                <button onclick="closeOptionsModal()" class="text-gray-400 hover:text-gray-600 text-xs"><i class="fa-solid fa-xmark text-base"></i></button>
            </div>
            <div id="optionsListContainer" class="space-y-2 max-h-60 overflow-y-auto text-xs py-1">
                <!-- 动态生成配菜复选框 -->
            </div>
            <div class="flex space-x-2 pt-2">
                <button onclick="closeOptionsModal()" class="flex-1 bg-gray-100 py-2 rounded-xl text-xs font-bold">取消</button>
                <button onclick="confirmAddWithdrawnOptions()" class="flex-1 bg-amber-600 text-white py-2 rounded-xl text-xs font-bold">确认加入购物车</button>
            </div>
        </div>
    </div>

    <!-- 购物车明细预览弹窗 -->
    <div id="cartModal" class="fixed inset-0 bg-black/60 z-50 flex items-center justify-center hidden p-3">
        <div class="bg-white w-full max-w-sm rounded-2xl p-4 shadow-2xl space-y-3 max-h-[80vh] flex flex-col">
            <div class="flex justify-between items-center border-b pb-2">
                <h3 class="font-bold text-sm text-amber-900">购物车明细</h3>
                <button onclick="closeCartPreview()" class="text-gray-400 text-xs"><i class="fa-solid fa-xmark text-base"></i></button>
            </div>
            <div id="cartModalItemsContainer" class="flex-1 overflow-y-auto space-y-2 text-xs divide-y divide-gray-100">
                <!-- 购物车明细列表 -->
            </div>
            <div class="pt-2 border-t flex justify-between items-center text-xs font-bold">
                <span>合计</span>
                <span class="text-amber-800 text-sm">¥<span id="modalTotalPrice">0</span></span>
            </div>
            <button onclick="submitOrder(); closeCartPreview();" class="w-full bg-amber-600 text-white py-2.5 rounded-xl font-bold text-xs shadow-md">立即提交订单</button>
        </div>
    </div>

    <!-- 我的点单记录弹窗 -->
    <div id="userOrdersModal" class="fixed inset-0 bg-black/60 z-50 flex items-center justify-center hidden p-3">
        <div class="bg-white w-full max-w-sm rounded-2xl p-4 shadow-2xl space-y-3 max-h-[85vh] flex flex-col">
            <div class="flex justify-between items-center border-b pb-2">
                <h3 class="font-bold text-sm text-amber-900">家庭成员点单记录</h3>
                <button onclick="closeUserOrdersModal()" class="text-gray-400 text-xs"><i class="fa-solid fa-xmark text-base"></i></button>
            </div>
            <div id="userOrdersContainer" class="flex-1 overflow-y-auto space-y-2.5 text-xs">
                <div class="text-center py-10 text-gray-400">加载中...</div>
            </div>
            <button onclick="closeUserOrdersModal()" class="w-full bg-gray-100 text-gray-700 py-2 rounded-xl font-bold text-xs">关闭</button>
        </div>
    </div>

    <!-- 用户身份设置弹窗 -->
    <div id="userSetupModal" class="fixed inset-0 bg-black/70 z-50 flex items-center justify-center p-3 hidden">
        <div class="bg-white w-full max-w-xs rounded-2xl p-4 shadow-2xl space-y-3">
            <h3 class="font-bold text-sm text-amber-900">👋 欢迎！请先告诉大家你是谁</h3>
            <p class="text-[11px] text-gray-400">输入您的称呼，方便家里大厨统计点菜：</p>
            <input type="text" id="userNameInput" placeholder="例如：爸爸、妈妈、宝儿" class="w-full bg-amber-50/60 border border-amber-200 rounded-xl px-3 py-2 text-xs outline-none">
            <button onclick="saveUserName()" class="w-full bg-amber-600 text-white py-2.5 rounded-xl font-bold text-xs shadow-md">开始点菜</button>
        </div>
    </div>

    <script>
        const API_URL = 'https://api.npoint.io/692e9e8f65204c754fc5';

        let cloudData = { dishes: [], orders: [] };
        let currentDay = '周一';
        let currentCategory = '全部';
        let cart = {}; // key: dishId_optionsHash, value: { dish, count, selectedOptions }
        let currentUser = localStorage.getItem('family_current_user') || '';
        let activeDishForOptions = null; // 当前正在选配菜的菜品

        const days = ['周一', '周二', '周三', '周四', '周五', '周六', '周日'];

        async function fetchAllData() {
            try {
                let res = await fetch(API_URL + '?t=' + Date.now());
                let json = await res.json();
                if (json && json.dishes) {
                    cloudData.dishes = json.dishes;
                    cloudData.orders = json.orders || [];
                    localStorage.setItem('family_dishes_only_backup', JSON.stringify(cloudData.dishes));
                }
            } catch (e) {
                console.log('网络同步失败，读取本地缓存');
            }

            if (!cloudData.dishes || cloudData.dishes.length === 0) {
                let local = localStorage.getItem('family_dishes_only_backup');
                if (local) cloudData.dishes = JSON.parse(local);
            }

            renderDaySelector();
            renderMenu();
        }

        window.onload = function() {
            if (!currentUser) {
                document.getElementById('userSetupModal').classList.remove('hidden');
            }
            fetchAllData();
            setInterval(fetchAllData, 8000);
        }

        function saveUserName() {
            let name = document.getElementById('userNameInput').value.trim();
            if (!name) {
                alert('请输入您的称呼！');
                return;
            }
            currentUser = name;
            localStorage.setItem('family_current_user', name);
            document.getElementById('userSetupModal').classList.add('hidden');
        }

        function renderDaySelector() {
            const container = document.getElementById('daySelectorContainer');
            container.innerHTML = days.map(d => {
                let isSelected = d === currentDay;
                return `
                    <button onclick="switchDay('${d}')" class="px-3 py-1.5 rounded-xl font-bold text-xs transition shrink-0 ${isSelected ? 'bg-amber-600 text-white shadow-xs' : 'bg-white text-gray-600 border border-amber-100'}">
                        ${d}
                    </button>
                `;
            }).join('');
            document.getElementById('cartTargetDayText').innerText = currentDay;
        }

        function switchDay(day) {
            currentDay = day;
            renderDaySelector();
        }

        function filterCategory(cat) {
            currentCategory = cat;
            document.querySelectorAll('.cat-btn').forEach(btn => {
                if (btn.innerText === cat) {
                    btn.className = "cat-btn px-3 py-1.5 rounded-full bg-amber-600 text-white shrink-0 shadow-xs";
                } else {
                    btn.className = "cat-btn px-3 py-1.5 rounded-full bg-white text-gray-600 border shrink-0";
                }
            });
            renderMenu();
        }

        function renderMenu() {
            const container = document.getElementById('menuListContainer');
            let dishes = cloudData.dishes || [];

            if (currentCategory !== '全部') {
                dishes = dishes.filter(d => d.category === currentCategory);
            }

            if (dishes.length === 0) {
                container.innerHTML = `<div class="text-center py-16 text-gray-400 text-xs">当前分类暂无菜品~</div>`;
                return;
            }

            container.innerHTML = dishes.map(dish => {
                return `
                    <div class="bg-white rounded-2xl p-3 border border-amber-100 shadow-xs flex items-center justify-between space-x-3">
                        <img src="${dish.image}" class="w-16 h-16 object-cover rounded-xl shrink-0">
                        <div class="flex-1 min-w-0 space-y-1">
                            <div class="flex items-center space-x-1.5">
                                <h3 class="font-bold text-xs text-gray-800 truncate">${dish.name}</h3>
                                <span class="text-[9px] bg-amber-50 text-amber-700 px-1 py-0.2 rounded">${dish.category || '热菜'}</span>
                            </div>
                            <p class="text-[10px] text-gray-400 truncate">${dish.desc || ''}</p>
                            <p class="text-xs font-extrabold text-amber-700">¥${dish.price}</p>
                        </div>
                        <div class="shrink-0">
                            ${dish.options && dish.options.length > 0 ? `
                                <button onclick="openOptionsModal(${dish.id})" class="bg-amber-100 hover:bg-amber-200 text-amber-900 font-bold px-3 py-1.5 rounded-xl text-xs transition">
                                    选配菜 ➕
                                </button>
                            ` : `
                                <button onclick="addSimpleDishToCart(${dish.id})" class="bg-amber-600 hover:bg-amber-700 text-white font-bold px-3 py-1.5 rounded-xl text-xs transition shadow-xs">
                                    点单 ➕
                                </button>
                            `}
                        </div>
                    </div>
                `;
            }).join('');
        }

        // 打开配菜选择弹窗
        function openOptionsModal(dishId) {
            let dish = (cloudData.dishes || []).find(d => d.id === dishId);
            if (!dish) return;
            activeDishForOptions = dish;

            document.getElementById('optionsDishName').innerText = `选择 ${dish.name} 的配菜`;
            let container = document.getElementById('optionsListContainer');
            
            if (!dish.options || dish.options.length === 0) {
                container.innerHTML = `<div class="text-center py-4 text-gray-400">该菜品暂无可选配菜</div>`;
            } else {
                container.innerHTML = dish.options.map((opt, idx) => `
                    <label class="flex items-center justify-between p-2 rounded-xl bg-amber-50/50 border border-amber-100 cursor-pointer">
                        <div class="flex items-center space-x-2">
                            <input type="checkbox" name="dishOption" value="${opt.name}" data-price="${opt.price}" class="w-4 h-4 text-amber-600 rounded">
                            <span class="font-bold text-gray-800">${opt.name}</span>
                        </div>
                        <span class="text-amber-700 font-semibold">${opt.price > 0 ? `+¥${opt.price}` : '免费'}</span>
                    </label>
                `).join('');
            }

            document.getElementById('optionsModal').classList.remove('hidden');
        }

        function closeOptionsModal() {
            document.getElementById('optionsModal').classList.add('hidden');
            activeDishForOptions = null;
        }

        function confirmAddWithdrawnOptions() {
            if (!activeDishForOptions) return;
            let checkboxes = document.querySelectorAll('input[name="dishOption"]:checked');
            let selectedOptions = [];
            let extraPrice = 0;

            checkboxes.forEach(cb => {
                selectedOptions.push(cb.value);
                extraPrice += parseFloat(cb.dataset.price) || 0;
            });

            selectedOptions.sort(); // 排序确保组合唯一性
            let key = `${activeDishForOptions.id}_${selectedOptions.join('_')}`;

            if (!cart[key]) {
                cart[key] = {
                    dish: activeDishForOptions,
                    count: 1,
                    selectedOptions: selectedOptions,
                    unitPrice: activeDishForOptions.price + extraPrice
                };
            } else {
                cart[key].count++;
            }

            closeOptionsModal();
            updateCartBar();
        }

        function addSimpleDishToCart(dishId) {
            let dish = (cloudData.dishes || []).find(d => d.id === dishId);
            if (!dish) return;

            let key = `${dish.id}_`;
            if (!cart[key]) {
                cart[key] = {
                    dish: dish,
                    count: 1,
                    selectedOptions: [],
                    unitPrice: dish.price
                };
            } else {
                cart[key].count++;
            }
            updateCartBar();
        }

        function updateCartBar() {
            let totalCount = 0;
            let totalPrice = 0;

            for (let k in cart) {
                totalCount += cart[k].count;
                totalPrice += cart[k].unitPrice * cart[k].count;
            }

            const cartBar = document.getElementById('cartBar');
            if (totalCount > 0) {
                cartBar.classList.remove('hidden');
            } else {
                cartBar.classList.add('hidden');
            }

            document.getElementById('cartCount').innerText = totalCount;
            document.getElementById('cartSummaryText').innerText = `已选 ${totalCount} 样菜品`;
            document.getElementById('cartTotalPrice').innerText = totalPrice;
            document.getElementById('modalTotalPrice').innerText = totalPrice;
        }

        function openCartPreview() {
            const container = document.getElementById('cartModalItemsContainer');
            let keys = Object.keys(cart);

            if (keys.length === 0) {
                container.innerHTML = `<div class="text-center py-6 text-gray-400">购物车为空</div>`;
                return;
            }

            container.innerHTML = keys.map(k => {
                let item = cart[k];
                return `
                    py-2 flex justify-between items-center">
                        <div class="space-y-0.5 min-w-0 flex-1 pr-2">
                            <h4 class="font-bold text-gray-800 truncate">${item.dish.name}</h4>
                            ${item.selectedOptions.length > 0 ? `<p class="text-[10px] text-emerald-700">配菜: ${item.selectedOptions.join(', ')}</p>` : ''}
                            <p class="text-[10px] text-amber-700 font-semibold">单价: ¥${item.unitPrice}</p>
                        </div>
                        <div class="flex items-center space-x-2 shrink-0">
                            <button onclick="changeCartCount('${k}', -1)" class="w-6 h-6 bg-gray-100 rounded-full font-bold">-</button>
                            <span class="font-bold">${item.count}</span>
                            <button onclick="changeCartCount('${k}', 1)" class="w-6 h-6 bg-amber-100 text-amber-900 rounded-full font-bold">+</button>
                        </div>
                    </div>
                `;
            }).join('');

            document.getElementById('cartModal').classList.remove('hidden');
        }

        function closeCartPreview() {
            document.getElementById('cartModal').classList.add('hidden');
        }

        function changeCartCount(key, delta) {
            if (cart[key]) {
                cart[key].count += delta;
                if (cart[key].count <= 0) {
                    delete cart[key];
                }
            }
            updateCartBar();
            openCartPreview();
        }

        async function submitOrder() {
            if (!currentUser) {
                document.getElementById('userSetupModal').classList.remove('hidden');
                return;
            }

            let keys = Object.keys(cart);
            if (keys.length === 0) {
                alert('请先选择要点的菜品！');
                return;
            }

            let orderItems = keys.map(k => {
                let item = cart[k];
                return {
                    id: item.dish.id,
                    name: item.dish.name,
                    price: item.unitPrice,
                    count: item.count,
                    selectedOptions: item.selectedOptions,
                    itemTotalPrice: item.unitPrice * item.count
                };
            });

            let totalPrice = orderItems.reduce((sum, i) => sum + i.itemTotalPrice, 0);

            let newOrder = {
                id: Date.now(),
                user: currentUser,
                targetDay: currentDay,
                time: new Date().toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' }),
                items: orderItems,
                totalPrice: totalPrice,
                status: '待采购'
            };

            try {
                let res = await fetch(API_URL + '?t=' + Date.now());
                let json = await res.json();
                if (json) {
                    cloudData.dishes = json.dishes || cloudData.dishes;
                    cloudData.orders = json.orders || [];
                }
            } catch (e) {
                console.log('同步云端最新数据失败');
            }

            cloudData.orders.push(newOrder);

            try {
                await fetch(API_URL, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(cloudData)
                });
                alert(`🎉 成功提交给大厨（${currentDay}）！`);
                cart = {};
                updateCartBar();
            } catch (e) {
                alert('提交失败，请检查网络！');
            }
        }

        async function openUserOrdersModal() {
            document.getElementById('userOrdersModal').classList.remove('hidden');
            const container = document.getElementById('userOrdersContainer');
            container.innerHTML = `<div class="text-center py-6 text-gray-400">正在获取记录...</div>`;

            try {
                let res = await fetch(API_URL + '?t=' + Date.now());
                let json = await res.json();
                if (json && json.orders) {
                    cloudData.orders = json.orders;
                }
            } catch (e) {}

            let orders = cloudData.orders || [];
            if (orders.length === 0) {
                container.innerHTML = `<div class="text-center py-6 text-gray-400">暂无任何点单记录</div>`;
                return;
            }

            container.innerHTML = orders.map(order => `
                <div class="bg-amber-50/60 border border-amber-200 p-2.5 rounded-xl space-y-1">
                    <div class="flex justify-between items-center text-[10px] text-gray-400 border-b pb-1">
                        <span class="font-bold text-amber-900">${order.user} (${order.targetDay})</span>
                        <span>${order.time || ''}</span>
                    </div>
                    <div class="space-y-1 py-0.5">
                        ${order.items.map(i => `
                            <div class="flex justify-between text-xs">
                                <div>
                                    <span class="font-bold">${i.name} x${i.count}</span>${i.selectedOptions && i.selectedOptions.length > 0 ? `<div class="text-[10px] text-emerald-700">配菜: ${i.selectedOptions.join(', ')}</div>` : ''}
                                </div>
                                <span class="font-bold">¥${i.itemTotalPrice}</span>
                            </div>
                        `).join('')}
                    </div>
                    <div class="flex justify-between items-center pt-1 border-t text-[10px]">
                        <span class="px-2 py-0.5 rounded-full font-bold ${order.status === '已完成' ? 'bg-blue-100 text-blue-700' : (order.status === '已采购' ? 'bg-green-100 text-green-700' : 'bg-amber-200 text-amber-800')}">${order.status || '待采购'}</span>
                        <span class="font-bold text-amber-900">总计: ¥${order.totalPrice}</span>
                    </div>
                </div>
            `).join('');
        }

        function closeUserOrdersModal() {
            document.getElementById('userOrdersModal').classList.add('hidden');
        }
    </script>
</body>
</html>
